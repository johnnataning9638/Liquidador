name: _fix_sancion_tradicional_once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir regla de sancion y pruebas
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          def replace_motor(path, official=False):
              p=Path(path); s=p.read_text()
              start='      // REGLA DE IMPUTACIÓN DE SANCIÓN — FECHA DE SANCIÓN COMO ÚNICO CORTE.'
              i=s.index(start)
              end='        && pago.fecha>=fechaSancionReal;'
              j=s.index(end,i)+len(end)
              lines=[
                '      // REGLA DE IMPUTACIÓN DE SANCIÓN — SEPARACIÓN TRADICIONAL / SIMPLE.',
                '      // RÉGIMEN SIMPLE (4, 5 Y 6 CUOTAS): esta actualización NO modifica su',
                '      // lógica existente. Se conserva el comportamiento SIMPLE anterior.',
                '      // RÉGIMEN TRADICIONAL (1, 2 Y 3 CUOTAS): el único corte para decidir si',
                '      // el pago puede recibir sanción es la FECHA DE SANCIÓN/PRESENTACIÓN.',
                '      // La fecha de vencimiento NO participa en esta decisión.'
              ]
              if official:
                  lines += [
                    '      const cantidadCuotas=saldosVto.length;',
                    '      const esSimplePorAnticipos=cantidadCuotas>=4&&cantidadCuotas<=6;'
                  ]
              lines += [
                '      const sancionHabilitadaPorFecha=esSimplePorAnticipos',
                '        ? (!fechaSancionReal || pago.fecha>=fechaSancionReal)',
                '        : (',
                '            datos.tieneSancion==="SI"',
                '            && sancionBaseOriginal>0',
                '            && Boolean(fechaSancionReal)',
                '            && pago.fecha>=fechaSancionReal',
                '          );'
              ]
              p.write_text(s[:i]+'\n'.join(lines)+s[j:])

          replace_motor('js/motor-liquidacion.js')
          replace_motor('js/motor-liquidacion-oficial.js', True)

          p=Path('tests/regresion-matematica.mjs')
          s=p.read_text()
          start=s.index('// 1–3 cuotas:')
          end=s.index('// SIMPLE 4–6 cuotas:',start)
          new='''// TRADICIONAL 1–3 cuotas: el único corte de sanción es fecha de sanción.
          // Un pago anterior a la fecha de sanción NO recibe sanción, aunque ya haya vencido.
          for (const count of [1, 2, 3]) {
            const r = motor().calcular(obligation({ count, paymentDate: "2025-12-31", paymentValue: 100000 }));
            ok(`${count} cuota(s): pago anterior a fecha de sanción sin sanción`, r.detalle[0].aplicado.sancion === 0);
          }

          // TRADICIONAL 1–3 cuotas: pago en la fecha de sanción sí puede imputar sanción.
          for (const count of [1, 2, 3]) {
            const r = motor().calcular(obligation({ count, paymentDate: "2026-01-01", paymentValue: 100000 }));
            ok(`${count} cuota(s): pago en fecha de sanción puede imputar sanción`, r.detalle[0].aplicado.sancion > 0);
          }

          // TRADICIONAL: el vencimiento NO puede habilitar sanción por sí solo.
          for (const count of [1, 2, 3]) {
            const r = motor().calcular(obligation({ count, paymentDate: "2025-12-31", paymentValue: 100000 }));
            ok(`${count} cuota(s): pago posterior al vencimiento pero anterior a sanción sigue sin sanción`, r.detalle[0].aplicado.sancion === 0);
          }

          '''
          s=s[:start]+new+s[end:]
          marker='// Proporcionalidad: el pago de $1.001'
          idx=s.index(marker)
          simple='''// SIMPLE 4–6 cuotas: NO se modifica con la nueva regla de TRADICIONAL.
          // Se conserva la lógica SIMPLE existente para un pago anterior a fecha de sanción.
          for (const count of [4, 5, 6]) {
            const r = motor().calcular(obligation({ count, paymentDate: "2025-12-31", paymentValue: 100000 }));
            ok(`SIMPLE ${count} cuotas: conserva lógica existente antes de fecha de sanción`, r.detalle[0].aplicado.sancion === 0);
          }

          '''
          s=s[:idx]+simple+s[idx:]
          p.write_text(s)
          PY
          node --check js/motor-liquidacion.js
          node --check js/motor-liquidacion-oficial.js
          node --check tests/regresion-matematica.mjs
          node --experimental-default-type=module tests/regresion-matematica.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/motor-liquidacion.js js/motor-liquidacion-oficial.js tests/regresion-matematica.mjs
          git rm .github/workflows/_fix_sancion_tradicional_once.yml
          git commit -m 'fix: separar sancion tradicional de SIMPLE por fecha de sancion'
          git push origin main
