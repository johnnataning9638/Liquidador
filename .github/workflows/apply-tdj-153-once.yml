name: Apply TDJ v16.33.153 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar corrección exacta al motor real
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('js/tdj-core-16.33.143.js')
          text = p.read_text(encoding='utf-8')
          old = '''        if(aplicado<=0)continue;\n'''
          new = '''        if(aplicado<=0){\n          // REGLA v16.33.153: si la obligación actual todavía tiene saldo,\n          // el título NO puede saltar a la obligación siguiente.\n          const saldoObligacionActual=Math.max(0,Number(ultimo?.saldo?.total??r.total??0));\n          if(saldoObligacionActual>0.5)break;\n          continue;\n        }\n'''
          if old not in text:
              raise SystemExit('NO_SE_ENCONTRO_BLOQUE_APLICADO_CERO')
          text = text.replace(old, new, 1)
          old2 = '''        disponible=excedente;\n\n        if(aplicado>0){\n'''
          new2 = '''        disponible=excedente;\n\n        // REGLA FUNDAMENTAL v16.33.153:\n        // PRIMERO SE AGOTA LA OBLIGACIÓN ACTUAL. Solo si el saldo quedó en\n        // cero puede el remanente del mismo título continuar a la siguiente.\n        // Si queda saldo, el siguiente TDJ retomará la obligación actual.\n        const saldoObligacionActual=Math.max(0,Number(ultimo?.saldo?.total??r.total??0));\n        if(saldoObligacionActual>0.5)break;\n\n        if(aplicado>0){\n'''
          if old2 not in text:
              raise SystemExit('NO_SE_ENCONTRO_BLOQUE_DISPONIBLE')
          text = text.replace(old2, new2, 1)
          p.write_text(text, encoding='utf-8')

          replacements = {
              'js/tdj-core-16.33.143.js': [
                  ('?v=16.33.152', '?v=16.33.153'),
                  ('?v=16.33.151', '?v=16.33.153'),
              ],
              'js/tdj.js': [('16.33.152','16.33.153'),('16.33.151','16.33.153'),('16.33.150','16.33.153'),('16.33.149','16.33.153'),('16.33.148','16.33.153')],
              'js/prioridad-tdj-v132.js': [('16.33.152','16.33.153'),('16.33.151','16.33.153'),('16.33.150','16.33.153'),('16.33.148','16.33.153')],
              'titulos.html': [('16.33.152','16.33.153'),('16.33.151','16.33.153'),('16.33.150','16.33.153'),('16.33.149','16.33.153')],
          }
          for name,pairs in replacements.items():
              q=Path(name); s=q.read_text(encoding='utf-8'); old_s=s
              for old,new in pairs: s=s.replace(old,new)
              if s!=old_s:q.write_text(s,encoding='utf-8')
          PY

      - name: Verificar corrección y regresiones
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'REGLA FUNDAMENTAL v16.33.153' js/tdj-core-16.33.143.js
          grep -F 'if(saldoObligacionActual>0.5)break;' js/tdj-core-16.33.143.js
          grep -F 'prioridad-tdj-v132.js?v=16.33.153' js/tdj-core-16.33.143.js
          grep -F 'tdj-core-16.33.143.js?v=16.33.153' js/tdj.js
          grep -F 'js/tdj.js?v=16.33.153' titulos.html
          node --check js/tdj-core-16.33.143.js
          node --check js/tdj.js
          node --check js/prioridad-tdj.js
          node --check js/prioridad-tdj-v132.js
          node tests/regresion-secuencia-tdj-153.mjs
          node tests/regresion-secuencia-tdj-152.mjs
          node tests/regresion-secuencia-tdj-151.mjs

      - name: Publicar y eliminar correctivo temporal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-tdj-153-once.yml
          git add js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js titulos.html
          git commit -m 'fix: agotar obligacion actual antes de avanzar TDJ v16.33.153'
          git push origin main
