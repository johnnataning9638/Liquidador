name: _fix_fecha_sancion_once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar regla fecha sancion
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('js/motor-liquidacion.js')
          s=p.read_text()
          old='''      // REGLA DE IMPUTACIÓN DE SANCIÓN — RÉGIMEN TRADICIONAL (1, 2 Y 3 CUOTAS):\n      // La sanción SOLO puede participar si el funcionario indicó TIENE SANCIÓN = SÍ.\n      // En régimen tradicional, el punto de corte para cada pago es la FECHA DE\n      // VENCIMIENTO PARA DECLARAR, que corresponde a la FECHA DE LA CUOTA 1.\n      // - Pago anterior a la cuota 1: NO participa en sanción, aunque la\n      //   declaración posteriormente haya sido presentada extemporáneamente.\n      // - Pago igual o posterior a la cuota 1: SÍ puede participar en sanción,\n      //   siempre que exista sanción y exista fecha de presentación/sanción.\n      //\n      // RÉGIMEN SIMPLE (4, 5 Y 6 CUOTAS): ESTA REGLA NUEVA NO SE APLICA.\n      // Se conserva intacta la lógica SIMPLE existente.\n      const fechaVencimientoDeclarar=fechaISO(\n        saldosVto.find(v=>Number(v.numero)===1)?.fecha || saldosVto[0]?.fecha || \"\"\n      );\n      const sancionHabilitadaPorFecha=esSimplePorAnticipos\n        ? true\n        : (\n            datos.tieneSancion===\"SI\"\n            && sancionBaseOriginal>0\n            && Boolean(fechaSancionReal)\n            && Boolean(fechaVencimientoDeclarar)\n            && pago.fecha>fechaVencimientoDeclarar\n          );\n'''
          new='''      // REGLA DE IMPUTACIÓN DE SANCIÓN — FECHA DE SANCIÓN COMO ÚNICO CORTE.\n      // La fecha de vencimiento NO participa en la decisión de imputar sanción.\n      // - Pago anterior a fechaSancion: NO recibe sanción.\n      // - Pago igual o posterior a fechaSancion: puede recibir sanción.\n      // Esta misma regla aplica al régimen ordinario y a SIMPLE (4-6 cuotas).\n      const sancionHabilitadaPorFecha=\n        datos.tieneSancion===\"SI\"\n        && sancionBaseOriginal>0\n        && Boolean(fechaSancionReal)\n        && pago.fecha>=fechaSancionReal;\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          p=Path('js/motor-liquidacion-oficial.js')
          s=p.read_text()
          old='''      // TIENE SANCIÓN = SÍ. Para obligaciones tradicionales, el punto de\n      // corte del pago es la FECHA DE VENCIMIENTO PARA DECLARAR = CUOTA 1.\n      // Los pagos anteriores a cuota 1 no reciben componente de sanción,\n      // aunque la presentación posterior haya sido extemporánea.\n      //\n      // RÉGIMEN SIMPLE (4, 5 Y 6 CUOTAS): esta nueva regla no se aplica.\n      // Se conserva la lógica existente de SIMPLE.\n      const cantidadCuotas=saldosVto.length;\n      const esSimplePorAnticipos=cantidadCuotas>=4&&cantidadCuotas<=6;\n      const fechaVencimientoDeclarar=fechaISO(\n        saldosVto.find(v=>Number(v.numero)===1)?.fecha || saldosVto[0]?.fecha || \"\"\n      );\n      const sancionHabilitadaPorFecha=esSimplePorAnticipos\n        ? (!fechaSancionReal || pago.fecha>=fechaSancionReal)\n        : (\n            datos.tieneSancion===\"SI\"\n            && sancionBaseOriginal>0\n            && Boolean(fechaSancionReal)\n            && Boolean(fechaVencimientoDeclarar)\n            && pago.fecha>fechaVencimientoDeclarar\n          );\n'''
          new='''      // REGLA DE IMPUTACIÓN DE SANCIÓN — FECHA DE SANCIÓN COMO ÚNICO CORTE.\n      // La fecha de vencimiento NO participa en la decisión de imputar sanción.\n      // - Pago anterior a fechaSancion: NO recibe sanción.\n      // - Pago igual o posterior a fechaSancion: puede recibir sanción.\n      // La regla aplica tanto al régimen ordinario como a SIMPLE (4-6 cuotas).\n      const sancionHabilitadaPorFecha=\n        datos.tieneSancion===\"SI\"\n        && sancionBaseOriginal>0\n        && Boolean(fechaSancionReal)\n        && pago.fecha>=fechaSancionReal;\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          git checkout b8dd643339f96ecf6abf1be7dd4661c4c532c491 -- js/decreto-1419.js
          rm -f .github/workflows/_fix_fecha_sancion_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/motor-liquidacion.js js/motor-liquidacion-oficial.js js/decreto-1419.js .github/workflows/_fix_fecha_sancion_once.yml
          git commit -m 'fix: usar fecha de sancion como unico corte de imputacion'
          git push origin main
