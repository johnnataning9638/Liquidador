name: TEMP validation
on:
  push:
    paths:
      - ".github/workflows/temp-validation.yml"
      - "tests/temp_validation.mjs"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: for f in js/*.js; do node --check "$f"; done
      - run: node tests/temp_validation.mjs
