name: TDJ UI and calculation verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check js/tdj.js
          node --check js/motor-liquidacion.js
          node --check js/motor-liquidacion-oficial.js
      - name: UI contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const tdj=fs.readFileSync('js/tdj.js','utf8');
          const html=fs.readFileSync('titulos.html','utf8');
          if(!tdj.includes('data-k="tipoTasa"')) throw new Error('Falta TIPO DE TASA en obligación');
          if(!tdj.includes('data-tasa-obligacion')) throw new Error('Falta TASA automática en obligación');
          if(!tdj.includes('tipo:tipoTasaObligacion')) throw new Error('El TDJ no está heredando la tasa de la obligación');
          if(!tdj.includes('data-p="tipo"')) throw new Error('Se eliminó accidentalmente TIPO de pagos');
          if(tdJTitleHasType(tdj)) throw new Error('El TDJ conserva selector TIPO/TASA en títulos');
          if(html.includes('<th>TIPO</th>') || html.includes('<th>TASA</th>')) throw new Error('La tabla TDJ conserva columnas TIPO/TASA');
          if(!html.includes('<th>OBSERVACIÓN</th>')) throw new Error('Falta OBSERVACIÓN');
          if(!tdj.includes('permitirBeneficioFueraVigencia:true')) throw new Error('No se habilitó la liquidación no bloqueante de beneficios en TDJ');
          console.log('UI_CONTRACT_OK');
          function tdJTitleHasType(s){
            const i=s.indexOf('function renderTitulos()');
            const j=s.indexOf('function renumerarTitulos()',i);
            const block=s.slice(i,j);
            return block.includes('data-t="tipo"') || block.includes('tasa-titulo') || block.includes('opcionesTipoTDJ');
          }
          NODE
      - name: Calculation invariants
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { MotorLiquidacion } from './js/motor-liquidacion.js?v=16.33.40';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const tasas=read('datos/tasas-moratorias.json');
          const motor=new MotorLiquidacion({uvt:read('datos/uvt.json'),intereses:tasas,tasasMoratorias:tasas,ipc:read('datos/ipc.json'),beneficios:read('datos/beneficios.json'),sanciones:read('datos/sanciones.json'),reglasObligaciones:read('datos/reglas-obligaciones.json')});
          const base={nit:'900123456',razonSocial:'PRUEBA',anio:2026,concepto:'VENTAS',periodo:1,tipoLiquidacion:'PRIVADA',fechaCorte:'2026-09-01',vencimientos:[{id:'V1',numero:1,fecha:'2026-01-01',impuesto:10000000,saldo:10000000}],tieneSancion:'NO',valorSancion:0,fechaSancion:'',pagos:[]};
          const tdj={...base,pagos:[{id:'T1',numero:1,fecha:'2026-09-01',valor:1000,tipo:'TASA DIAN',tdj:'TDJ1',esTDJ:true}]};
          const r=motor.calcular(tdj);
          const d=r.detalle?.[0];
          if(!d) throw new Error('No se generó detalle para TDJ');
          if(Number(d.aplicado?.total||0)>1000) throw new Error('TDJ <= 1000 aplicó más de lo pagado');
          if(Number(d.aplicado?.intereses||0)!==1000) throw new Error('TDJ <= 1000 no priorizó intereses');
          const normal={...base,pagos:[{id:'P1',numero:1,fecha:'2026-09-01',valor:1000,tipo:'TASA DIAN'}]};
          const rn=motor.calcular(normal);
          const dn=rn.detalle?.[0];
          if(!dn) throw new Error('No se generó detalle para pago normal');
          if(String(dn.tipoProporcion||'').includes('TDJ <= $1.000')) throw new Error('El pago normal tomó la ruta especial TDJ');
          console.log('CALCULATION_INVARIANTS_OK');
          NODE
