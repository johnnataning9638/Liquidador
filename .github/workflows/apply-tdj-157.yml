name: TDJ 157
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correccion exacta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/tdj-core-16.33.143.js')
          s=p.read_text()
          old1='''          // REGLA v16.33.156: si la obligación actual todavía tiene saldo,\n          // el título NO puede saltar a la obligación siguiente.\n          const saldoObligacionActual=Math.max(0,Number(ultimo?.saldo?.total??r.total??0));\n          if(saldoObligacionActual>0.5)break;'''
          old2='''        // REGLA FUNDAMENTAL v16.33.156:\n        // PRIMERO SE AGOTA LA OBLIGACIÓN ACTUAL. Solo si el saldo quedó en\n        // cero puede el remanente del mismo título continuar a la siguiente.\n        // Si queda saldo, el siguiente TDJ retomará la obligación actual.\n        // v16.33.156: la secuencia de TDJ es por consumo del título.\n        // Si el título deja remanente, ese remanente DEBE pasar a la siguiente\n        // obligación; los títulos posteriores continúan desde esa obligación.\n        // No se bloquea el avance por una fotografía intermedia del saldo.\n'''
          new1='''          // v16.33.157: un TDJ que no puede aplicarse a esta obligación\n          // continúa con la siguiente. No se conserva el título bloqueado por\n          // una fotografía intermedia del saldo.\n'''
          new2='''        // v16.33.157: el remanente del título y los títulos posteriores\n        // deben continuar con la siguiente obligación. La validación final\n        // de endoso solo debe recibir remanentes realmente no imputables.\n'''
          if old1 not in s: raise SystemExit('BLOQUE 1 V156 NO ENCONTRADO')
          if old2 not in s: raise SystemExit('BLOQUE 2 V156 NO ENCONTRADO')
          s=s.replace(old1,new1,1).replace(old2,new2,1).replace('16.33.156','16.33.157')
          p.write_text(s)
          for name in ['titulos.html','js/tdj.js','js/prioridad-tdj-v132.js']:
            q=Path(name); q.write_text(q.read_text().replace('16.33.156','16.33.157'))
          Path('tests/regresion-secuencia-tdj-157.mjs').write_text('''import fs from "node:fs";\nimport assert from "node:assert/strict";\nconst s=fs.readFileSync("js/tdj-core-16.33.143.js","utf8");\nassert.match(s,/v16\\.33\\.157: el remanente del título/);\nassert.doesNotMatch(s,/saldoObligacionActual>0\\.5\\)break/);\nfunction sec(obls,titulos){let c=0,o=[];for(const t of titulos){let d=t.v;while(d>0.5&&c<obls.length){const a=Math.min(d,obls[c]);obls[c]-=a;d-=a;o.push([t.id,c+1,a]);if(obls[c]<=0.5)c++;else break;}}return{obls,o};}\nconst r=sec([10000000,20000000],[{id:"TDJ1",v:5000000},{id:"TDJ2",v:10000000}]);\nassert.deepEqual(r.o,[["TDJ1",1,5000000],["TDJ2",1,5000000],["TDJ2",2,5000000]]);\nconst r2=sec([10000000,20000000],[{id:"TDJ1",v:10000000},{id:"TDJ2",v:5000000}]);\nassert.deepEqual(r2.o,[["TDJ1",1,10000000],["TDJ2",2,5000000]]);\nconsole.log("REGRESION TDJ 157 OK");\n''')
          PY
      - name: Validar
        run: |
          node --check js/tdj-core-16.33.143.js
          node --check js/tdj.js
          node --check js/prioridad-tdj-v132.js
          node tests/regresion-secuencia-tdj-157.mjs
      - name: Publicar y retirar correctivo
        run: |
          rm -f .github/workflows/apply-tdj-157.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: continuar TDJ a siguiente obligacion v16.33.157'
          git push
