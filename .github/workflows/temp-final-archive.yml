name: TEMP final archive
on:
  push:
    paths:
      - ".github/workflows/temp-final-archive.yml"
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -qr /tmp/Liquidador-final-2026-09-29.zip . -x ".git/*"
      - uses: actions/upload-artifact@v4
        with:
          name: Liquidador-final-2026-09-29
          path: /tmp/Liquidador-final-2026-09-29.zip
