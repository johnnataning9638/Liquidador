name: Correctivo real TDJ endoso v16.33.154

on: push

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar y probar correccion
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          marker='fix: corregir flujo remanente TDJ antes de endoso v16.33.154'
          last=subprocess.check_output(['git','log','-1','--pretty=%B'],text=True).strip()
          if marker in last:
              print('PARCHE YA PUBLICADO')
              raise SystemExit(0)
          p=Path('js/tdj-core-16.33.143.js')
          s=p.read_text(encoding='utf-8')
          old='''        const saldoObligacionActual=Math.max(0,Number(ultimo?.saldo?.total??r.total??0));\n        if(saldoObligacionActual>0.5)break;\n\n        if(aplicado>0){'''
          new='''        const saldoObligacionActual=Math.max(0,Number(ultimo?.saldo?.total??r.total??0));\n\n        // v16.33.154: si pagos normales protegidos cubren la obligacion,\n        // el remanente TDJ puede continuar a la siguiente obligacion; si no,\n        // el siguiente TDJ debe retomar la obligacion actual.\n        let obligacionCubiertaPorPagosProtegidos=false;\n        try{\n          const estadoConPagosProtegidos=motorActual.calcular(datosAjustados);\n          obligacionCubiertaPorPagosProtegidos=Number(estadoConPagosProtegidos?.total||0)<=0.5;\n        }catch{}\n        if(saldoObligacionActual>0.5 && !obligacionCubiertaPorPagosProtegidos)break;\n\n        if(aplicado>0){'''
          if old not in s:
              raise SystemExit('BLOQUE OBJETIVO NO ENCONTRADO')
          p.write_text(s.replace(old,new,1).replace('16.33.153','16.33.154'),encoding='utf-8')
          for rel in ['js/tdj.js','js/prioridad-tdj-v132.js','titulos.html']:
              q=Path(rel); q.write_text(q.read_text(encoding='utf-8').replace('16.33.153','16.33.154'),encoding='utf-8')
          t=Path('tests/regresion-endoso-tdj-154.mjs')
          t.write_text('''import fs from "node:fs";\nimport assert from "node:assert/strict";\nconst s=fs.readFileSync("js/tdj-core-16.33.143.js","utf8");\nassert.match(s,/obligacionCubiertaPorPagosProtegidos/);\nassert.match(s,/motorActual\\.calcular\\(datosAjustados\\)/);\nassert.match(s,/16\\.33\\.154/);\nconsole.log("REGRESION TDJ ENDOSO 154 OK");\n''',encoding='utf-8')
          subprocess.run(['node','--check','js/tdj-core-16.33.143.js'],check=True)
          subprocess.run(['node','--check','js/tdj.js'],check=True)
          subprocess.run(['node','--check','js/prioridad-tdj-v132.js'],check=True)
          subprocess.run(['node','tests/regresion-endoso-tdj-154.mjs'],check=True)
          print('CORRECCION Y PRUEBAS OK')
          PY
      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          rm -f .github/workflows/correctivo-endoso-real-154.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js titulos.html tests/regresion-endoso-tdj-154.mjs .github/workflows/correctivo-endoso-real-154.yml
          git commit -m 'fix: corregir flujo remanente TDJ antes de endoso v16.33.154'
          git push
