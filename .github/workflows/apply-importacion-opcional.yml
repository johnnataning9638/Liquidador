name: Aplicar corrección de captura manual v16.33.118

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/aplicar-fix-importacion-opcional.mjs"
      - ".github/workflows/apply-importacion-opcional.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Aplicar corrección y sincronizar versiones
        run: node scripts/aplicar-fix-importacion-opcional.mjs

      - name: Validar sintaxis JavaScript
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Ejecutar regresión de captura manual
        run: node tests/regresion-importacion-opcional.mjs

      - name: Publicar corrección
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js tests index.html liquidacion.html titulos.html estilos.css tdj-mobile.css RELEASES/16.33.118.md
          git commit -m "fix: aplicar captura manual v16.33.118"
          git push
