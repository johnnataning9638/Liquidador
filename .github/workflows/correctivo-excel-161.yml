name: Correctivo Excel dimensiones 161
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'activar ajuste Excel 161')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar ajuste exclusivo de presentación XLSX
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('js/app.js'), Path('js/tdj-core-16.33.143.js')]
          for p in files:
              s=p.read_text(encoding='utf-8')
              old = 'const cols=Array.from({length:lastCol},(_,i)=>`<col min="${i+1}" max="${i+1}" width="${Number(columnWidths[i]||16)}" customWidth="1"/>`).join("");'
              new = '''const valueCols=new Set([
    ...moneyCols,
    ...percentCols,
    ...Object.values(rowMoneyCols||{}).flatMap(v=>Array.isArray(v)?v:[]),
    ...Object.values(rowPercentCols||{}).flatMap(v=>Array.isArray(v)?v:[])
  ].map(Number));
  const excelWidths=Array.from({length:lastCol},(_,i)=>Math.max(10,Number(columnWidths[i]||16)+(valueCols.has(i+1)?4:0)));
  const cols=excelWidths.map((width,i)=>`<col min="${i+1}" max="${i+1}" width="${width}" customWidth="1"/>`).join("");'''
              if old not in s:
                  raise SystemExit(f'No se encontró bloque de anchos en {p}')
              s=s.replace(old,new,1)
              oldh='const title=titleRows.includes(i),header=headerRows.includes(i),height=title?24:(header?20:18);'
              newh='''const title=titleRows.includes(i),header=headerRows.includes(i);
    const maxLines=Math.max(1,...row.map((v,j)=>{
      const texto=String(v??"");
      const ancho=Math.max(10,excelWidths[j]||16);
      const caracteresPorLinea=Math.max(8,Math.floor(ancho*1.05));
      return Math.ceil(Math.max(1,texto.length)/caracteresPorLinea);
    }));
    const height=title?24:(header?Math.min(45,Math.max(20,18+(maxLines-1)*9)):Math.min(60,Math.max(18,18+(maxLines-1)*12)));'''
              if oldh not in s:
                  raise SystemExit(f'No se encontró bloque de altura en {p}')
              s=s.replace(oldh,newh,1)
              s=s.replace('v=16.33.160','v=16.33.161')
              p.write_text(s,encoding='utf-8')
          
          for p in [Path('liquidacion.html'),Path('titulos.html'),Path('js/tdj.js'),Path('js/prioridad-tdj-v132.js')]:
              s=p.read_text(encoding='utf-8')
              s=s.replace('v=16.33.160','v=16.33.161')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Crear regresión de dimensiones Excel 161
        run: |
          cat > tests/regresion-excel-dimensiones-161.mjs <<'EOF'
          import fs from 'node:fs';
          const app=fs.readFileSync('js/app.js','utf8');
          const tdj=fs.readFileSync('js/tdj-core-16.33.143.js','utf8');
          for(const [name,s] of [['DIAN',app],['TDJ',tdj]]){
            if(!s.includes('valueCols=new Set')) throw new Error(`${name}: falta ampliación de columnas de valor`);
            if(!s.includes('const excelWidths=')) throw new Error(`${name}: falta cálculo de anchos`);
            if(!s.includes('Math.min(60')) throw new Error(`${name}: falta altura adaptativa`);
            if(!s.includes('customHeight=\\"1\\"')) throw new Error(`${name}: falta altura personalizada`);
            if(!s.includes('v=16.33.161')) throw new Error(`${name}: versión 161 ausente`);
          }
          for(const f of ['liquidacion.html','titulos.html','js/tdj.js','js/prioridad-tdj-v132.js']){
            if(!fs.readFileSync(f,'utf8').includes('16.33.161')) throw new Error(`${f}: versión 161 ausente`);
          }
          console.log('REGRESION EXCEL 16.33.161 OK — anchos de valores + alturas adaptativas; sin cambios de datos');
          EOF
      - name: Validar sintaxis y regresión
        run: |
          set -e
          node --check js/app.js
          node --check js/tdj-core-16.33.143.js
          node tests/regresion-excel-dimensiones-161.mjs
          node tests/regresion-parametros-160.mjs
          node tests/regresion-exportacion-excel-158.mjs
      - name: Publicar y retirar correctivo temporal
        run: |
          set -e
          rm -f .github/workflows/correctivo-excel-161.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js liquidacion.html titulos.html tests/regresion-excel-dimensiones-161.mjs .github/workflows/correctivo-excel-161.yml
          git commit -m 'feat: ajustar dimensiones Excel v16.33.161'
          git push origin main
