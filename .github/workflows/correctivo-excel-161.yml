name: Correctivo Excel 161
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'activar Excel 161')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/redesign_excel_161.py
      - run: node --check js/app.js
      - run: node --check js/tdj-core-16.33.143.js
      - run: node tests/regresion-parametros-160.mjs
      - run: node tests/regresion-exportacion-excel-158.mjs
      - run: |
          cat > tests/regresion-excel-dimensiones-161.mjs <<'EOF'
          import fs from 'node:fs';
          const files=['js/app.js','js/tdj-core-16.33.143.js'];
          for (const f of files) {
            const s=fs.readFileSync(f,'utf8');
            if(!s.includes('valueCols=new Set')) throw new Error(f+' sin valueCols');
            if(!s.includes('const excelWidths=')) throw new Error(f+' sin excelWidths');
            if(!s.includes('Math.min(60')) throw new Error(f+' sin altura adaptativa');
            if(!s.includes('16.33.161')) throw new Error(f+' sin version 161');
          }
          console.log('REGRESION EXCEL 161 OK');
          EOF
          node tests/regresion-excel-dimensiones-161.mjs
      - run: |
          rm -f .github/workflows/correctivo-excel-161.yml scripts/redesign_excel_161.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js liquidacion.html titulos.html tests/regresion-excel-dimensiones-161.mjs .github/workflows/correctivo-excel-161.yml scripts/redesign_excel_161.py
          git commit -m 'feat: ajustar dimensiones Excel v16.33.161'
          git push origin main
