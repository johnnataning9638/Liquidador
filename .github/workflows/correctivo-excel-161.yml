name: Correctivo Excel 161
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'activar Excel 161')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/redesign_excel_161.py
      - run: node --check js/app.js
      - run: node --check js/tdj-core-16.33.143.js
      - run: |
          cat > tests/regresion-parametros-161.mjs <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const app=fs.readFileSync('js/app.js','utf8');
          const tdj=fs.readFileSync('js/tdj-core-16.33.143.js','utf8');
          assert.ok(app.includes('\n}\n\nfunction crc32('),'app.js no tiene cierre de xlsxSheet antes de crc32');
          assert.ok(tdj.includes('\n}\n\nfunction crc32TDJ('),'tdj-core no tiene cierre de xlsxSheetTDJ antes de crc32TDJ');
          for(const f of ['liquidacion.html','titulos.html','js/app.js','js/tdj-core-16.33.143.js','js/tdj.js','js/prioridad-tdj-v132.js']) assert.match(fs.readFileSync(f,'utf8'),/16\.33\.161/);
          for(const f of ['datos/uvt.json','datos/tasas-moratorias.json','datos/ipc.json','datos/beneficios.json','datos/sanciones.json','datos/reglas-obligaciones.json','datos/calendario.json','datos/reglas-historicas.json']) JSON.parse(fs.readFileSync(f,'utf8'));
          console.log('REGRESION PARAMETROS 16.33.161 OK');
          EOF
          node tests/regresion-parametros-161.mjs
      - run: |
          cat > tests/regresion-exportacion-excel-161.mjs <<'EOF'
          import fs from 'node:fs';
          for(const [name,s] of [['DIAN',fs.readFileSync('js/app.js','utf8')],['TDJ',fs.readFileSync('js/tdj-core-16.33.143.js','utf8')]]){
            if(!s.includes('valueCols=new Set')) throw new Error(name+' sin valueCols');
            if(!s.includes('const excelWidths=')) throw new Error(name+' sin excelWidths');
            if(!s.includes('Math.min(60')) throw new Error(name+' sin altura adaptativa');
            if(!s.includes('customHeight="1"')) throw new Error(name+' sin customHeight');
            if(!s.includes('16.33.161')) throw new Error(name+' sin version 161');
          }
          console.log('REGRESION EXCEL 16.33.161 OK — solo presentación XLSX');
          EOF
          node tests/regresion-exportacion-excel-161.mjs
      - run: |
          node tests/regresion-importadores-decimales-145.mjs
          node tests/regresion-simbolo-peso-importadores-146.mjs
          node tests/regresion-secuencia-tdj-151.mjs
          node tests/regresion-secuencia-tdj-152.mjs
      - run: |
          rm -f .github/workflows/correctivo-excel-161.yml scripts/redesign_excel_161.py .github/excel161-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js liquidacion.html titulos.html tests/regresion-parametros-161.mjs tests/regresion-exportacion-excel-161.mjs .github/workflows/correctivo-excel-161.yml scripts/redesign_excel_161.py .github/excel161-trigger.txt
          git commit -m 'feat: ajustar dimensiones Excel v16.33.161'
          git push origin main
