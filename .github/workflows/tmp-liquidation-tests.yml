name: Temporary liquidation tests
on:
  push:
    paths:
      - "tmp_liquidation_tests.mjs"
      - "js/**"
      - "datos/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tmp_liquidation_tests.mjs
