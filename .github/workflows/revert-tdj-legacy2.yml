name: EXECUTE TDJ ROLLBACK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore TDJ to pre-migration state
        shell: bash
        run: |
          set -euo pipefail
          TARGET=dce4726f2fa10d5110c00e71269aa53035a96311
          git checkout "$TARGET" -- js/tdj.js js/prioridad-tdj.js titulos.html
          rm -f js/tdj-core-16.33.185.js RELEASES/16.33.185.md AUDITORIA/16.33.185.md
          rm -f .github/workflows/revert-tdj-legacy.yml .github/workflows/revert-tdj-legacy2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'revert: TDJ only to pre-migration 16.33.129'
          git push origin main
