name: Hotfix carga de parametros 159

on: push

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir sintaxis y versionar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          fixes = {
              'js/app.js': (
                  'function xlsxSheet(rows,{moneyCols=[],percentCols=[],rowMoneyCols={},rowPercentCols={},titleRows=[],headerRows=[],columnWidths=[],mergeRanges=[],landscape=true,fitToWidth=1,fitToHeight=0}={}\n',
                  'function xlsxSheet(rows,{moneyCols=[],percentCols=[],rowMoneyCols={},rowPercentCols={},titleRows=[],headerRows=[],columnWidths=[],mergeRanges=[],landscape=true,fitToWidth=1,fitToHeight=0}={}){\n'
              ),
              'js/tdj-core-16.33.143.js': (
                  'function xlsxSheetTDJ(rows,{moneyCols=[],percentCols=[],rowMoneyCols={},rowPercentCols={},titleRows=[],headerRows=[],columnWidths=[],mergeRanges=[],landscape=true,fitToWidth=1,fitToHeight=0}={}\n',
                  'function xlsxSheetTDJ(rows,{moneyCols=[],percentCols=[],rowMoneyCols={},rowPercentCols={},titleRows=[],headerRows=[],columnWidths=[],mergeRanges=[],landscape=true,fitToWidth=1,fitToHeight=0}={}){\n'
              )
          }
          for name,(old,new) in fixes.items():
              p=Path(name); s=p.read_text()
              if old in s: p.write_text(s.replace(old,new,1))
          for name in ['js/app.js','js/tdj-core-16.33.143.js','js/tdj.js','js/prioridad-tdj-v132.js','liquidacion.html','titulos.html']:
              p=Path(name); s=p.read_text(); p.write_text(s.replace('16.33.158','16.33.159'))
          PY
      - name: Pruebas y auditoria
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const a=fs.readFileSync('js/app.js','utf8'),t=fs.readFileSync('js/tdj-core-16.33.143.js','utf8');if(!/function xlsxSheet\\([^\\n]+\\}\\=\\{\\}\\)\\{/.test(a))process.exit(1);if(!/function xlsxSheetTDJ\\([^\\n]+\\}\\=\\{\\}\\)\\{/.test(t))process.exit(1);for(const f of ['datos/uvt.json','datos/tasas-moratorias.json','datos/ipc.json','datos/beneficios.json','datos/sanciones.json','datos/reglas-obligaciones.json','datos/calendario.json','datos/reglas-historicas.json'])JSON.parse(fs.readFileSync(f));console.log('REGRESION PARAMETROS 159 OK')"
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/regresion-exportacion-excel-158.mjs
          node tests/regresion-secuencia-tdj-129.mjs
          node tests/regresion-prioridad-pagos-tdj-130.mjs
          node tests/regresion-idempotencia-tdj-132.mjs
          node tests/regresion-saldo-final-134.mjs
          node tests/regresion-importadores-decimales-145.mjs
          node tests/regresion-simbolo-peso-importadores-146.mjs
          node tests/regresion-secuencia-tdj-151.mjs
          node tests/regresion-secuencia-tdj-152.mjs
      - name: Commit hotfix si hay cambios
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js liquidacion.html titulos.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restaurar carga de parametros v16.33.159'
          git push origin HEAD:main
