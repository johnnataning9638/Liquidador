name: apply-art9-sanction-fix-v16-33-127

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal sanction rule update
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q 'v16.33.127'; then
            echo 'Version 16.33.127 already applied; nothing to do.'
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path

          path = Path('js/motor-liquidacion-base.js')
          text = path.read_text(encoding='utf-8')
          old = '''      // ART. 20 D.1474 / ART. 3 D.0240: actualizar primero y luego reducir
      // sanción + actualización al 15%. Se ejecuta una sola vez, en el primer
      // pago que seleccione uno de estos tratamientos. La sanción mínima es
      // el piso final exigido por la norma.
      if(!primerBeneficioDecretoUsado && especial.reduceSancion &&
         (String(pago.tipo||"").toUpperCase().includes("ART. 20 DECRETO 1474") ||
          String(pago.tipo||"").toUpperCase().includes("ART. 3 DECRETO 0240") ||
          String(pago.tipo||"").toUpperCase().includes("ART. 9 DECRETO 1419")) && saldoSancion>0){
        const anioMinima=this.anioSancionParaMinima(datos,true);
        const minima=Math.max(0,Number(this.sancionMinima(anioMinima)||0));
        const saldoActualizado=Number(saldoSancion||0);
        const reducido=roundMil(saldoActualizado*Number(especial.factorSancion||0.15));
        const sancionFinal=Math.max(reducido,minima);
        saldoSancion=roundMil(sancionFinal);
        primerBeneficioDecretoUsado=true;
        detalleActualizacionSancion.push({
          fechaPago:pago.fecha,
          beneficio:pago.tipo,
          saldoAntesReduccion:roundMil(saldoActualizado),
          porcentajeReduccion:Number(especial.factorSancion||0.15)*100,
          valorReducido:reducido,
          sancionMinima:minima,
          saldoDespuesReduccion:saldoSancion,
          actualizacionPrevia:roundMil(Math.max(0,saldoActualizado-sancionBaseOriginal))
        });
        actualizacionSancionPago.eventos.push({
          tipo:'REDUCCION POR BENEFICIO',
          beneficio:pago.tipo,
          saldoAntes:roundMil(saldoActualizado),
          actualizacionPrevia:roundMil(Math.max(0,saldoActualizado-sancionBaseOriginal)),
          porcentaje:Number(especial.factorSancion||0.15)*100,
          valorReducido:reducido,
          sancionMinima:minima,
          saldoDespues:roundMil(saldoSancion)
        });
      }
'''
          new = '''      // BENEFICIO ART. 9 D.1419: primero se actualiza la sanción pendiente
      // conforme al Art. 867-1 E.T.; después se compara el saldo actualizado
      // con la sanción mínima. Si el saldo actualizado es menor o igual a la
      // mínima, NO se reconstruye la sanción ni se aplica el 15%: se conserva
      // el saldo real pendiente. Si es superior a la mínima, se paga el 15%
      // del saldo actualizado y ese resultado respeta la sanción mínima como
      // piso. Los tratamientos D.1474/D.0240 conservan su regla existente.
      const tipoPagoUpper=String(pago.tipo||"").toUpperCase();
      const esArt9D1419=tipoPagoUpper.includes("ART. 9 DECRETO 1419");
      const esReduccionAnterior=tipoPagoUpper.includes("ART. 20 DECRETO 1474") || tipoPagoUpper.includes("ART. 3 DECRETO 0240");
      if(!primerBeneficioDecretoUsado && especial.reduceSancion &&
         (esReduccionAnterior || esArt9D1419) && saldoSancion>0){
        const anioMinima=this.anioSancionParaMinima(datos,true);
        const minima=Math.max(0,Number(this.sancionMinima(anioMinima)||0));
        const saldoActualizado=Number(saldoSancion||0);
        const reducido=roundMil(saldoActualizado*Number(especial.factorSancion||0.15));
        // Art. 9 D.1419: si el saldo real actualizado ya está en o por debajo
        // de la mínima, el beneficio NO se aplica y el saldo no se eleva.
        const aplicaReduccion=esArt9D1419 ? saldoActualizado>minima : true;
        const sancionFinal=aplicaReduccion?Math.max(reducido,minima):saldoActualizado;
        saldoSancion=roundMil(sancionFinal);
        if(!esArt9D1419 || aplicaReduccion) primerBeneficioDecretoUsado=true;
        detalleActualizacionSancion.push({
          fechaPago:pago.fecha,
          beneficio:pago.tipo,
          saldoAntesReduccion:roundMil(saldoActualizado),
          porcentajeReduccion:aplicaReduccion?Number(especial.factorSancion||0.15)*100:0,
          valorReducido:aplicaReduccion?reducido:saldoActualizado,
          sancionMinima:minima,
          saldoDespuesReduccion:saldoSancion,
          actualizacionPrevia:roundMil(Math.max(0,saldoActualizado-sancionBaseOriginal)),
          beneficioAplicado:aplicaReduccion
        });
        actualizacionSancionPago.eventos.push({
          tipo:aplicaReduccion?'REDUCCION POR BENEFICIO':'BENEFICIO NO APLICADO POR SALDO EN O POR DEBAJO DE SANCIÓN MÍNIMA',
          beneficio:pago.tipo,
          saldoAntes:roundMil(saldoActualizado),
          actualizacionPrevia:roundMil(Math.max(0,saldoActualizado-sancionBaseOriginal)),
          porcentaje:aplicaReduccion?Number(especial.factorSancion||0.15)*100:0,
          valorReducido:aplicaReduccion?reducido:saldoActualizado,
          sancionMinima:minima,
          saldoDespues:roundMil(saldoSancion),
          beneficioAplicado:aplicaReduccion
        });
      }
'''
          if old not in text:
              raise SystemExit('Target Article 9/benefit block not found; aborting without changes.')
          text = text.replace(old, new, 1)
          text = text.replace('utilidades.js?v=16.33.122', 'utilidades.js?v=16.33.127')
          text = text.replace('actualizacion-sancion.js?v=16.33.122', 'actualizacion-sancion.js?v=16.33.127')
          path.write_text(text, encoding='utf-8')

          for name in ['js/motor-liquidacion.js', 'js/app.js', 'liquidacion.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('16.33.126', '16.33.127')
              s = s.replace('16.33.122', '16.33.127')
              p.write_text(s, encoding='utf-8')

          Path('RELEASES/16.33.127.md').write_text('''# v16.33.127 — Ajuste Art. 9 Decreto 1419 de 2026\n\n- Corrige la aplicación del beneficio del Art. 9 sobre el saldo real pendiente de sanción.\n- Actualiza primero la sanción pendiente cuando corresponda por Art. 867-1 E.T.\n- Si la sanción actualizada es menor o igual a la mínima, conserva el saldo real y no reconstruye la mínima.\n- Si la sanción actualizada supera la mínima, aplica 15% del saldo actualizado y usa la mínima únicamente como piso del resultado reducido.\n- Mantiene la regla de múltiples pagos/títulos sin recrear la sanción.\n- No modifica la lógica de impuesto, intereses, proporcionalidad TDJ ni régimen SIMPLE.\n''', encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run sanction regression tests
        shell: bash
        run: |
          cat > /tmp/test-art9.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { MotorLiquidacion } from './js/motor-liquidacion.js?v=16.33.127';

          const makeMotor = (ipc = []) => new MotorLiquidacion({
            uvt: [{ anio: 2026, valor: 52374, sancionMinima: 524000 }, { anio: 2024, valor: 47065, sancionMinima: 470000 }],
            intereses: [], ipc, tasasMoratorias: [], beneficios: [], sanciones: [],
            reglasObligaciones: [{ concepto: 'RENTA', familia: 'RENTA', vencimientos: 'NO_AUTOGENERAR' }]
          });

          const base = (sancion, fechaSancion, pagos) => ({
            concepto: 'RENTA', anio: 2026, tipoLiquidacion: 'PRIVADA', tieneSancion: 'SI', valorSancion: sancion,
            fechaSancion, vencimientos: [{ id: 'VTO-1', numero: 1, fecha: '2026-01-01', impuesto: 1000000 }], pagos
          });

          {
            const m = makeMotor();
            const r = m.calcular(base(284000, '2026-01-01', [{ fecha: '2026-07-22', valor: 1000, tipo: 'ART. 9 DECRETO 1419', esTDJ: true, tdj: '469030003386678' }]));
            assert.equal(r.sancion, 284000, 'Art. 9 no debe elevar $284.000 a la mínima');
          }

          {
            const m = makeMotor([{ anio: 2025, inflacion: 0.20 }]);
            const r = m.calcular(base(400000, '2024-01-01', [{ fecha: '2026-07-22', valor: 1000, tipo: 'ART. 9 DECRETO 1419', esTDJ: true, tdj: 'T2' }]));
            assert.equal(r.sancion, 489000, 'La actualización anual debe conservarse aunque quede bajo la mínima');
          }

          {
            const m = makeMotor([{ anio: 2025, inflacion: 0.20 }]);
            const r = m.calcular(base(5000000, '2024-01-01', [{ fecha: '2026-07-22', valor: 1000, tipo: 'ART. 9 DECRETO 1419', esTDJ: true, tdj: 'T3' }]));
            assert.equal(r.sancion, 916000, 'Debe aplicar 15% del saldo actualizado y no 85%');
          }

          {
            const m = makeMotor();
            const r = m.calcular(base(5000000, '2026-01-01', [
              { fecha: '2026-07-22', valor: 600000, tipo: 'ART. 9 DECRETO 1419' },
              { fecha: '2026-08-01', valor: 100000, tipo: 'ART. 9 DECRETO 1419' }
            ]));
            assert.ok(r.sancion < 524000, `El segundo pago no debe reconstruir la mínima; saldo=${r.sancion}`);
          }

          console.log('ART. 9 D1419 regression tests: OK');
          JS
          node /tmp/test-art9.mjs

      - name: Commit validated release
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q 'v16.33.127'; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/motor-liquidacion-base.js js/motor-liquidacion.js js/app.js liquidacion.html RELEASES/16.33.127.md
          git diff --cached --check
          git commit -m 'fix: Art. 9 Decreto 1419 sanction balance v16.33.127'
          git push
