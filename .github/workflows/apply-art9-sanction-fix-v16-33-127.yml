name: apply-art9-sanction-fix-v16-33-127

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved Art. 9 rule
        run: python3 scripts/apply-art9-fix-v16-33-127.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run regression tests
        run: node scripts/test-art9-v16-33-127.mjs

      - name: Commit validated release
        run: |
          if git log -1 --pretty=%B | grep -q 'v16.33.127'; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/motor-liquidacion-base.js js/motor-liquidacion.js js/app.js liquidacion.html RELEASES/16.33.127.md
          git diff --cached --check
          git commit -m 'fix: Art. 9 Decreto 1419 sanction balance v16.33.127'
          git push
