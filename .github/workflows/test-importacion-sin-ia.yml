name: Importación normal sin IA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  importacion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar retirada IA y sincronización de versión
        run: |
          node tests/regresion-sin-ia-233.mjs
          node tests/regresion-prioridad-cierre-233.mjs
          node tests/limpieza-239.mjs
          node tests/parametros-239.mjs
          node tests/excedentes-240.mjs
          node tests/retirada-auditoria-244.mjs
          node scripts/preparar-sitio.mjs
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - name: Probar importación, cálculo, PDF, Excel y limpieza
        run: TEST_SITE_DIR=dist node tests/navegador-sin-ia-233.mjs
      - name: Recuperar seis anticipos de Excel TDJ sin títulos y verificar round-trip
        run: TEST_SITE_DIR=dist node tests/navegador-anticipos-234.mjs
      - name: Validar excedente nominal DIAN y detalle TDJ sin aplicación
        run: TEST_SITE_DIR=dist node tests/navegador-excedentes-240.mjs
      - name: Verificar tasas de tres TDJ y cierre de marzo
        run: TEST_SITE_DIR=dist node tests/navegador-tasa-247.mjs
      - name: Validar proporción y conservación en UI PDF Excel DIAN y TDJ
        run: TEST_SITE_DIR=dist node tests/navegador-proporcion-248.mjs
      - name: Validar PDF DIAN sin pagos privada y oficial
        run: TEST_SITE_DIR=dist node tests/navegador-pdf-dian-251.mjs
      - name: Validar detalle PDF TDJ sin pagos y fecha de corte importada
        run: TEST_SITE_DIR=dist node tests/navegador-tdj-pdf-252.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: importacion-sin-ia
          path: test-results/sin-ia-233
