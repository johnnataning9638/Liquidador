name: tdj-sanction-rule-update
on:
  push:
    branches: [main]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply TDJ ordinary sanction rule
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/motor-liquidacion-base.js')
          s=p.read_text(encoding='utf-8')
          pat=r'''const sancionHabilitadaPorFecha=esSimplePorAnticipos\n\s*\? true\n\s*: \(\n\s*datos\.tieneSancion==="SI"\n\s*&& sancionBaseOriginal>0\n\s*&& Boolean\(fechaSancionReal\)\n\s*&& pago\.fecha>=fechaSancionReal\n\s*\);'''
          repl='''const esTDJActual=(pago.esTDJ===true || String(pago.tdj||"").trim()!=="");\n    const valorTDJAplicado=Math.max(0,Number(pago.valorTDJ??pago.valor??0));\n    const esTDJOrdinarioMayor1000=esTDJActual && !esSimplePorAnticipos && valorTDJAplicado>1000;\n    // REGLA TDJ ORDINARIO > $1.000: la fecha que gobierna la sanción es la\n    // fecha EFECTIVA DE APLICACIÓN del título (pago.fecha), no la fecha en\n    // que el TDJ fue constituido. Si al aplicarlo ya existe sanción pendiente,\n    // el título participa en la proporcionalidad impuesto + intereses + sanción.\n    // Esto se aplica igual al módulo TDJ y al Liquidador DIAN cuando la fila\n    // de pagos está marcada como TJ. SIMPLE y TDJ <= $1.000 conservan sus\n    // reglas específicas sin modificación.\n    const sancionExisteAlAplicar=(\n      datos.tieneSancion==="SI"\n      && sancionBaseOriginal>0\n      && Boolean(fechaSancionReal)\n      && pago.fecha>=fechaSancionReal\n    );\n    const sancionHabilitadaPorFecha=esSimplePorAnticipos\n      ? true\n      : (sancionExisteAlAplicar && (esTDJOrdinarioMayor1000 || !esTDJActual || valorTDJAplicado<=1000));'''
          ns,n=re.subn(pat,repl,s,count=1)
          if n!=1: raise SystemExit('No se encontró exactamente el bloque de sanción esperado')
          p.write_text(ns,encoding='utf-8')

          # Unifica cache-busting/versionado en los módulos afectados.
          for f in ['js/motor-liquidacion-base.js','js/motor-liquidacion.js','js/tdj.js','js/prioridad-tdj.js','titulos.html']:
              q=Path(f)
              if q.exists():
                  t=q.read_text(encoding='utf-8').replace('16.33.123','16.33.124')
                  q.write_text(t,encoding='utf-8')

          # Validaciones estáticas obligatorias.
          final=p.read_text(encoding='utf-8')
          checks=[
            'esTDJOrdinarioMayor1000',
            'sancionExisteAlAplicar',
            'pago.fecha>=fechaSancionReal',
            'valorTDJAplicado>1000'
          ]
          for c in checks:
              assert c in final, c
          assert '16.33.124' in final
          print('TDJ sanction rule: OK')
          PY
      - name: Syntax check
        run: |
          node --check js/motor-liquidacion-base.js
          node --check js/motor-liquidacion.js
          node --check js/tdj.js
          node --check js/prioridad-tdj.js
      - name: Commit and remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/tdj-sanction-rule-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/motor-liquidacion-base.js js/motor-liquidacion.js js/tdj.js js/prioridad-tdj.js titulos.html .github/workflows/tdj-sanction-rule-update.yml
          git commit -m 'fix(tdj): aplicar sancion segun fecha efectiva del titulo [v16.33.124]'
          git push