name: Hotfix PDF TDJ v16.33.142

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar corrección aislada
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('js/tdj.js')
          s = p.read_text(encoding='utf-8')
          old_block = '''    const paginas=[];\n    const bloquesExcedentesFinal=[];'''
          new_block = '''    const paginas=[];\n    const bloquesExcedentesFinal=[];\n    // Debe declararse antes de cualquier uso en el exportador PDF.\n    // Evita TDZ: Cannot access 'hayTitulosRegistrados' before initialization.\n    const hayTitulosRegistrados=titulos.some(t=>fechaISO(t.fecha)&&Number(t.valor)>0);'''
          if old_block not in s:
              raise SystemExit('No se encontró el punto de inicialización esperado en js/tdj.js')
          s = s.replace(old_block, new_block, 1)
          declaration = '    const hayTitulosRegistrados=titulos.some(t=>fechaISO(t.fecha)&&Number(t.valor)>0);'
          if s.count(declaration) != 2:
              raise SystemExit(f'Se esperaba una declaración previa y la antigua, encontradas: {s.count(declaration)}')
          s = s.replace(declaration + '\n    const hayExcedentesPago=', '    const hayExcedentesPago=', 1)
          p.write_text(s, encoding='utf-8')

          h = Path('titulos.html')
          hs = h.read_text(encoding='utf-8')
          hs = re.sub(r'js/tdj\.js\?v=[0-9.]+', 'js/tdj.js?v=16.33.142', hs)
          hs = re.sub(r'(Liquidación de Títulos / TDJ · v)16\.33\.141', r'\g<1>16.33.142', hs)
          hs = hs.replace('<!-- TDJ UI DEPLOY 16.33.141 -->', '<!-- TDJ UI DEPLOY 16.33.142 -->')
          h.write_text(hs, encoding='utf-8')

      - name: Crear regresión PDF TDJ v16.33.142
        shell: python
        run: |
          from pathlib import Path
          import re

          s = Path('js/tdj.js').read_text(encoding='utf-8')
          decl = 'const hayTitulosRegistrados=titulos.some(t=>fechaISO(t.fecha)&&Number(t.valor)>0);'
          assert s.count(decl) == 1, 'La variable hayTitulosRegistrados debe declararse exactamente una vez.'
          i_decl = s.index(decl)
          i_use = s.index('if(hayTitulosRegistrados || hayExcedentesPago)')
          assert i_decl < i_use, 'hayTitulosRegistrados debe inicializarse antes de utilizarse.'
          assert 'const hayExcedentesPago=bloquesExcedentesFinal.length>0;' in s

          html = Path('titulos.html').read_text(encoding='utf-8')
          assert 'js/tdj.js?v=16.33.142' in html, 'No se actualizó el cache-bust de tdj.js.'

          test = Path('tests/regresion-pdf-tdj-142.mjs')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''import fs from "node:fs";\nconst s=fs.readFileSync("js/tdj.js","utf8");\nconst decl="const hayTitulosRegistrados=titulos.some(t=>fechaISO(t.fecha)&&Number(t.valor)>0);";\nif((s.match(new RegExp(decl.replace(/[.*+?^${}()|[\\]\\\\]/g,"\\\\$&"),"g"))||[]).length!==1) throw new Error("declaración duplicada/ausente");\nif(s.indexOf(decl)>s.indexOf("if(hayTitulosRegistrados || hayExcedentesPago)")) throw new Error("TDZ: declaración posterior al uso");\nconsole.log("OK: regresión PDF TDJ v16.33.142");\n''', encoding='utf-8')

      - name: Ejecutar regresión
        run: node tests/regresion-pdf-tdj-142.mjs

      - name: Verificar sintaxis
        run: node --check js/tdj.js

      - name: Commit y push del hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tdj.js titulos.html tests/regresion-pdf-tdj-142.mjs
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git commit -m "fix: corregir exportacion PDF TDJ v16.33.142"
          git push
