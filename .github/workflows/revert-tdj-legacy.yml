name: REVERT TDJ ONLY TO PRE-MIGRATION

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  revert-tdj:
    if: github.event.head_commit.message != 'revert: TDJ only to pre-migration 16.33.129'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore only TDJ files from pre-migration commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET=dce4726f2fa10d5110c00e71269aa53035a96311
          git checkout "$TARGET" -- js/tdj.js js/prioridad-tdj.js titulos.html
          rm -f js/tdj-core-16.33.185.js
          rm -f RELEASES/16.33.185.md AUDITORIA/16.33.185.md
          rm -f .github/workflows/revert-tdj-legacy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/tdj.js js/prioridad-tdj.js titulos.html js/tdj-core-16.33.185.js RELEASES/16.33.185.md AUDITORIA/16.33.185.md .github/workflows/revert-tdj-legacy.yml
          git commit -m 'revert: TDJ only to pre-migration 16.33.129'
          git push origin main
