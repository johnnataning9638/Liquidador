name: Regresión importadores decimales

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxis
        run: |
          node --check js/utilidades.js
          node --check js/tdj-importador.js
      - name: Ejecutar regresión decimal
        run: node tests/regresion-importadores-decimales-145.mjs
