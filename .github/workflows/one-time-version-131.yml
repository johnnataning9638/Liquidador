name: one-time version 16.33.131
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, 'cache-bust 16.33.131') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar referencias de prioridad TDJ
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/app.js')
          s=p.read_text()
          s=s.replace('./prioridad-tdj.js?v=16.33.130','./prioridad-tdj.js?v=16.33.131')
          p.write_text(s)

          p=Path('js/tdj.js')
          s=p.read_text()
          s=s.replace('./prioridad-tdj.js?v=16.33.123','./prioridad-tdj.js?v=16.33.131')
          p.write_text(s)

          p=Path('liquidacion.html')
          s=p.read_text()
          s=s.replace('versión 16.33.130','versión 16.33.131')
          s=s.replace('js/app.js?v=16.33.130','js/app.js?v=16.33.131')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj.js liquidacion.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: cache-bust 16.33.131 prioridad TDJ'
          git push
