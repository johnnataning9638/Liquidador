name: Test trigger 120
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Guard
        run: |
          if git log -1 --pretty=%s | grep -q 'fix: mostrar interés de corte'; then
            echo 'Patch already applied'; exit 0
          fi
      - name: Apply patch
        run: python3 scripts/fix_interes_corte_120.py
      - name: Regression
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/regresion-matematica.mjs
          node tests/regresion-ui.mjs
      - name: Commit patch branch
        run: |
          set -e
          git switch -c fix/16.33.120-interest
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj.js .github/workflows/audit-estabilidad.yml RELEASES/16.33.120.md tests/regresion-interes-corte-pdf.mjs
          git commit -m 'fix: mostrar interés de corte en PDF v16.33.120'
          git push --set-upstream origin fix/16.33.120-interest
