name: one-time-v177-cache-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align cache-busting references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'titulos.html': [('16.33.163','16.33.177')],
              'liquidacion.html': [('js/app.js?v=16.33.161','js/app.js?v=16.33.177')],
              'js/app.js': [('importador-excel.js?v=16.33.161','importador-excel.js?v=16.33.177')],
          }
          changed=False
          for name, pairs in replacements.items():
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              original=s
              for old,new in pairs:
                  s=s.replace(old,new)
              if s!=original:
                  p.write_text(s,encoding='utf-8')
                  changed=True
          if not changed:
              print('CACHE REFERENCES ALREADY ALIGNED')
              raise SystemExit(0)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add titulos.html liquidacion.html js/app.js
          git commit -m 'fix(cache): align v16.33.177 runtime references'
          git push
