name: safe-tdj-ordinario-update
on:
  push:
    branches: [fix/tdj-ordinario-sancion-v16-33-124]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrowly scoped ordinary TDJ rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('js/motor-liquidacion-base.js')
          s=p.read_text(encoding='utf-8')
          pat=r'const sancionHabilitadaPorFecha\s*=\s*esSimplePorAnticipos\s*\?\s*true\s*:\s*\([\s\S]*?\n\s*\);'
          matches=re.findall(pat,s)
          if len(matches)!=1:
              raise SystemExit(f'Expected exactly one sanction block, found {len(matches)}')
          old=matches[0]
          required='pago.fecha>=fechaSancionReal'
          if required not in old:
              raise SystemExit('Safety stop: expected existing payment-date sanction rule was not found')

          repl='''const esTDJActual=(pago.esTDJ===true || String(pago.tdj||\"\").trim()!==\"\");
    const valorTDJAplicado=Math.max(0,Number(pago.valor||0));
    const esTDJOrdinarioMayor1000=esTDJActual && !esSimplePorAnticipos && valorTDJAplicado>1000;
    // TDJ ORDINARIO > $1.000: la sanción se determina por la fecha efectiva
    // de aplicación del título, nunca por la fecha en que fue constituido.
    const sancionExisteAlAplicar=(datos.tieneSancion===\"SI\"
      && sancionBaseOriginal>0
      && Boolean(fechaSancionReal)
      && pago.fecha>=fechaSancionReal);
    const sancionHabilitadaPorFecha=esSimplePorAnticipos
      ? true
      : (sancionExisteAlAplicar && (esTDJOrdinarioMayor1000 || !esTDJActual || valorTDJAplicado<=1000));'''
          s=s.replace(old,repl,1)
          p.write_text(s,encoding='utf-8')

          files=['js/motor-liquidacion-base.js','js/motor-liquidacion.js','js/tdj.js','js/prioridad-tdj.js','titulos.html']
          for f in files:
              q=Path(f)
              if not q.exists():
                  raise SystemExit(f'Missing expected file: {f}')
              t=q.read_text(encoding='utf-8')
              t2=t.replace('16.33.123','16.33.124')
              if f=='js/motor-liquidacion-base.js':
                  t2=t2.replace('16.33.122','16.33.124')
              q.write_text(t2,encoding='utf-8')

          final=p.read_text(encoding='utf-8')
          for token in ['esTDJActual','valorTDJAplicado','esTDJOrdinarioMayor1000','sancionExisteAlAplicar','pago.fecha>=fechaSancionReal']:
              if token not in final:
                  raise SystemExit(f'Missing safety assertion: {token}')
          if '16.33.124' not in final:
              raise SystemExit('Version bump failed')
          PY

      - name: Static regression audit
        shell: bash
        run: |
          node --check js/motor-liquidacion-base.js
          node --check js/motor-liquidacion.js
          node --check js/tdj.js
          node --check js/prioridad-tdj.js
          python - <<'PY'
          from pathlib import Path
          s=Path('js/motor-liquidacion-base.js').read_text(encoding='utf-8')
          checks={
            'simple preserved':'esSimplePorAnticipos',
            'tdj minimum preserved':'esTDJMinimo',
            'payment-date cutoff preserved':'pago.fecha>=fechaSancionReal',
            'interest method preserved':'interesParaPago',
            'proportional distribution preserved':'aplicarProporcionalidad',
          }
          for name,token in checks.items():
            if token not in s:
              raise SystemExit(f'Regression stop: {name} / {token}')
          assert s.count('esTDJOrdinarioMayor1000')==2
          assert 'valorTDJAplicado>1000' in s
          print('REGRESSION AUDIT OK')
          PY

      - name: Commit final change and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tdj-ordinario-safe-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/motor-liquidacion-base.js js/motor-liquidacion.js js/tdj.js js/prioridad-tdj.js titulos.html .github/workflows/tdj-ordinario-safe-update.yml
          git diff --cached --check
          git commit -m 'fix(tdj): sancion en titulos ordinarios mayores a 1000 [v16.33.124]'
          git push origin HEAD:fix/tdj-ordinario-sancion-v16-33-124
