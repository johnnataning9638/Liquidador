name: Regresión limpieza global y resumen final TDJ

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar corrección LIMPIAR global TDJ v16.33.144
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html_path=Path('titulos.html')
          html=html_path.read_text(encoding='utf-8')

          # Ruta física nueva: evita depender de ?v= para invalidar la caché del CDN.
          loader=Path('js/tdj-16.33.144.js')
          loader.write_text('''// TDJ v16.33.144 — barrera física contra módulos cacheados.\n(function(){\n  document.addEventListener("click",function(e){\n    var b=e.target && e.target.closest ? e.target.closest("#btnLimpiarTitulosGlobal") : null;\n    if(!b)return;\n    e.preventDefault();\n    e.stopImmediatePropagation();\n    if(!window.confirm("¿Desea iniciar una nueva liquidación de títulos? Se borrarán datos, pagos, títulos y resultados."))return;\n    window.location.replace("titulos.html?v=16.33.144&reinicio="+Date.now());\n  },true);\n})();\n\nimport("./tdj.js?v=16.33.144");\n''',encoding='utf-8')

          html=re.sub(r'js/tdj\.js\?v=[0-9.]+','js/tdj-16.33.144.js',html)
          html=html.replace('TDJ UI DEPLOY 16.33.143','TDJ UI DEPLOY 16.33.144')
          html=re.sub(r'(Liquidador — módulo de Liquidación de Títulos / TDJ · v)16\.33\.[0-9]+',r'\g<1>16.33.144',html)
          html=html.replace('v!=="16.33.143"','v!=="16.33.144"')
          html=html.replace('u.searchParams.set("v","16.33.143")','u.searchParams.set("v","16.33.144")')
          html=html.replace('tdj-global-clear-143','tdj-global-clear-144')
          html=html.replace('titulos.html?v=16.33.143&reinicio=','titulos.html?v=16.33.144&reinicio=')
          html=html.replace('id="btnLimpiarTitulosGlobal" id="btnLimpiarTitulosGlobal" id="btnLimpiarTitulosGlobal"','id="btnLimpiarTitulosGlobal"')
          html=html.replace('id="btnLimpiarTitulosGlobal" id="btnLimpiarTitulosGlobal"','id="btnLimpiarTitulosGlobal"')

          hard='''<script id="tdj-global-clear-144-hard">\n(function(){\n  document.addEventListener("click",function(e){\n    var b=e.target && e.target.closest ? e.target.closest("#btnLimpiarTitulosGlobal") : null;\n    if(!b)return;\n    e.preventDefault();\n    e.stopImmediatePropagation();\n    if(!window.confirm("¿Desea iniciar una nueva liquidación de títulos? Se borrarán datos, pagos, títulos y resultados."))return;\n    window.location.replace("titulos.html?v=16.33.144&reinicio="+Date.now());\n  },true);\n})();\n</script>\n'''
          html=re.sub(r'\n<script id="tdj-global-clear-[0-9]+(?:-hard)?">.*?</script>\n','\n',html,flags=re.S)
          html=html.replace('</head>',hard+'</head>',1)
          html_path.write_text(html,encoding='utf-8')

          Path('RELEASES/16.33.144.md').write_text('''# RELEASE 16.33.144 — LIMPIAR GLOBAL TDJ\n\n- Auditoría: el mensaje antiguo no existe en la fuente actual; el comportamiento observado proviene de un recurso JS cacheado por ruta.\n- Se crea `js/tdj-16.33.144.js` como ruta física nueva.\n- La captura global del botón TÍTULOS/TJ ocurre antes de cualquier listener antiguo/cacheado.\n- LIMPIAR desde TÍTULOS inicia una nueva liquidación y borra Datos/vencimientos, Pagos, Títulos/TDJ y Resultados.\n- No se modifica la lógica de cálculo, proporcionalidad, intereses, sanciones, cursor ni endoso.\n''',encoding='utf-8')

          Path('tests/regresion-limpiar-global-tdj-144.mjs').write_text('''import fs from "node:fs";\nimport assert from "node:assert/strict";\nconst h=fs.readFileSync("titulos.html","utf8");\nconst l=fs.readFileSync("js/tdj-16.33.144.js","utf8");\nassert.equal((h.match(/id="btnLimpiarTitulosGlobal"/g)||[]).length,1);\nassert.ok(h.includes("js/tdj-16.33.144.js"));\nassert.ok(h.includes("tdj-global-clear-144-hard"));\nassert.ok(h.includes("Se borrarán datos, pagos, títulos y resultados."));\nassert.ok(!h.includes("¿Desea limpiar únicamente los títulos / TDJ registrados?"));\nassert.ok(!l.includes("¿Desea limpiar únicamente los títulos / TDJ registrados?"));\nconsole.log("OK: regresión LIMPIAR GLOBAL TDJ v16.33.144");\n''',encoding='utf-8')

          if ! git diff --quiet -- js/tdj-16.33.144.js titulos.html RELEASES/16.33.144.md tests/regresion-limpiar-global-tdj-144.mjs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add js/tdj-16.33.144.js titulos.html RELEASES/16.33.144.md tests/regresion-limpiar-global-tdj-144.mjs
            git commit -m 'fix: corregir LIMPIAR global TDJ con ruta física v16.33.144'
            git pull --rebase origin main
            git push
          fi

      - name: Auditoría y regresión
        run: |
          node --check js/tdj.js
          node --check js/tdj-16.33.144.js
          node tests/regresion-limpiar-global-tdj-144.mjs
