name: Regresión limpieza global TDJ

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar limpieza global desde Títulos/TJ
        run: node tests/regresion-limpiar-global-tdj-138.mjs
      - name: Aplicar rotulado puntual v16.33.139
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('liquidacion.html')
          s=p.read_text(encoding='utf-8')
          old='Período / Cuota'
          if old not in s:
              print('Etiqueta ya actualizada; no hay nada que modificar.')
              raise SystemExit(0)
          p.write_text(s.replace(old, 'Período'), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add liquidacion.html
          git commit -m 'fix: cambiar periodo cuota a periodo v16.33.139'
          git push
