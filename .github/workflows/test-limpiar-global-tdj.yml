name: Regresión limpieza global y resumen final TDJ

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar correcciones TDJ v16.33.141
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('js/tdj.js')
          s = p.read_text(encoding='utf-8')

          if 'const bloquesExcedentesFinal=[];' not in s:
              s = s.replace('    const paginas=[];\n', '    const paginas=[];\n    const bloquesExcedentesFinal=[];\n', 1)

          s = s.replace(
              '      if(bloqueExcedentes)paginas.push(`<section class="pdf-hoja">${bloqueExcedentes}</section>`);',
              '      if(bloqueExcedentes)bloquesExcedentesFinal.push(bloqueExcedentes);',
              1
          )

          if 'const hayTitulosRegistrados=titulos.some(t=>fechaISO(t.fecha)&&Number(t.valor)>0);' not in s:
              s = s.replace(
                  '    const observacionesBeneficio1419=',
                  '    const hayTitulosRegistrados=titulos.some(t=>fechaISO(t.fecha)&&Number(t.valor)>0);\n'
                  '    const hayExcedentesPago=bloquesExcedentesFinal.length>0;\n'
                  '    const observacionesBeneficio1419=',
                  1
              )

          final_marker = '    if(hayTitulosAplicados)    paginas.push(`<section class="pdf-hoja pdf-hoja-final-resumen">'
          final_replacement = '    if(hayTitulosRegistrados || hayExcedentesPago)    paginas.push(`<section class="pdf-hoja pdf-hoja-final-resumen">'
          if final_marker in s:
              s = s.replace(final_marker, final_replacement, 1)

          s = s.replace(
              '</div><section class="pdf-bloque"><h2>TÍTULOS SOBRANTES PARA ENDOSO</h2>',
              '</div>${bloquesExcedentesFinal.join("")}<section class="pdf-bloque"><h2>TÍTULOS PARA ENDOSO</h2>',
              1
          )

          required = [
              'const bloquesExcedentesFinal=[];',
              'if(bloqueExcedentes)bloquesExcedentesFinal.push(bloqueExcedentes);',
              'const hayTitulosRegistrados=titulos.some(t=>fechaISO(t.fecha)&&Number(t.valor)>0);',
              'const hayExcedentesPago=bloquesExcedentesFinal.length>0;',
              'if(hayTitulosRegistrados || hayExcedentesPago)    paginas.push(`<section class="pdf-hoja pdf-hoja-final-resumen">',
              '${bloquesExcedentesFinal.join("")}<section class="pdf-bloque"><h2>TÍTULOS PARA ENDOSO</h2>'
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit(f'No quedó aplicada la corrección PDF requerida: {needle}')
          if 'if(hayTitulosAplicados)    paginas.push(`<section class="pdf-hoja pdf-hoja-final-resumen">' in s:
              raise SystemExit('El resumen final todavía está condicionado a títulos aplicados.')

          p.write_text(s, encoding='utf-8')

          h = Path('titulos.html')
          html = h.read_text(encoding='utf-8')
          html = html.replace('js/tdj.js?v=16.33.123', 'js/tdj.js?v=16.33.141')
          html = html.replace('js/tdj.js?v=16.33.140', 'js/tdj.js?v=16.33.141')
          html = html.replace('Liquidador — módulo de Liquidación de Títulos / TDJ · v16.33.123', 'Liquidador — módulo de Liquidación de Títulos / TDJ · v16.33.141')
          html = html.replace('Liquidador — módulo de Liquidación de Títulos / TDJ · v16.33.140', 'Liquidador — módulo de Liquidación de Títulos / TDJ · v16.33.141')

          pattern = r'(<section class="tab-pane tdj-titulos-pane" data-pane="titulos">.*?<button type="button" class="tdj-clear btn-limpiar-tdj")'
          html, n = re.subn(pattern, r'\1 id="btnLimpiarTitulosGlobal"', html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('No se encontró exactamente el botón LIMPIAR de TÍTULOS/TDJ.')

          marker = '<script type="module" src="js/tdj.js?v=16.33.141"></script>'
          if 'id="tdj-global-clear-141"' not in html:
              guard = '''<script id="tdj-global-clear-141">
          document.addEventListener("DOMContentLoaded",function(){
            const b=document.getElementById("btnLimpiarTitulosGlobal");
            if(!b)return;
            b.addEventListener("click",function(e){
              e.stopImmediatePropagation();
              if(!confirm("¿Desea iniciar una nueva liquidación de títulos? Se borrarán datos, pagos, títulos y resultados."))return;
              window.location.href="titulos.html?reinicio="+Date.now();
            },true);
          });
          </script>
          '''
              html = html.replace(marker, guard + marker, 1)

          html = html.replace('<!-- TDJ UI DEPLOY 16.33.123 -->', '<!-- TDJ UI DEPLOY 16.33.141 -->')
          h.write_text(html, encoding='utf-8')
          PY

          if ! git diff --quiet -- js/tdj.js titulos.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add js/tdj.js titulos.html
            git commit -m 'fix: resumen final endoso TDJ y limpieza global v16.33.141'
            git pull --rebase origin main
            git push
          fi

      - name: Validar regresión v16.33.141
        run: node tests/regresion-endoso-resumen-141.mjs
