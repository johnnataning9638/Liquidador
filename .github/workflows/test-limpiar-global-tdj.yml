name: Regresión limpieza global y resumen final TDJ

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar motor y regresión TDJ e importadores
        run: |
          node --check js/tdj.js
          node --check js/tdj-core-16.33.143.js
          node tests/regresion-secuencia-tdj-129.mjs
          node tests/regresion-prioridad-pagos-tdj-130.mjs
          node tests/regresion-idempotencia-tdj-132.mjs
          node tests/regresion-saldo-final-134.mjs
          node tests/regresion-ui-titulos-136.mjs
          node tests/regresion-importadores-decimales-145.mjs
          node tests/regresion-simbolo-peso-importadores-146.mjs
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('js/tdj-core-16.33.143.js','utf8');
          const h=fs.readFileSync('titulos.html','utf8');
          const decl=/const hayTitulosRegistrados=titulos\.some\(t=>fechaISO\(t\.fecha\)&&Number\(t\.valor\)>0\);/;
          if((s.match(new RegExp(decl.source,'g'))||[]).length!==1) throw new Error('hayTitulosRegistrados no tiene una única declaración');
          const use=/if\(\(?hayTitulosRegistrados \|\| hayExcedentesPago/.exec(s);
          if(!use || s.indexOf('const hayTitulosRegistrados=')>use.index) throw new Error('TDZ en resumen PDF');
          if(!h.includes('Se borrarán datos, pagos, títulos y resultados.')) throw new Error('Confirmación global ausente');
          if(h.includes('¿Desea limpiar únicamente los títulos / TDJ registrados?')) throw new Error('Persistió el mensaje antiguo');
          if(!h.includes('tdj-version-guard')) throw new Error('Guardia de versión TDJ ausente');
          console.log('OK: regresión TDJ e importadores');
          NODE
