name: Regresión limpieza global y resumen final TDJ

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar motor y regresión TDJ
        run: |
          node --check js/tdj.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('js/tdj.js','utf8');
          const h=fs.readFileSync('titulos.html','utf8');
          const decl='const hayTitulosRegistrados=titulos.some(t=>fechaISO(t.fecha)&&Number(t.valor)>0);';
          if((s.match(/const hayTitulosRegistrados=titulos\.some\(t=>fechaISO\(t\.fecha\)&&Number\(t\.valor\)>0\);/g)||[]).length!==1) throw new Error('hayTitulosRegistrados no tiene una única declaración');
          if(s.indexOf(decl)>s.indexOf('if(hayTitulosRegistrados || hayExcedentesPago)')) throw new Error('TDZ en resumen PDF');
          if(!h.includes('Se borrarán datos, pagos, títulos y resultados.')) throw new Error('Confirmación global ausente');
          if(h.includes('¿Desea limpiar únicamente los títulos / TDJ registrados?')) throw new Error('Persistió el mensaje antiguo');
          console.log('OK: regresión TDJ');
          NODE
