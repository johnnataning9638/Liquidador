name: TDJ Fix 199
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted TDJ final-date correction
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('js/tdj-core-16.33.143.js')
          s=p.read_text()
          old='const fechaCorteFinal=corteObligacion||movimientosFinales.map(p=>fechaISO(p.fecha)||"").filter(Boolean).sort().at(-1)||hoyISO();'
          new='// v16.33.199: el cierre final debe considerar la fecha del último movimiento REAL, incluidos los TDJ aplicados después de una fecha de corte informativa. La fecha de corte solo limita pagos reales previos; no puede ocultar un TDJ efectivo ni dejar saldo artificial para bloquear el endoso.\n      const fechaCorteFinal=movimientosFinales.map(p=>fechaISO(p.fecha)||"").filter(Boolean).sort().at(-1)||corteObligacion||hoyISO();'
          if old not in s:
              raise SystemExit('No se encontró el patrón exacto de fechaCorteFinal; no se modifica el motor.')
          s=s.replace(old,new,1)
          p.write_text(s)
          print('PATCH_OK')
          PY
          sed -i 's/16\.33\.198/16.33.199/g' js/tdj.js
          sed -i 's/16\.33\.198/16.33.199/g' titulos.html
          cat > RELEASES/16.33.199.md <<'EOF'
# TDJ v16.33.199

## Corrección puntual — cierre final y fecha de corte informativa

Se corrige el bloqueo `INCONSISTENCIA TDJ: NO ES POSIBLE GENERAR ENDOSO...` que podía aparecer con saldo de obligaciones aun cuando el TDJ real ya había sido imputado.

### Causa identificada
El cierre final de cada obligación utilizaba `fechaCorteTDJ(o)` como fecha de liquidación final. Esa fecha corresponde a un registro de corte/proyección sin valor, no a un movimiento económico real. Si existía un TDJ efectivo posterior a ese corte, el TDJ podía quedar aplicado en la trazabilidad, pero el recálculo final volvía a una fecha anterior y dejaba un saldo artificial. La validación de endoso detectaba ese saldo y detenía correctamente el proceso.

### Corrección
El cierre final ahora toma la fecha del último movimiento económico real de `movimientosFinales`, incluyendo los TDJ efectivamente aplicados. La fecha de corte continúa limitando los pagos reales previos, pero no puede ocultar un TDJ efectivo posterior.

### Se preserva
- Fórmulas e intereses del motor.
- Proporcionalidad de pagos.
- Reglas especiales de TDJ <= $1.000.
- Beneficios/tasas seleccionados por obligación.
- Sanciones.
- Endoso: solo procede sobre remanente realmente no imputable.
- Exportaciones PDF/Excel y estructura visual.

### Verificación técnica
- Patrón de código corregido de forma exacta y aislada.
- `tdj.js` y `titulos.html` actualizados a v16.33.199 para invalidar caché.
- Se ejecutará `node --check` sobre los módulos TDJ antes del commit final.
EOF
          node --check js/tdj-core-16.33.143.js
          node --check js/tdj.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/tdj-core-16.33.143.js js/tdj.js titulos.html RELEASES/16.33.199.md
          git commit -m 'fix: correct TDJ final closure after real title movement'
          git push
          git rm .github/workflows/tdj-fix-199.yml
          git commit -m 'chore: remove one-time TDJ fix workflow'
          git push
