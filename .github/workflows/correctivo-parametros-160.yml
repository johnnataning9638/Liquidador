name: Correctivo parametros v16.33.160

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  correctivo:
    if: ${{ !contains(github.event.head_commit.message, 'fix: restaurar ejecucion de carga de parametros v16.33.160') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir cierre de funciones XLSX y versionar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files={
            'js/app.js': 'function crc32(bytes){',
            'js/tdj-core-16.33.143.js': 'function crc32TDJ(bytes){'
          }
          for name,next_fn in files.items():
            p=Path(name); s=p.read_text(encoding='utf-8')
            marker=f'</worksheet>;' if '</worksheet>;' in s else '</worksheet>'
            needle=marker+'\n\n'+next_fn
            if needle not in s:
              raise SystemExit(f'No se encontro el cierre defectuoso en {name}')
            s=s.replace(needle, marker+'\n}\n\n'+next_fn, 1)
            p.write_text(s.replace('16.33.159','16.33.160'),encoding='utf-8')
          for name in ['js/app.js','js/tdj-core-16.33.143.js','js/tdj.js','js/prioridad-tdj-v132.js','liquidacion.html','titulos.html']:
            p=Path(name); p.write_text(p.read_text(encoding='utf-8').replace('16.33.159','16.33.160'),encoding='utf-8')
          PY
      - name: Regresion exacta de carga de parametros
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          node --check js/tdj-core-16.33.143.js
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/regresion-parametros-159.mjs
          node tests/regresion-exportacion-excel-158.mjs
          node tests/regresion-secuencia-tdj-129.mjs
          node tests/regresion-prioridad-pagos-tdj-130.mjs
          node tests/regresion-idempotencia-tdj-132.mjs
          node tests/regresion-saldo-final-134.mjs
          node tests/regresion-importadores-decimales-145.mjs
          node tests/regresion-simbolo-peso-importadores-146.mjs
          node tests/regresion-secuencia-tdj-151.mjs
          node tests/regresion-secuencia-tdj-152.mjs
          for f in datos/uvt.json datos/tasas-moratorias.json datos/ipc.json datos/beneficios.json datos/sanciones.json datos/reglas-obligaciones.json datos/calendario.json datos/reglas-historicas.json; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; done
      - name: Crear regresion permanente parametros 160
        shell: bash
        run: |
          cat > tests/regresion-parametros-160.mjs <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const app=fs.readFileSync('js/app.js','utf8');
          const tdj=fs.readFileSync('js/tdj-core-16.33.143.js','utf8');
          assert.match(app,/return `[^`]*<\\/worksheet>`;\n}\n\nfunction crc32\(/s);
          assert.match(tdj,/return `[^`]*<\\/worksheet>`;\n}\n\nfunction crc32TDJ\(/s);
          for(const f of ['liquidacion.html','titulos.html','js/app.js','js/tdj-core-16.33.143.js']) assert.match(fs.readFileSync(f,'utf8'),/16\\.33\\.160/);
          for(const f of ['datos/uvt.json','datos/tasas-moratorias.json','datos/ipc.json','datos/beneficios.json','datos/sanciones.json','datos/reglas-obligaciones.json','datos/calendario.json','datos/reglas-historicas.json']) JSON.parse(fs.readFileSync(f,'utf8'));
          console.log('REGRESION PARAMETROS 16.33.160 OK — funciones XLSX cerradas; carga de parametros vuelve a ejecutar');
          EOF
          node tests/regresion-parametros-160.mjs
      - name: Commit correccion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js liquidacion.html titulos.html tests/regresion-exportacion-excel-158.mjs tests/regresion-parametros-160.mjs
          git commit -m 'fix: restaurar ejecucion de carga de parametros v16.33.160'
          git push origin HEAD:main
