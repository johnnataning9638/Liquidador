name: one-time-ui-label-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'fix: cambiar periodo cuota a periodo v16.33.139'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar etiqueta
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('liquidacion.html')
          s=p.read_text(encoding='utf-8')
          old='Período / Cuota'
          new='Período'
          if old not in s:
              raise SystemExit('No se encontró la etiqueta objetivo')
          p.write_text(s.replace(old,new), encoding='utf-8')
          PY
      - name: Commit cambio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add liquidacion.html
          git commit -m 'fix: cambiar periodo cuota a periodo v16.33.139'
          git push
