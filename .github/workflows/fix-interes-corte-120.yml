name: Fix interés PDF corte v16.33.120

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Aplicar corrección PDF de interés por corte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          app = root / 'js/app.js'
          text = app.read_text(encoding='utf-8')
          new_app = r'''function tablaInteresesPdf(x,r){
            const detallePago=Array.isArray(x?.interesesPorCuota)?x.interesesPorCuota:[];
            const detalleCorte=Array.isArray(r?.interesesPorCuota)?r.interesesPorCuota:[];
            const p=x?.pago||{};
            const esCorteInformativo=Number(p.valor||0)===0 && Boolean(fechaISO(p.fecha)) && !String(p.recibo||"").trim() && !String(p.tdj||"").trim();
            const filas=detallePago.length?detallePago:(esCorteInformativo?detalleCorte:[]);
            const interesDirecto=(t)=>Number(t?.interes??t?.valor??0);
            const interesAnidado=(t)=>{
              const grupos=[];
              if(Array.isArray(t?.tramos))grupos.push(...t.tramos);
              if(Array.isArray(t?.tramoInteres1))grupos.push(...t.tramoInteres1);
              if(Array.isArray(t?.tramoInteres2))grupos.push(...t.tramoInteres2);
              if(t?.tramoSuspension)grupos.push(t.tramoSuspension);
              return grupos.reduce((s,z)=>s+Math.max(0,Number(z?.valor??z?.interes??0)),0);
            };
            const capitalFila=(t)=>{
              const vtoRef=(r?.vencimientos||[]).find(v=>v?.id===t?.vto)||null;
              return Number(t?.capitalBase||t?.base||vtoRef?.saldo||vtoRef?.impuesto||0);
            };
            const interesesCalculados=filas.map(t=>{
              const directo=interesDirecto(t);
              if(directo>0)return directo;
              return esCorteInformativo?interesAnidado(t):0;
            });
            if(esCorteInformativo && filas.length && interesesCalculados.every(v=>v<=0)){
              const totalCorte=Math.max(0,Number(r?.intereses||0));
              if(totalCorte>0){
                const bases=filas.map(capitalFila);
                const baseTotal=bases.reduce((s,v)=>s+Math.max(0,v),0);
                if(filas.length===1)interesesCalculados[0]=totalCorte;
                else if(baseTotal>0)filas.forEach((_,i)=>{interesesCalculados[i]=totalCorte*(Math.max(0,bases[i])/baseTotal);});
              }
            }
            let rows="";
            if(filas.length){
              rows=filas.map((t,i)=>{
                const vtoRef=(r?.vencimientos||[]).find(v=>v?.id===t?.vto)||null;
                const cuota=t?.cuota??t?.vto??vtoRef?.numero??(i+1);
                const capital=capitalFila(t);
                const fechaVto=t?.fechaVencimiento||vtoRef?.fecha||"";
                const fechaPago=t?.fechaPago||p.fecha||(esCorteInformativo?r?.fechaCorte||"":"");
                const dias=Number(t?.dias||0);
                const tasa=t?.tasa!=null?((Number(t.tasa)*100).toFixed(3)+"%"):(x?.tasaVisible!=null?Number(x.tasaVisible).toFixed(3)+"%":"—");
                const interes=Number(interesesCalculados[i]||0);
                return `<tr><td>${escPdf(cuota)}</td><td>${dinero(capital)}</td><td>${escPdf(fechaVisible(fechaVto))}</td><td>${escPdf(fechaVisible(fechaPago))}</td><td>${dias}</td><td>${tasa}</td><td>${dinero(interes)}</td></tr>`;
              }).join("");
            }else{
              rows=(r?.vencimientos||[]).map(v=>`<tr><td>${escPdf(v?.numero||"")}</td><td>${dinero(0)}</td><td>${escPdf(fechaVisible(v?.fecha||""))}</td><td>${escPdf(fechaVisible(p.fecha||""))}</td><td>0</td><td>${x?.tasaVisible==null?"—":Number(x.tasaVisible).toFixed(3)+"%"}</td><td>${dinero(0)}</td></tr>`).join("");
            }
            const total=filas.length?interesesCalculados.reduce((s,v)=>s+Number(v||0),0):(esCorteInformativo?Number(r?.intereses||0):Number(x?.interesGenerado||0));
            return `<div class="pdf-intereses"><h3>CÁLCULO DE INTERESES POR CUOTA</h3><table><thead><tr><th>CUOTA</th><th>CAPITAL BASE</th><th>FECHA VENCIMIENTO</th><th>FECHA PAGO</th><th>DÍAS</th><th>TASA</th><th>INTERÉS</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="6">TOTAL INTERESES DEL PAGO</th><th>${dinero(total)}</th></tr></tfoot></table></div>`;
          }
          '''
          pattern = re.compile(r'function tablaInteresesPdf\(x,r\)\{[\s\S]*?\n\}\n\n(?=function valorNominalPagoPdf)')
          text2, n = pattern.subn(new_app + '\n', text, count=1)
          if n != 1:
              raise SystemExit('No se pudo localizar tablaInteresesPdf en app.js')
          app.write_text(text2, encoding='utf-8')

          tdj = root / 'js/tdj.js'
          text = tdj.read_text(encoding='utf-8')
          new_tdj = r'''function tablaInteresesPdfTDJ(x,r){
            const detallePago=Array.isArray(x?.interesesPorCuota)?x.interesesPorCuota:[];
            const detalleCorte=Array.isArray(r?.interesesPorCuota)?r.interesesPorCuota:[];
            const p=x?.pago||{};
            const esCorteInformativo=Number(p.valor||0)===0 && Boolean(fechaISO(p.fecha)) && !String(p.recibo||"").trim() && !String(p.tdj||"").trim();
            const filas=detallePago.length?detallePago:(esCorteInformativo?detalleCorte:[]);
            const interesDirecto=(t)=>Number(t?.interes??t?.valor??0);
            const interesAnidado=(t)=>{
              const grupos=[];
              if(Array.isArray(t?.tramos))grupos.push(...t.tramos);
              if(Array.isArray(t?.tramoInteres1))grupos.push(...t.tramoInteres1);
              if(Array.isArray(t?.tramoInteres2))grupos.push(...t.tramoInteres2);
              if(t?.tramoSuspension)grupos.push(t.tramoSuspension);
              return grupos.reduce((s,z)=>s+Math.max(0,Number(z?.valor??z?.interes??0)),0);
            };
            const capitalFila=(t)=>{
              const vtoRef=(r?.vencimientos||[]).find(v=>v?.id===t?.vto)||null;
              return Number(t?.capitalBase||t?.base||vtoRef?.saldo||vtoRef?.impuesto||0);
            };
            const interesesCalculados=filas.map(t=>{
              const directo=interesDirecto(t);
              if(directo>0)return directo;
              return esCorteInformativo?interesAnidado(t):0;
            });
            if(esCorteInformativo && filas.length && interesesCalculados.every(v=>v<=0)){
              const totalCorte=Math.max(0,Number(r?.intereses||0));
              if(totalCorte>0){
                const bases=filas.map(capitalFila);
                const baseTotal=bases.reduce((s,v)=>s+Math.max(0,v),0);
                if(filas.length===1)interesesCalculados[0]=totalCorte;
                else if(baseTotal>0)filas.forEach((_,i)=>{interesesCalculados[i]=totalCorte*(Math.max(0,bases[i])/baseTotal);});
              }
            }
            let rows="";
            if(filas.length){
              rows=filas.map((t,i)=>{
                const vtoRef=(r?.vencimientos||[]).find(v=>v?.id===t?.vto)||null;
                const cuota=t?.cuota??t?.vto??vtoRef?.numero??(i+1);
                const capital=capitalFila(t);
                const fechaVto=t?.fechaVencimiento||vtoRef?.fecha||"";
                const fechaPago=t?.fechaPago||p.fecha||(esCorteInformativo?r?.fechaCorte||"":"");
                const dias=Number(t?.dias||0);
                const tasa=t?.tasa!=null?((Number(t.tasa)*100).toFixed(3)+"%"):(x?.tasaVisible!=null?Number(x.tasaVisible).toFixed(3)+"%":"—");
                const interes=Number(interesesCalculados[i]||0);
                return `<tr><td>${escPdf(cuota)}</td><td>${dinero(capital)}</td><td>${escPdf(fechaVisible(fechaVto))}</td><td>${escPdf(fechaVisible(fechaPago))}</td><td>${dias}</td><td>${tasa}</td><td>${dinero(interes)}</td></tr>`;
              }).join("");
            }else{
              rows=(r?.vencimientos||[]).map(v=>`<tr><td>${escPdf(v?.numero||"")}</td><td>${dinero(0)}</td><td>${escPdf(fechaVisible(v?.fecha||""))}</td><td>${escPdf(fechaVisible(p.fecha||""))}</td><td>0</td><td>${x?.tasaVisible==null?"—":Number(x.tasaVisible).toFixed(3)+"%"}</td><td>${dinero(0)}</td></tr>`).join("");
            }
            const total=filas.length?interesesCalculados.reduce((s,v)=>s+Number(v||0),0):(esCorteInformativo?Number(r?.intereses||0):Number(x?.interesGenerado||0));
            return `<div class="pdf-intereses"><h3>CÁLCULO DE INTERESES POR CUOTA</h3><table><thead><tr><th>CUOTA</th><th>CAPITAL BASE</th><th>FECHA VENCIMIENTO</th><th>FECHA PAGO / TDJ</th><th>DÍAS</th><th>TASA</th><th>INTERÉS</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="6">TOTAL INTERESES DEL PAGO</th><th>${dinero(total)}</th></tr></tfoot></table></div>`;
          }
          '''
          pattern = re.compile(r'function tablaInteresesPdfTDJ\(x,r\)\{[\s\S]*?\n\}\n\n(?=function bloqueSuspensionInteresesPdfTDJ)')
          text2, n = pattern.subn(new_tdj + '\n', text, count=1)
          if n != 1:
              raise SystemExit('No se pudo localizar tablaInteresesPdfTDJ en tdj.js')
          tdj.write_text(text2, encoding='utf-8')

          # Alinear la versión activa a 16.33.120, excluyendo el histórico de releases.
          excluded_dirs = {'.git', 'RELEASES', 'node_modules'}
          exts = {'.js','.html','.css','.yml','.yaml','.json','.mjs'}
          for path in root.rglob('*'):
              if not path.is_file() or any(part in excluded_dirs for part in path.parts):
                  continue
              if path.suffix.lower() not in exts:
                  continue
              try:
                  s = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if '16.33.119' in s:
                  path.write_text(s.replace('16.33.119','16.33.120'), encoding='utf-8')

          audit = root / '.github/workflows/audit-estabilidad.yml'
          s = audit.read_text(encoding='utf-8').replace('16.33.119','16.33.120').replace('16\\.33\\.(110|111|112|113|114|115|116|117|118)','16\\.33\\.(110|111|112|113|114|115|116|117|118|119)')
          audit.write_text(s, encoding='utf-8')

          release = root / 'RELEASES/16.33.120.md'
          release.write_text('''# 16.33.120\n\n- CORRIGE EXCLUSIVAMENTE EL VALOR DE INTERÉS EN EL BLOQUE PDF “CÁLCULO DE INTERESES POR CUOTA” PARA CIERRES INFORMATIVOS SIN PAGO.\n- CUANDO EL MOTOR YA REPORTA EL INTERÉS TOTAL DE LA FECHA DE CORTE, EL PDF LO REFLEJA EN LA FILA CORRESPONDIENTE Y EN “TOTAL INTERESES DEL PAGO”.\n- APLICA EN LIQUIDADOR DIAN/RIAN Y EN TDJ.\n- NO MODIFICA LAS FÓRMULAS DEL MOTOR, SANCIONES, PAGOS, RÉGIMEN SIMPLE, VENCIMIENTOS NI DISTRIBUCIÓN TDJ.\n''', encoding='utf-8')

          test = root / 'tests/regresion-interes-corte-pdf.mjs'
          test.write_text(r'''import fs from 'node:fs';
import assert from 'node:assert/strict';

const app=fs.readFileSync('js/app.js','utf8');
const tdj=fs.readFileSync('js/tdj.js','utf8');
for(const [name,src] of [['DIAN/RIAN',app],['TDJ',tdj]]){
  assert.match(src,/interesesCalculados/,
    `${name}: falta el cálculo de interés para PDF`);
  assert.match(src,/Number\(r\?\.intereses\|\|0\)/,
    `${name}: falta el fallback al interés total de corte`);
  assert.match(src,/filas\.length===1\)interesesCalculados\[0\]=totalCorte/,
    `${name}: no conserva el interés total en una sola cuota`);
  assert.match(src,/interesesCalculados\.reduce/,
    `${name}: el total PDF no usa los intereses calculados`);
}

function simular(filas,r){
  const esCorte=true;
  const interesDirecto=t=>Number(t?.interes??t?.valor??0);
  const interesAnidado=t=>0;
  const valores=filas.map(t=>{
    const directo=interesDirecto(t);
    return directo>0?directo:interesAnidado(t);
  });
  if(esCorte && filas.length && valores.every(v=>v<=0)){
    const totalCorte=Math.max(0,Number(r?.intereses||0));
    if(totalCorte>0){
      const bases=filas.map(t=>Number(t?.capitalBase||0));
      const baseTotal=bases.reduce((s,v)=>s+Math.max(0,v),0);
      if(filas.length===1)valores[0]=totalCorte;
      else if(baseTotal>0)filas.forEach((_,i)=>{valores[i]=totalCorte*(Math.max(0,bases[i])/baseTotal);});
    }
  }
  return {valores,total:valores.reduce((s,v)=>s+v,0)};
}

const caso=simular([{capitalBase:5420000,interes:0}],{intereses:2326000});
assert.equal(caso.valores[0],2326000);
assert.equal(caso.total,2326000);

const normal=simular([{capitalBase:5420000,interes:125000}],{intereses:2326000});
assert.equal(normal.valores[0],125000);
assert.equal(normal.total,125000);

console.log('OK: interés de corte se refleja en fila y total; cálculo normal permanece intacto.');
''', encoding='utf-8')
          PY

      - name: Ejecutar pruebas locales antes de commit
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/regresion-interes-corte-pdf.mjs
          node tests/regresion-matematica.mjs
          node tests/regresion-ui.mjs

      - name: Commit y push
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj.js .github/workflows/audit-estabilidad.yml RELEASES/16.33.120.md tests/regresion-interes-corte-pdf.mjs
          git commit -m 'fix: mostrar interés de corte en PDF v16.33.120'
          git push origin main
