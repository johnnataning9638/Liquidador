name: Aplicar fecha de corte 16.33.117
"on":
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '16.33.117 aplicado') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Aplicar parche
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def must_replace(path, pattern, repl, flags=0):
              p=Path(path); s=p.read_text(encoding='utf-8'); ns,n=re.subn(pattern,repl,s,count=1,flags=flags)
              if n!=1: raise SystemExit(f'Parche no aplicado en {path}: {n} coincidencias')
              p.write_text(ns,encoding='utf-8')

          # DIAN: una fila solo con fecha es corte; los pagos reales siguen intactos.
          must_replace('js/app.js',
            r'  const pagosReales=pagos\.filter\(p=>Number\(p\?\.valor\|\|0\)>0\);\n  const fechaUltimoPago=pagosReales\.map\(p=>fechaISO\(p\?\.fecha\)\|\|""\)\.filter\(Boolean\)\.sort\(\)\.at\(-1\)\|\|"";\n  const filaFechaCorte=pagos\.find\(p=>\n    fechaISO\(p\?\.fecha\) && Number\(p\?\.valor\|\|0\)<=0 && !String\(p\?\.tdj\|\|""\)\.trim\(\) && !String\(p\?\.recibo\|\|""\)\.trim\(\)\n  \);\n  const fechaCorte=pagosReales\.length\?fechaUltimoPago:\(fechaISO\(filaFechaCorte\?\.fecha\)\|\|""\);',
            '''  const pagosReales=pagos.filter(p=>Number(p?.valor||0)>0);\n  const fechaUltimoPago=pagosReales.map(p=>fechaISO(p?.fecha)||"").filter(Boolean).sort().at(-1)||"";\n  const fechasCorte=pagos.filter(p=>fechaISO(p?.fecha)&&Number(p?.valor||0)<=0&&!String(p?.tdj||"").trim()&&!String(p?.recibo||"").trim()).map(p=>fechaISO(p.fecha)||"").filter(Boolean).sort();\n  const fechaCorte=fechasCorte.at(-1)||fechaUltimoPago;''')

          must_replace('js/app.js',
            r'    const datosCalculo=ajustarTDJParaPagosPosteriores\(motor,d\);',
            '''    const datosBase={...d,pagos:(d.pagos||[]).filter(p=>Number(p?.valor||0)>0)};\n    const datosCalculo=ajustarTDJParaPagosPosteriores(motor,datosBase);''')

          must_replace('js/app.js',
            r'  \$\("rFechaPago"\)\.textContent=u\?\.pago\?\.fecha\?fechaVisible\(u\.pago\.fecha\):"—";',
            '  $("rFechaPago").textContent=r?.fechaCorte?fechaVisible(r.fechaCorte):(u?.pago?.fecha?fechaVisible(u.pago.fecha):"—");')

          # Motor base: cierre posterior a pagos reales, sin descontar un pago ficticio.
          anchor=r'    const impuesto=saldosVto\.reduce\(\(a,v\)=>a\+Math\.max\(0,v\.saldo\),0\);\n    const ultimo=detalle\.at\(-1\)\|\|null;'
          motor_patch='''    const fechaUltimoPagoReal=pagos.map(p=>fechaISO(p?.fecha)||"").filter(Boolean).sort().at(-1)||"";\n    const hayCierreFechaCorte=Boolean(fechaCorte&&(!fechaUltimoPagoReal||fechaCorte>fechaUltimoPagoReal));\n    let detalleFechaCorte=null;\n    if(hayCierreFechaCorte){\n      let interesesCorte=0;\n      const interesesPorCuotaCorte=[];\n      for(const v of saldosVto){\n        if(Number(v.saldo||0)<=0||fechaCorte<=v.fecha)continue;\n        const ih=this.interesParaPago(v.saldo,v.fecha,fechaCorte,{tipo:"TASA DIAN",factor:1,tasaFija:null});\n        if(ih.valor==null){advertenciasSancion.push("No hay tasa histórica suficiente para cerrar intereses a la fecha de corte.");continue;}\n        interesesCorte+=Number(ih.valor||0);\n        interesesPorCuotaCorte.push(...((ih.tramos&&ih.tramos.length)?ih.tramos:[{vto:v.id,base:Number(v.saldo||0),valor:Number(ih.valor||0),interes:Number(ih.valor||0),metodologia:ih.metodologia,dias:Number(ih.dias||0),desde:v.fecha,hasta:fechaCorte,tasa:ih.tasa}]).map(t=>({...t,vto:t.vto||v.id,base:Number(t.base??v.saldo??0)})));\n      }\n      saldoIntereses=roundMil(interesesCorte);\n      const esPrivada=String(datos.tipoLiquidacion||"").toUpperCase()==="PRIVADA";\n      const primeraAct=fechaSancion?`${Number(this.actualizadorSancion.sumarUnAnio(fechaSancion).slice(0,4))+1}-01-01`:"";\n      const puedeAct=!articulo10Seleccionado&&(!esPrivada||(primeraAct&&fechaCorte>=primeraAct));\n      const actCorte={aplicada:false,fechaCorte,actualizacionTotal:0,tramos:[],saldoAntes:roundMil(saldoSancion),saldoDespues:roundMil(saldoSancion)};\n      if(saldoSancion>0&&fechaSancion&&fechaCorte>fechaSancion&&puedeAct){\n        const act=this.actualizadorSancion.calcular(saldoSancion,fechaSancion,fechaCorte,{aniosExcluir:[...aniosActualizacionSancionAplicados]});\n        if(act.valor>saldoSancion)saldoSancion=act.valor;\n        if(act.tramos?.length){act.tramos.forEach(t=>aniosActualizacionSancionAplicados.add(Number(t.anio)));detalleActualizacionSancion.push({fechaCorte,...act});actCorte.aplicada=true;actCorte.tramos=act.tramos.map(t=>({anio:Number(t.anio),desde:t.desde,hasta:t.hasta,dias:Number(t.dias||0),saldoAntes:roundMil(t.saldoInicial||0),actualizacion:roundMil(t.actualizacion||0),saldoDespues:roundMil(t.saldoFinal||0),ipc:Number(t.ipc||0),ipcPorcentaje:Number(t.ipcPorcentaje||0)}));actCorte.actualizacionTotal=roundMil(actCorte.tramos.reduce((a,t)=>a+Number(t.actualizacion||0),0));}\n        advertenciasSancion.push(...(act.advertencias||[]));\n      }\n      detalleFechaCorte={pago:{id:`CORTE-${fechaCorte}`,fecha:fechaCorte,valor:0,recibo:"",tipo:"FECHA DE CORTE",esFechaCorte:true},tasa:this.tasaPorFecha(fechaCorte,"TASA DIAN"),tasaVisible:Number(this.tasaPorFecha(fechaCorte,"TASA DIAN")||0)*100,tipoAplicado:"FECHA DE CORTE",notaBeneficio:"CIERRE INFORMATIVO SIN PAGO",interesGenerado:saldoIntereses,interesLiquidado:saldoIntereses,tramosInteres:interesesPorCuotaCorte,interesesPorCuota:interesesPorCuotaCorte,deudaAntes:{impuesto:saldosVto.reduce((a,v)=>a+Math.max(0,Number(v.saldo||0)),0),intereses:saldoIntereses,sancion:roundMil(saldoSancion)},aplicado:{impuesto:0,intereses:0,sancion:0,total:0,excedente:0,porcentaje:0,tipoProporcion:"FECHA DE CORTE — SIN PAGO"},excedente:0,aplicacionesVto:[],esFechaCorte:true,actualizacionSancion:actCorte,saldo:{impuesto:saldosVto.reduce((a,v)=>a+Math.max(0,Number(v.saldo||0)),0),intereses:saldoIntereses,sancion:Math.max(0,saldoSancion),total:saldosVto.reduce((a,v)=>a+Math.max(0,Number(v.saldo||0)),0)+saldoIntereses+Math.max(0,saldoSancion)}};\n      detalle.push(detalleFechaCorte);\n    }\n    const impuesto=saldosVto.reduce((a,v)=>a+Math.max(0,v.saldo),0);\n    const ultimo=detalleFechaCorte||detalle.at(-1)||null;'''
          must_replace('js/motor-liquidacion-base.js',anchor,motor_patch)

          # TDJ: fecha de corte puede vivir en pagos o en títulos.
          insert=r'function agregarTitulo\(\)\{invalidarResultadoTDJ\(\);titulos\.push\(nuevoTitulo\(titulos\.length\+1\)\);renderTitulos\(\);actualizarVisibilidadTasasObligacionesTDJ\(\);\}\n'
          helper='''function esFechaCorteTDJ(x){return Boolean(fechaISO(x?.fecha))&&Number(x?.valor||0)<=0&&!String(x?.tdj||"").trim()&&!String(x?.recibo||"").trim();}\nfunction fechaCorteTDJ(o){return [...(o?.pagos||[]).filter(esFechaCorteTDJ).map(x=>fechaISO(x.fecha)||""),...(titulos||[]).filter(esFechaCorteTDJ).map(x=>fechaISO(x.fecha)||"")].filter(Boolean).sort().at(-1)||"";}\nfunction pagosRealesHastaCorteTDJ(o,corte=""){return (o?.pagos||[]).filter(p=>p.fecha&&Number(p.valor)>0&&(!corte||String(p.fecha)<=String(corte))).map(p=>({...p,fecha:fechaISO(p.fecha),valor:truncarValorEntero(p.valor)})).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))||Number(a._orden||0)-Number(b._orden||0));}\n'''
          must_replace('js/tdj.js',insert,lambda m:m.group(0)+helper)

          must_replace('js/tdj.js',r'    o\.pagos=o\.pagos\.filter\(p=>p\.fecha&&Number\(p\.valor\)>0\)\.map\(p=>\(\{\.\.\.p,fecha:fechaISO\(p\.fecha\),valor:truncarValorEntero\(p\.valor\)\}\)\);\n    ordenarPagosCronologicamente\(o\);',r'''    o.pagos=o.pagos.filter(p=>p.fecha&&(Number(p.valor)>0||esFechaCorteTDJ(p))).map(p=>({...p,fecha:fechaISO(p.fecha),valor:truncarValorEntero(p.valor||0)}));\n    ordenarPagosCronologicamente(o);''')

          must_replace('js/tdj.js',r'  for\(const t of titulosValidos\)\{\n    if\(!String\(t\?\.tdj\|\|""\)\.trim\(\)\)\{',r'''  for(const t of titulosValidos){\n    if(esFechaCorteTDJ(t))continue;\n    if(!String(t?.tdj||"").trim()){''')

          must_replace('js/tdj.js',r'function calcularLiquidacionBaseTDJ\(o\)\{\n  const pagos=\[\.\.\.\(o\.pagos\|\|\[\]\)\]\.filter\(p=>p\.fecha&&Number\(p\.valor\)>0\)\.sort\(\(a,b\)=>String\(a\.fecha\)\.localeCompare\(String\(b\.fecha\)\)\);\n  const fechaCorte=pagos\.at\(-1\)\?\.fecha\|\|hoyISO\(\);\n  return motorParaObligacion\(o\)\.calcular\(datosMotor\(o,pagos,fechaCorte\)\);\n\}',r'''function calcularLiquidacionBaseTDJ(o){\n  const corte=fechaCorteTDJ(o);\n  const pagos=pagosRealesHastaCorteTDJ(o,corte);\n  const fechaLiquidacion=corte||pagos.at(-1)?.fecha||hoyISO();\n  return motorParaObligacion(o).calcular(datosMotor(o,pagos,fechaLiquidacion));\n}''')

          must_replace('js/tdj.js',r'        const pagosBase=\[\.\.\.o\.pagos\]\n          \.filter\(p=>p\.fecha&&p\.fecha<=t\.fecha\)',r'''        const corteObligacion=fechaCorteTDJ(o);\n        if(corteObligacion&&t.fecha>corteObligacion)continue;\n        const pagosBase=pagosRealesHastaCorteTDJ(o,corteObligacion)\n          .filter(p=>p.fecha<=t.fecha)''')

          must_replace('js/tdj.js',r'      const movimientosFinales=\[\n        \.\.\.\(o\.pagos\|\|\[\]\)\.map\(\(p,i\)=>\(\{\.\.\.p,ordenInterno:Number\(p\.ordenInterno\?\?i\)\}\)\),',r'''      const corteObligacion=fechaCorteTDJ(o);\n      const movimientosFinales=[\n        ...pagosRealesHastaCorteTDJ(o,corteObligacion).map((p,i)=>({...p,ordenInterno:Number(p.ordenInterno??i)})),''')

          must_replace('js/tdj.js',r'      const fechaCorteFinal=movimientosFinales\n        \.map\(p=>fechaISO\(p\.fecha\)\|\|""\)\n        \.filter\(Boolean\)\n        \.sort\(\)\.at\(-1\)\|\|hoyISO\(\);',r'''      const fechaCorteFinal=corteObligacion||movimientosFinales.map(p=>fechaISO(p.fecha)||"").filter(Boolean).sort().at(-1)||hoyISO();''')

          # Versionado global de la release.
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in {'.js','.mjs','.html','.css','.yml','.yaml','.json','.md'}: continue
              try:s=p.read_text(encoding='utf-8')
              except:continue
              if '16.33.116' in s:p.write_text(s.replace('16.33.116','16.33.117'),encoding='utf-8')

          # Prueba específica de regresión del motor.
          Path('tests/regresion-fecha-corte.mjs').write_text('''import assert from "node:assert/strict";\nimport {MotorLiquidacion} from "../js/motor-liquidacion.js";\nconst rates=[{desde:"2026-01-01",hasta:"2026-12-31",metodologia:"INTERES_SIMPLE_DIARIO",tasas:{"TASA DIAN":0.365}}];\nconst cfg={tasasMoratorias:rates,intereses:rates,reglasObligaciones:[{concepto:"PRUEBA FECHA CORTE",familia:"TEST",vencimientos:"MANUAL",periodicidad:"ANUAL"}],uvt:[]};\nconst base={concepto:"PRUEBA FECHA CORTE",anio:2026,tipoLiquidacion:"PRIVADA",tieneSancion:"NO",valorSancion:0,fechaSancion:"",vencimientos:[{id:"V1",numero:1,fecha:"2026-01-01",impuesto:100000}]};\nconst a=new MotorLiquidacion(cfg).calcular({...base,pagos:[],fechaCorte:"2026-02-01"});\nassert.equal(a.fechaCorte,"2026-02-01"); assert.ok(a.intereses>0);\nconst b=new MotorLiquidacion(cfg).calcular({...base,pagos:[{id:"P1",fecha:"2026-01-15",valor:20000,tipo:"TASA DIAN"}],fechaCorte:"2026-02-01"});\nassert.equal(b.fechaCorte,"2026-02-01"); assert.equal(b.detalle.filter(x=>x.esFechaCorte).length,1); assert.equal(Number(b.detalle.at(-1).pago.valor),0);\nconsole.log("PASS: fecha de corte sin pago ficticio y posterior a pagos reales");\n''',encoding='utf-8')
          PY
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/regresion-fecha-corte.mjs
          node tests/regresion-matematica.mjs
          node tests/regresion-ui.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js tests .github/workflows/audit-estabilidad.yml
          git commit -m 'feat: fecha de corte sin pago ficticio 16.33.117 aplicado'
          git push origin HEAD:main
