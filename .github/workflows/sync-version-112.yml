name: Sincronización única de versión 16.33.112

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '16.33.112')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sincronizar referencias de versión
        shell: bash
        run: |
          set -euo pipefail
          OLD='16.33.110'
          NEW='16.33.112'
          find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.mjs' -o -name '*.css' -o -name '*.yml' -o -name '*.yaml' \) -not -path './.git/*' -print0 | xargs -0 sed -i "s/${OLD}/${NEW}/g"

      - name: Validar que no queden referencias 16.33.110
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nF '16.33.110' --exclude-dir=.git .; then
            echo 'ERROR: quedan referencias 16.33.110.'
            exit 1
          fi

      - name: Confirmar cambios
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Sin cambios de versión.'
            exit 0
          fi
          git commit -m 'chore: completar sincronización global 16.33.112'
          git push

      - name: Eliminar workflow de sincronización única
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-version-112.yml
          git add -A
          git commit -m 'chore: retirar sincronizador temporal 16.33.112' || exit 0
          git push
