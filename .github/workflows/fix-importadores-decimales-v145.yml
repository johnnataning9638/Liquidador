name: Fix importadores decimales v16.33.145

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix-importadores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar corrección aislada de importadores
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root=Path('.')

          # ------------------------------------------------------------
          # 1) IMPORTADOR DIAN DE PAGOS: nueva ruta física v145.
          #    Corrige filas CSV donde la coma decimal divide el importe
          #    en dos celdas antes de llegar a numeroDesdeTexto().
          # ------------------------------------------------------------
          imp=Path('js/importador.js')
          imp145=Path('js/importador-16.33.145.js')
          code=imp.read_text(encoding='utf-8')

          old='''function separarFilaPagos(linea){
  const s=String(linea??"").trim();
  if(!s)return [];
  if(s.includes("\\t"))return s.split("\\t").map(limpiarCeldaPago);
  // Markdown/HTML copiado como tabla: | a | b | c |
  if(/\\|/.test(s))return s.replace(/^\\s*\\|/,'').replace(/\\|\\s*$/,'').split("|").map(limpiarCeldaPago);
  if(/;/.test(s)&&s.split(";").length>=3)return s.split(";").map(limpiarCeldaPago);
  // CSV: no separar por coma cuando la fila contiene un importe como
  // 1,688,000 o $1,688,000. En ese caso la coma pertenece al valor.
  const partesComa=s.split(",");
  const pareceImporteMiles=/\\$?\\s*\\d{1,3}(?:,\\d{3})+(?:\\s*)$/.test(s);
  if(!pareceImporteMiles&&/,(?=[^,]*\\s*(?:\\d|\\$))/.test(s)&&partesComa.length>=3)return partesComa.map(limpiarCeldaPago);
  return [s];
}'''

          new='''function separarFilaPagos(linea,columnasEsperadas=0,indiceValor=-1){
  const s=String(linea??"").trim();
  if(!s)return [];
  if(s.includes("\\t"))return s.split("\\t").map(limpiarCeldaPago);
  // Markdown/HTML copiado como tabla: | a | b | c |
  if(/\\|/.test(s))return s.replace(/^\\s*\\|/,'').replace(/\\|\\s*$/,'').split("|").map(limpiarCeldaPago);
  if(/;/.test(s)&&s.split(";").length>=3)return s.split(";").map(limpiarCeldaPago);

  // CSV con comas: conserva comas dentro de comillas y, cuando conocemos
  // la estructura de la cabecera, recompone automáticamente un importe que
  // viene como 1234,56 o 1.234.567,89 sin descartarlo.
  const partes=[];let cur="",quoted=false;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch==='"'){quoted=!quoted;continue;}
    if(ch===","&&!quoted){partes.push(limpiarCeldaPago(cur));cur="";continue;}
    cur+=ch;
  }
  partes.push(limpiarCeldaPago(cur));
  if(columnasEsperadas>0 && indiceValor>=0 && partes.length>columnasEsperadas){
    const extras=partes.length-columnasEsperadas;
    // Probar agrupaciones consecutivas en la posición del importe. Se acepta
    // únicamente si la agrupación produce un valor numérico válido; así no se
    // confunden observaciones con importes.
    for(let grupos=extras+1;grupos>=2;grupos--){
      const fin=indiceValor+grupos;
      if(fin>partes.length)continue;
      const candidato=partes.slice(indiceValor,fin).join(",");
      const n=numeroDesdeTexto(candidato);
      if(!Number.isFinite(n))continue;
      const reconstruida=[...partes.slice(0,indiceValor),candidato,...partes.slice(fin)];
      if(reconstruida.length===columnasEsperadas)return reconstruida;
    }
  }
  // Formato sin cabecera: mantener el comportamiento anterior, pero aceptar
  // una fila cuyo último campo sea un importe con coma decimal.
  const pareceImporteMiles=/\\$?\\s*\\d{1,3}(?:,\\d{3})+(?:\\s*)$/.test(s);
  if(!pareceImporteMiles&&partes.length>=3)return partes;
  return [s];
}'''
          if old not in code:
            raise SystemExit('No se encontró separarFilaPagos() esperado en importador.js')
          code=code.replace(old,new,1)
          code=code.replace('const c=separarFilaPagos(lines[r]);','const c=separarFilaPagos(lines[r],headers.length,ix.valor);')
          imp145.write_text(code,encoding='utf-8')

          # ------------------------------------------------------------
          # 2) APP DIAN v145: normalización final para Importar e Importar IA.
          #    Aunque la IA entregue 1234.56, la frontera de aplicación lo
          #    convierte siempre a 1234 sin redondear.
          # ------------------------------------------------------------
          app=Path('js/app.js')
          app145=Path('js/app-16.33.145.js')
          appcode=app.read_text(encoding='utf-8')
          appcode=appcode.replace('"./importador.js?v=16.33.130"','"./importador-16.33.145.js"')
          old_apply='''function aplicarImportacionPagosSolo(obj){
  // IMPORTACIÓN DESDE LA PESTAÑA PAGOS:
  // aquí SOLO se incorporan pagos. Nunca se deben crear/modificar
  // vencimientos de DATOS Y VENCIMIENTOS.
  if(obj.pagos?.length)pagos=[...pagos,...obj.pagos];
  renderPagos();'''
          new_apply='''function aplicarImportacionPagosSolo(obj){
  // IMPORTACIÓN DESDE LA PESTAÑA PAGOS:
  // aquí SOLO se incorporan pagos. Nunca se deben crear/modificar
  // vencimientos de DATOS Y VENCIMIENTOS.
  // Regla v16.33.145: cualquier decimal recibido por importación se trunca
  // hacia cero. Nunca se redondea por exceso ni por defecto.
  if(obj.pagos?.length){
    const normalizados=obj.pagos.map(p=>({...p,valor:truncarValorEntero(p.valor)}));
    pagos=[...pagos,...normalizados];
  }
  renderPagos();'''
          if old_apply not in appcode:
            raise SystemExit('No se encontró aplicarImportacionPagosSolo() esperado en app.js')
          appcode=appcode.replace(old_apply,new_apply,1)
          app145.write_text(appcode,encoding='utf-8')

          # ------------------------------------------------------------
          # 3) TDJ core v145: misma lógica de pagos, con importador físico
          #    v145 para evitar caché del módulo anterior.
          # ------------------------------------------------------------
          core=Path('js/tdj-core-16.33.143.js')
          core145=Path('js/tdj-core-16.33.145.js')
          corecode=core.read_text(encoding='utf-8')
          corecode=corecode.replace('./importador.js?v=16.33.136','./importador-16.33.145.js')
          corecode=corecode.replace('./tdj-importador.js?v=16.33.136','./tdj-importador-16.33.145.js')
          core145.write_text(corecode,encoding='utf-8')

          # ------------------------------------------------------------
          # 4) TDJ importer v145: punto decimal/coma decimal + truncamiento.
          #    Corrige específicamente 1234.56, que la versión anterior podía
          #    interpretar como 123456 al quitar todos los puntos.
          # ------------------------------------------------------------
          tdi=Path('js/tdj-importador.js')
          tdi145=Path('js/tdj-importador-16.33.145.js')
          tdicode=tdi.read_text(encoding='utf-8')
          old_val='''function normalizarValorTDJ(v) {
  const s = String(v ?? "").trim();
  if (!s) return 0;
  const limpio = s.replace(/\\$/g, "").replace(/\\s/g, "");
  if (/^\\d{1,3}(?:\\.\\d{3})+$/.test(limpio)) return Number(limpio.replace(/\\./g, ""));
  if (/^\\d{1,3}(?:,\\d{3})+$/.test(limpio)) return Number(limpio.replace(/,/g, ""));
  if (/^\\d+$/.test(limpio)) return Number(limpio);
  const n = Number(limpio.replace(/\\./g, "").replace(",", "."));
  return Number.isFinite(n) ? Math.trunc(n) : 0;
}'''
          new_val='''function normalizarValorTDJ(v) {
  const s=String(v??"").trim();
  if(!s)return 0;
  let limpio=s.replace(/\\$/g,"").replace(/\\s/g,"");
  // Miles con punto: 1.234.567
  if(/^[-+]?\\d{1,3}(?:\\.\\d{3})+$/.test(limpio))return Math.trunc(Number(limpio.replace(/\\./g,""))||0);
  // Miles con coma: 1,234,567
  if(/^[-+]?\\d{1,3}(?:,\\d{3})+$/.test(limpio))return Math.trunc(Number(limpio.replace(/,/g,""))||0);
  // Ambos separadores: 1.234.567,89 / 1,234,567.89
  if(limpio.includes(".")&&limpio.includes(",")){
    if(/^[-+]?\\d{1,3}(?:\\.\\d{3})+,\\d+$/.test(limpio))limpio=limpio.replace(/\\./g,"").replace(",",".");
    else if(/^[-+]?\\d{1,3}(?:,\\d{3})+\\.\\d+$/.test(limpio))limpio=limpio.replace(/,/g,"");
    else limpio=limpio.replace(/,/g,".");
    const n=Number(limpio);return Number.isFinite(n)?Math.trunc(n):0;
  }
  // Un solo separador seguido de 1-2 dígitos = decimal.
  if(/^[-+]?\\d+[\\.,]\\d{1,2}$/.test(limpio)){
    const n=Number(limpio.replace(",","."));return Number.isFinite(n)?Math.trunc(n):0;
  }
  const n=Number(limpio.replace(/,/g,"."));
  return Number.isFinite(n)?Math.trunc(n):0;
}'''
          if old_val not in tdicode:
            raise SystemExit('No se encontró normalizarValorTDJ() esperado')
          tdicode=tdicode.replace(old_val,new_val,1)
          tdi145.write_text(tdicode,encoding='utf-8')

          # ------------------------------------------------------------
          # 5) TDJ loader físico v145: mantiene el blindaje de LIMPIAR global
          #    y carga el core v145.
          # ------------------------------------------------------------
          loader=Path('js/tdj-16.33.145.js')
          loader.write_text('''// TDJ v16.33.145 — importadores con normalización de decimales.
(function(){
  document.addEventListener("click",function(e){
    var b=e.target&&e.target.closest?e.target.closest("#btnLimpiarTitulosGlobal"):null;
    if(!b)return;
    e.preventDefault();e.stopImmediatePropagation();
    if(!window.confirm("¿Desea iniciar una nueva liquidación de títulos? Se borrarán datos, pagos, títulos y resultados."))return;
    window.location.replace("titulos.html?v=16.33.145&reinicio="+Date.now());
  },true);
})();
import("./tdj-core-16.33.145.js");
''',encoding='utf-8')

          # ------------------------------------------------------------
          # 6) HTML DIAN: carga física de app v145.
          # ------------------------------------------------------------
          lh=Path('liquidacion.html')
          h=lh.read_text(encoding='utf-8')
          h=h.replace('js/app.js?v=16.33.132','js/app-16.33.145.js')
          h=re.sub(r'Liquidador — versión 16\.33\.[0-9]+,', 'Liquidador — versión 16.33.145,', h)
          lh.write_text(h,encoding='utf-8')

          # ------------------------------------------------------------
          # 7) HTML TDJ: carga física v145 y guard actualizado.
          # ------------------------------------------------------------
          th=Path('titulos.html')
          t=th.read_text(encoding='utf-8')
          t=t.replace('TDJ UI DEPLOY 16.33.143','TDJ UI DEPLOY 16.33.145')
          t=t.replace('v!=="16.33.143"','v!=="16.33.145"')
          t=t.replace('u.searchParams.set("v","16.33.143")','u.searchParams.set("v","16.33.145")')
          t=t.replace('titulos.html?v=16.33.143&reinicio=','titulos.html?v=16.33.145&reinicio=')
          t=t.replace('js/tdj.js?v=16.33.143','js/tdj-16.33.145.js')
          th.write_text(t,encoding='utf-8')

          # ------------------------------------------------------------
          # 8) Regresión automatizada.
          # ------------------------------------------------------------
          test=Path('tests/regresion-importadores-decimales-145.mjs')
          test.parent.mkdir(parents=True,exist_ok=True)
          test.write_text('''import fs from "node:fs";
import assert from "node:assert/strict";

const imp=fs.readFileSync("js/importador-16.33.145.js","utf8");
const app=fs.readFileSync("js/app-16.33.145.js","utf8");
const tdi=fs.readFileSync("js/tdj-importador-16.33.145.js","utf8");
const core=fs.readFileSync("js/tdj-core-16.33.145.js","utf8");
const lh=fs.readFileSync("liquidacion.html","utf8");
const th=fs.readFileSync("titulos.html","utf8");

assert.ok(imp.includes("columnasEsperadas=0,indiceValor=-1"));
assert.ok(imp.includes("separarFilaPagos(lines[r],headers.length,ix.valor)"));
assert.ok(app.includes("valor:truncarValorEntero(p.valor)"));
assert.ok(app.includes("./importador-16.33.145.js"));
assert.ok(tdi.includes("Un solo separador seguido de 1-2 dígitos = decimal."));
assert.ok(core.includes("./importador-16.33.145.js"));
assert.ok(core.includes("./tdj-importador-16.33.145.js"));
assert.ok(lh.includes("js/app-16.33.145.js"));
assert.ok(th.includes("js/tdj-16.33.145.js"));

console.log("OK: estructura de importadores v16.33.145");
''',encoding='utf-8')

          # Validación local del código antes de publicar.
          if not shutil.which('node'):
            raise SystemExit('Node no disponible en runner')

          # Evitar que la primera ejecución vuelva a generar commits infinitos.
          # Solo se publica si al menos uno de los artefactos v145 cambió.
          if git diff --quiet -- js/importador-16.33.145.js js/app-16.33.145.js js/tdj-core-16.33.145.js js/tdj-importador-16.33.145.js js/tdj-16.33.145.js liquidacion.html titulos.html tests/regresion-importadores-decimales-145.mjs; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/importador-16.33.145.js js/app-16.33.145.js js/tdj-core-16.33.145.js js/tdj-importador-16.33.145.js js/tdj-16.33.145.js liquidacion.html titulos.html tests/regresion-importadores-decimales-145.mjs
          git commit -m 'fix: normalizar decimales en importadores DIAN y TDJ v16.33.145'
          git pull --rebase origin main
          git push

      - name: Auditoría y pruebas v16.33.145
        run: |
          node --check js/importador-16.33.145.js
          node --check js/app-16.33.145.js
          node --check js/tdj-core-16.33.145.js
          node --check js/tdj-importador-16.33.145.js
          node --check js/tdj-16.33.145.js
          node tests/regresion-importadores-decimales-145.mjs
          node - <<'NODE'
          function trunc(n){return Math.trunc(n)}
          const casos=[1234.56,1234.99,1234,0.99,1000000.01];
          const esperados=[1234,1234,1234,0,1000000];
          casos.forEach((n,i)=>{if(trunc(n)!==esperados[i])throw new Error(`Falla truncamiento ${n}`);});
          console.log('OK: casos matemáticos de truncamiento sin redondeo');
          NODE
