name: Correctivo TDJ v16.33.202

on: push

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir salida prematura y publicar v202
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          core=Path('js/tdj-core-16.33.143.js')
          s=core.read_text(encoding='utf-8')
          old='if(saldoObligacionActual>0.5 && !obligacionCubiertaPorPagosProtegidos)return;'
          new='if(saldoObligacionActual>0.5 && !obligacionCubiertaPorPagosProtegidos)break;'
          if old not in s:
              raise SystemExit('SALIDA PREMATURA TDJ 202 NO ENCONTRADA')
          core.write_text(s.replace(old,new,1),encoding='utf-8')

          tdj=Path('js/tdj.js')
          ts=tdj.read_text(encoding='utf-8')
          ts=ts.replace('TDJ v16.33.201','TDJ v16.33.202',1)
          ts=ts.replace('16.33.201','16.33.202')
          tdj.write_text(ts,encoding='utf-8')

          ctx=Path('js/tdj-obligacion-contexto-16.33.197.js')
          cs=ctx.read_text(encoding='utf-8').replace('TDJ v16.33.201','TDJ v16.33.202',1)
          ctx.write_text(cs,encoding='utf-8')

          html=Path('titulos.html')
          hs=html.read_text(encoding='utf-8').replace('16.33.201','16.33.202')
          html.write_text(hs,encoding='utf-8')

          test=Path('tests/regresion-endoso-tdj-202.mjs')
          test.write_text('''import fs from "node:fs";\nimport assert from "node:assert/strict";\nconst core=fs.readFileSync("js/tdj-core-16.33.143.js","utf8");\nconst tdj=fs.readFileSync("js/tdj.js","utf8");\nassert.match(core,/saldoObligacionActual/);\nassert.match(core,/obligacionCubiertaPorPagosProtegidos/);\nassert.match(core,/if\\(saldoObligacionActual>0\\.5 && !obligacionCubiertaPorPagosProtegidos\\)break/);\nassert.doesNotMatch(core,/obligacionCubiertaPorPagosProtegidos\\)return/);\nassert.match(tdj,/v16\\.33\\.202/);\nconsole.log("REGRESION TDJ 202 OK");\n''',encoding='utf-8')
          subprocess.run(['node','--check','js/tdj-core-16.33.143.js'],check=True)
          subprocess.run(['node','--check','js/tdj.js'],check=True)
          subprocess.run(['node','tests/regresion-endoso-tdj-202.mjs'],check=True)
          PY
      - name: Publicar corrección y retirar workflow temporal
        run: |
          rm -f .github/workflows/correctivo-tdj-202.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/tdj-core-16.33.143.js js/tdj.js js/tdj-obligacion-contexto-16.33.197.js titulos.html tests/regresion-endoso-tdj-202.mjs .github/workflows/correctivo-tdj-202.yml
          git commit -m 'fix: continuar secuencia TDJ sin abortar liquidacion v16.33.202'
          git push
