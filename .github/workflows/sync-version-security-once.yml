name: Sync security version once

on:
  push:
    branches: ["security-hardening-16.33.113"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Alinear referencias 16.33.112 a 16.33.113
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.yml' -o -name '*.yaml' \) -not -path './.git/*' -print0 | xargs -0 sed -i 's/16\.33\.112/16.33.113/g'
          rm -f .github/workflows/sync-version-security-once.yml

      - name: Guardar alineación y eliminar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: align security release to 16.33.113'
          git push
