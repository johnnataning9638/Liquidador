name: One-shot PDF endoso 16.33.115

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Corregir PDF DIAN y alinear versión
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('js/app.js')
          s = app.read_text(encoding='utf-8')

          old_cond = 'Number(x.excedente||x.aplicado?.excedente||0)>0?`<div class="pdf-excedente"><b>${(x.pago?.esTDJ===true||String(x.pago?.tdj||"").trim()!=="")?"EXCEDENTE DE TÍTULO":"EXCEDENTE"}:</b> ${dinero((x.pago?.esTDJ===true||String(x.pago?.tdj||"").trim()!=="")?excedenteTituloPdf(x,i,d,r):(x.excedente??x.aplicado.excedente))}</div>`:""}'
          new_cond = 'Math.max(Number(x.excedente||x.aplicado?.excedente||0),excedenteTituloPdf(x,i,d,r))>0?`<div class="pdf-excedente"><b>${(x.pago?.esTDJ===true||String(x.pago?.tdj||"").trim()!=="")?"EXCEDENTE DE TÍTULO":"EXCEDENTE"}:</b> ${dinero((x.pago?.esTDJ===true||String(x.pago?.tdj||"").trim()!=="")?excedenteTituloPdf(x,i,d,r):(x.excedente??x.aplicado.excedente))}</div>`:""}'
          if old_cond not in s:
              raise SystemExit('ERROR: condición de excedente PDF no encontrada')
          s = s.replace(old_cond, new_cond, 1)

          css_anchor = '  .pdf-excedentes-finales{margin:2mm;border:1px solid #c58a1a;'
          if css_anchor not in s:
              raise SystemExit('ERROR: ancla CSS de excedentes no encontrada')
          css_block = '''  .pdf-bloque{margin:2mm;border:1px solid #c58a1a;background:#fffdf7;break-inside:avoid;page-break-inside:avoid}\n  .pdf-bloque h2{margin:0;padding:1.5mm 2mm;background:#fff6d8;color:#7a5200;font-size:11pt;border-bottom:1px solid #c58a1a}\n  .pdf-bloque table{width:100%;border-collapse:collapse;table-layout:fixed}\n  .pdf-bloque th,.pdf-bloque td{border:1px solid #c9a45a;padding:1.25mm;font-size:8.5pt;line-height:1.05;text-align:right;white-space:nowrap}\n  .pdf-bloque th:first-child,.pdf-bloque td:first-child{text-align:center}\n  .pdf-bloque thead th{background:#fff9e8;font-size:8pt}\n  .pdf-bloque tfoot th{background:#fff0c2;font-weight:700}\n'''
          s = s.replace(css_anchor, css_block + css_anchor, 1)
          app.write_text(s, encoding='utf-8')

          # Alinear referencias activas de versión sin tocar la lógica matemática.
          old='16.33.114'
          new='16.33.115'
          exts={'.js','.html','.css','.json','.yml','.yaml'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in exts:
                  continue
              if p.as_posix()=='supabase/migrations/20261006_security_hardening_16_33_113.sql':
                  continue
              text=p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old,new),encoding='utf-8')

          # El motor base solo puede cambiar aquí por cache-buster/referencia de versión.
          base=Path('js/motor-liquidacion-base.js')
          if '16.33.114' in base.read_text(encoding='utf-8'):
              raise SystemExit('ERROR: quedó versión 16.33.114 en motor base')

          print('PATCH PDF DIAN + VERSION 16.33.115 OK')
          PY

      - name: Validar sintaxis JavaScript
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Ejecutar regresión matemática
        run: node --experimental-default-type=module tests/regresion-matematica.mjs

      - name: Ejecutar regresión PDF/UI
        run: node tests/regresion-ui.mjs

      - name: Validar reglas PDF nuevas
        run: |
          set -e
          grep -q 'Math.max(Number(x.excedente||x.aplicado?.excedente||0),excedenteTituloPdf(x,i,d,r))>0' js/app.js
          grep -q 'function valorNominalPagoPdf(x,d)' js/app.js
          grep -q 'EXCEDENTE DE TÍTULO' js/app.js
          grep -q 'pdf-bloque' js/app.js
          grep -q '16.33.115' tests/regresion-ui.mjs
          echo 'REGRESIÓN VALOR NOMINAL + EXCEDENTE DIAN OK'

      - name: Validar alineación global
        run: |
          set -e
          if grep -R -n --exclude-dir=.git --exclude='*.md' --exclude='20261006_security_hardening_16_33_113.sql' -E '16\.33\.(110|111|112|113|114)' .; then
            echo 'ERROR: se detectó una referencia activa anterior a 16.33.115.'
            exit 1
          fi
          grep -q 'motor-liquidacion-base.js?v=16.33.115' js/motor-liquidacion.js
          grep -q 'actions/checkout@v6' .github/workflows/audit-estabilidad.yml
          echo 'VERSIONES ACTIVAS ALINEADAS 16.33.115'

      - name: Verificar protección SIMPLE/TRADICIONAL
        run: |
          set -e
          grep -q 'const esSimplePorAnticipos=cantidadCuotas>=4 && cantidadCuotas<=6;' js/motor-liquidacion-base.js
          grep -q 'pago.fecha>=fechaSancionReal' js/motor-liquidacion-base.js
          echo 'SIMPLE 4-6 / TRADICIONAL 1-3 INTACTO'

      - name: Retirar workflow temporal y publicar
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-pdf-endoso-115.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached -- js/app.js tests/regresion-ui.mjs .github/workflows/audit-estabilidad.yml | sed -n '1,260p'
          git commit -m 'fix: cuadro de excedente de titulos en PDF DIAN v16.33.115'
          git push origin main
