name: Hotfix limpieza global TDJ v16.33.144

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  harden-clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar hotfix de ruta/versionado y captura global
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('js/tdj.js')
          versioned = Path('js/tdj-16.33.144.js')
          html_path = Path('titulos.html')
          release = Path('RELEASES/16.33.144.md')
          test = Path('tests/regresion-limpiar-global-tdj-144.mjs')

          code = src.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')

          # La causa observada es compatible con caché/CDN por ruta: cambiar solo ?v=
          # no garantiza que /js/tdj.js deje de entregar el recurso antiguo. Se crea
          # una ruta física nueva para el módulo TDJ y se referencia directamente.
          versioned.write_text(code, encoding='utf-8')

          html = re.sub(r'js/tdj\.js\?v=[0-9.]+', 'js/tdj-16.33.144.js', html)
          html = html.replace('TDJ UI DEPLOY 16.33.143', 'TDJ UI DEPLOY 16.33.144')
          html = re.sub(r'(Liquidador — módulo de Liquidación de Títulos / TDJ · v)16\.33\.[0-9]+', r'\g<1>16.33.144', html)
          html = html.replace('u.searchParams.set("v","16.33.143")', 'u.searchParams.set("v","16.33.144")')
          html = html.replace('v!=="16.33.143"', 'v!=="16.33.144"')
          html = html.replace('titulos.html?v=16.33.143&reinicio=', 'titulos.html?v=16.33.144&reinicio=')
          html = html.replace('tdj-global-clear-143', 'tdj-global-clear-144')

          # Blindaje definitivo: el propio documento captura el clic antes de cualquier
          # listener antiguo del módulo cacheado y fuerza una nueva liquidación global.
          hard_guard = '''<script id="tdj-global-clear-144-hard">
          (function(){
            document.addEventListener("click",function(e){
              var b=e.target && e.target.closest ? e.target.closest("#btnLimpiarTitulosGlobal") : null;
              if(!b)return;
              e.preventDefault();
              e.stopImmediatePropagation();
              if(!window.confirm("¿Desea iniciar una nueva liquidación de títulos? Se borrarán datos, pagos, títulos y resultados."))return;
              window.location.replace("titulos.html?v=16.33.144&reinicio="+Date.now());
            },true);
          })();
          </script>
          '''
          html = re.sub(r'\n<script id="tdj-global-clear-144-hard">.*?</script>\n', '\n', html, flags=re.S)
          html = html.replace('</head>', hard_guard + '</head>', 1)

          # La versión 144 conserva el listener DOM anterior como respaldo, pero la
          # captura en document es la primera barrera y no depende de tdj.js.
          html_path.write_text(html, encoding='utf-8')

          release.parent.mkdir(parents=True, exist_ok=True)
          release.write_text('''# RELEASE 16.33.144 — LIMPIAR GLOBAL TDJ\n\n## Corrección\n\n- Se identificó que el versionado mediante `?v=` podía seguir entregando el módulo `js/tdj.js` cacheado por ruta.\n- Se creó una ruta física versionada: `js/tdj-16.33.144.js`.\n- TÍTULOS/TJ `LIMPIAR` queda interceptado en fase de captura por el documento, antes de listeners antiguos o cacheados.\n- La acción inicia una nueva liquidación y elimina Datos/vencimientos, Pagos, Títulos/TDJ y Resultados.\n- Se conserva intacta la lógica de cálculo, proporcionalidad, intereses, sanciones, cursor y endoso.\n\n## Validación\n\n- Sintaxis Node de `js/tdj.js` y `js/tdj-16.33.144.js`.\n- Verificación estructural del botón, ruta física versionada y captura global.\n- Verificación de ausencia del mensaje antiguo de limpieza exclusiva de títulos.\n''', encoding='utf-8')

          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''import fs from "node:fs";\nimport assert from "node:assert/strict";\n\nconst html=fs.readFileSync("titulos.html","utf8");\nconst tdj=fs.readFileSync("js/tdj-16.33.144.js","utf8");\n\nassert.ok(html.includes('id="btnLimpiarTitulosGlobal"'), "Falta el botón global de Títulos");\nassert.ok(html.includes('js/tdj-16.33.144.js'), "No se usa la ruta física versionada");\nassert.ok(html.includes('id="tdj-global-clear-144-hard"'), "Falta la captura global endurecida");\nassert.ok(html.includes("Se borrarán datos, pagos, títulos y resultados."), "Falta confirmación global");\nassert.ok(!html.includes("¿Desea limpiar únicamente los títulos / TDJ registrados?"), "Persistió el mensaje antiguo");\nassert.ok(!tdj.includes("¿Desea limpiar únicamente los títulos / TDJ registrados?"), "El módulo versionado contiene el mensaje antiguo");\nassert.ok(html.includes('window.location.replace("titulos.html?v=16.33.144&reinicio="+Date.now())'), "No se fuerza nueva liquidación");\nconsole.log("OK: regresión LIMPIAR GLOBAL TDJ v16.33.144");\n''', encoding='utf-8')

          if ! git diff --quiet -- js/tdj-16.33.144.js titulos.html RELEASES/16.33.144.md tests/regresion-limpiar-global-tdj-144.mjs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add js/tdj-16.33.144.js titulos.html RELEASES/16.33.144.md tests/regresion-limpiar-global-tdj-144.mjs
            git commit -m 'fix: corregir LIMPIAR global TDJ con ruta versionada v16.33.144'
            git pull --rebase origin main
            git push
          fi

      - name: Auditoría y regresión v16.33.144
        run: |
          node --check js/tdj.js
          node --check js/tdj-16.33.144.js
          node tests/regresion-limpiar-global-tdj-144.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('titulos.html','utf8');
          if((h.match(/id="btnLimpiarTitulosGlobal"/g)||[]).length!==1) throw new Error('El botón global no es único');
          if(!h.includes('js/tdj-16.33.144.js')) throw new Error('Ruta física v144 no referenciada');
          if(h.includes('js/tdj.js?v=16.33.143')) throw new Error('Quedó referencia antigua al módulo TDJ');
          if(h.includes('¿Desea limpiar únicamente los títulos / TDJ registrados?')) throw new Error('Quedó mensaje antiguo');
          console.log('OK: auditoría estructural TDJ v16.33.144');
          NODE
