name: Fix PDF syntax temporary
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Guard
        run: test -f .github/pdf-syntax.trigger
      - name: Correct function boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/app.js'); s=p.read_text()
          s=s.replace('function valorNominalPagoPdffunction valorNominalPagoPdffunction valorNominalPagoPdf','function valorNominalPagoPdf')
          s=s.replace('function valorNominalPagoPdffunction valorNominalPagoPdf','function valorNominalPagoPdf')
          p.write_text(s)
          p=Path('js/tdj.js'); s=p.read_text()
          s=s.replace('function bloqueSuspensionInteresesPdfTDJfunction bloqueSuspensionInteresesPdfTDJ','function bloqueSuspensionInteresesPdfTDJ')
          p.write_text(s)
          PY
          node --check js/app.js
          node --check js/tdj.js
      - name: Publish corrected files
        uses: actions/github-script@v7
        env:
          REPO: ${{ github.repository }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs'); const [owner,repo]=process.env.REPO.split('/');
            for(const file of ['js/app.js','js/tdj.js']){
              const current=await github.rest.repos.getContent({owner,repo,path:file,ref:'main'});
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path:file,message:`fix: corregir límite de función PDF ${file} v16.33.119`,content:fs.readFileSync(file).toString('base64'),sha:current.data.sha,branch:'main'});
            }
