name: Inspect PDF interest blocks
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Guardar ejecución temporal
        shell: bash
        run: |
          set -e
          if [ ! -f .github/corte-119.trigger ]; then
            echo 'SIN MARCADOR DE CORRECCIÓN. FIN.'
            exit 0
          fi
          rm -f .github/corte-119.trigger
      - name: Apply correction in working tree
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          app=Path('js/app.js'); tdj=Path('js/tdj.js')
          a=app.read_text(); t=tdj.read_text()
          old=re.search(r'function tablaInteresesPdf\(x,r\)\{.*?\n\}\s*function valorNominalPagoPdf',a,re.S)
          if not old: raise SystemExit('No se encontró tablaInteresesPdf')
          new='''function tablaInteresesPdf(x,r){
            const detallePago=Array.isArray(x?.interesesPorCuota)?x.interesesPorCuota:[];
            const detalleCorte=Array.isArray(r?.interesesPorCuota)?r.interesesPorCuota:[];
            const p=x?.pago||{};
            const esCorteInformativo=Number(p.valor||0)===0 && Boolean(fechaISO(p.fecha)) && !String(p.recibo||"").trim() && !String(p.tdj||"").trim();
            const filas=detallePago.length?detallePago:(esCorteInformativo?detalleCorte:[]);
            let rows="";
            if(filas.length){
              rows=filas.map((t,i)=>{
                const vtoRef=(r?.vencimientos||[]).find(v=>v?.id===t?.vto)||null;
                const cuota=t?.cuota??t?.vto??vtoRef?.numero??(i+1);
                const capital=Number(t?.capitalBase||t?.base||vtoRef?.saldo||vtoRef?.impuesto||0);
                const fechaVto=t?.fechaVencimiento||vtoRef?.fecha||"";
                const fechaPago=t?.fechaPago||p.fecha||(esCorteInformativo?r?.fechaCorte||"":"");
                const dias=Number(t?.dias||0);
                const tasa=t?.tasa!=null?((Number(t.tasa)*100).toFixed(3)+"%"):(x?.tasaVisible!=null?Number(x.tasaVisible).toFixed(3)+"%":"—");
                const interes=Number(t?.interes??t?.valor??0);
                return `<tr><td>${escPdf(cuota)}</td><td>${dinero(capital)}</td><td>${escPdf(fechaVisible(fechaVto))}</td><td>${escPdf(fechaVisible(fechaPago))}</td><td>${dias}</td><td>${tasa}</td><td>${dinero(interes)}</td></tr>`;
              }).join("");
            }else{
              rows=(r?.vencimientos||[]).map(v=>`<tr><td>${escPdf(v?.numero||"")}</td><td>${dinero(0)}</td><td>${escPdf(fechaVisible(v?.fecha||""))}</td><td>${escPdf(fechaVisible(p.fecha||""))}</td><td>0</td><td>${x?.tasaVisible==null?"—":Number(x.tasaVisible).toFixed(3)+"%"}</td><td>${dinero(0)}</td></tr>`).join("");
            }
            const total=filas.length?filas.reduce((s,t)=>s+Number(t?.interes??t?.valor??0),0):(esCorteInformativo?Number(r?.intereses||0):Number(x?.interesGenerado||0));
            return `<div class="pdf-intereses"><h3>CÁLCULO DE INTERESES POR CUOTA</h3><table><thead><tr><th>CUOTA</th><th>CAPITAL BASE</th><th>FECHA VENCIMIENTO</th><th>FECHA PAGO</th><th>DÍAS</th><th>TASA</th><th>INTERÉS</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="6">TOTAL INTERESES DEL PAGO</th><th>${dinero(total)}</th></tr></tfoot></table></div>`;
          }

          function valorNominalPagoPdf'''
          a=a[:old.start()]+new+a[old.end()-len('function valorNominalPagoPdf'):]
          old=re.search(r'function tablaInteresesPdfTDJ\(x,r\)\{.*?\n\}\s*function bloqueSuspensionInteresesPdfTDJ',t,re.S)
          if not old: raise SystemExit('No se encontró tablaInteresesPdfTDJ')
          new='''function tablaInteresesPdfTDJ(x,r){
            const detallePago=Array.isArray(x?.interesesPorCuota)?x.interesesPorCuota:[];
            const detalleCorte=Array.isArray(r?.interesesPorCuota)?r.interesesPorCuota:[];
            const p=x?.pago||{};
            const esCorteInformativo=Number(p.valor||0)===0 && Boolean(fechaISO(p.fecha)) && !String(p.recibo||"").trim() && !String(p.tdj||"").trim();
            const filas=detallePago.length?detallePago:(esCorteInformativo?detalleCorte:[]);
            let rows="";
            if(filas.length){
              rows=filas.map((t,i)=>{
                const vtoRef=(r?.vencimientos||[]).find(v=>v?.id===t?.vto)||null;
                const cuota=t?.cuota??t?.vto??vtoRef?.numero??(i+1);
                const capital=Number(t?.capitalBase||t?.base||vtoRef?.saldo||vtoRef?.impuesto||0);
                const fechaVto=t?.fechaVencimiento||vtoRef?.fecha||"";
                const fechaPago=t?.fechaPago||p.fecha||(esCorteInformativo?r?.fechaCorte||"":"");
                const dias=Number(t?.dias||0);
                const tasa=t?.tasa!=null?((Number(t.tasa)*100).toFixed(3)+"%"):(x?.tasaVisible!=null?Number(x.tasaVisible).toFixed(3)+"%":"—");
                const interes=Number(t?.interes??t?.valor??0);
                return `<tr><td>${escPdf(cuota)}</td><td>${dinero(capital)}</td><td>${escPdf(fechaVisible(fechaVto))}</td><td>${escPdf(fechaVisible(fechaPago))}</td><td>${dias}</td><td>${tasa}</td><td>${dinero(interes)}</td></tr>`;
              }).join("");
            }else{
              rows=(r?.vencimientos||[]).map(v=>`<tr><td>${escPdf(v?.numero||"")}</td><td>${dinero(0)}</td><td>${escPdf(fechaVisible(v?.fecha||""))}</td><td>${escPdf(fechaVisible(p.fecha||""))}</td><td>0</td><td>${x?.tasaVisible==null?"—":Number(x.tasaVisible).toFixed(3)+"%"}</td><td>${dinero(0)}</td></tr>`).join("");
            }
            const total=filas.length?filas.reduce((s,t)=>s+Number(t?.interes??t?.valor??0),0):(esCorteInformativo?Number(r?.intereses||0):Number(x?.interesGenerado||0));
            return `<div class="pdf-intereses"><h3>CÁLCULO DE INTERESES POR CUOTA</h3><table><thead><tr><th>CUOTA</th><th>CAPITAL BASE</th><th>FECHA VENCIMIENTO</th><th>FECHA PAGO / TDJ</th><th>DÍAS</th><th>TASA</th><th>INTERÉS</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="6">TOTAL INTERESES DEL PAGO</th><th>${dinero(total)}</th></tr></tfoot></table></div>`;
          }

          function bloqueSuspensionInteresesPdfTDJ'''
          t=t[:old.start()]+new+t[old.end()-len('function bloqueSuspensionInteresesPdfTDJ'):]
          app.write_text(a.replace('16.33.118','16.33.119'))
          tdj.write_text(t.replace('16.33.118','16.33.119'))
          roots=[Path('js'),Path('tests'),Path('index.html'),Path('liquidacion.html'),Path('titulos.html'),Path('estilos.css'),Path('.github/workflows/audit-estabilidad.yml')]
          for root in roots:
            files=[root] if root.is_file() else list(root.rglob('*'))
            for f in files:
              if f.is_file() and f.suffix in {'.js','.mjs','.html','.css','.yml'}:
                s=f.read_text()
                if '16.33.118' in s: f.write_text(s.replace('16.33.118','16.33.119'))
          Path('RELEASES/16.33.119.md').write_text('# 16.33.119\n\n- CORRIGE EL BLOQUE PDF CÁLCULO DE INTERESES POR CUOTA PARA FECHAS DE CORTE INFORMATIVAS CON VALOR DE PAGO $0.\n- MUESTRA CUOTA, CAPITAL BASE, VENCIMIENTO, FECHA DE CORTE, DÍAS, TASA E INTERÉS CALCULADO.\n- APLICA EN DIAN/RIAN Y TDJ.\n- NO MODIFICA LA FÓRMULA MATEMÁTICA DEL MOTOR.\n')
          Path('tests/regresion-detalle-intereses-corte.mjs').write_text('''import fs from "node:fs";\nimport assert from "node:assert/strict";\nconst app=fs.readFileSync("js/app.js","utf8");\nconst tdj=fs.readFileSync("js/tdj.js","utf8");\nfor(const [name,src] of [["app.js",app],["tdj.js",tdj]]){\n  assert.match(src,/detalleCorte=Array\\.isArray\\(r\\?\\.interesesPorCuota\\)\\?r\\.interesesPorCuota:\[\]/,`${name}: fallback de corte ausente`);\n  assert.match(src,/esCorteInformativo=Number\\(p\\.valor\\|\\|0\\)===0/,`${name}: detección de corte ausente`);\n  assert.match(src,/capitalBase\\|\\|t\\?\\.base\\|\\|vtoRef\\?\\.saldo\\|\\|vtoRef\\?\.impuesto/,`${name}: capital base de corte ausente`);\n}\nconsole.log("REGRESIÓN DETALLE INTERESES FECHA DE CORTE: OK");\n''')
          PY
          node --check js/app.js
          node --check js/tdj.js
          node tests/regresion-detalle-intereses-corte.mjs
          git diff --name-only > /tmp/changed-files.txt
      - name: Publish changed files through Contents API
        uses: actions/github-script@v7
        env:
          REPO: ${{ github.repository }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const [owner,repo]=process.env.REPO.split('/');
            const changed=fs.readFileSync('/tmp/changed-files.txt','utf8').split('\n').map(x=>x.trim()).filter(Boolean).filter(x=>!['.github/workflows/inspect-pdf-interest.yml','.github/corte-119.trigger','.github/workflows/audit-estabilidad.yml'].includes(x));
            for(const file of changed){
              const content=fs.readFileSync(file);
              let sha;
              try{
                const current=await github.rest.repos.getContent({owner,repo,path:file,ref:'main'});
                if(!Array.isArray(current.data)) sha=current.data.sha;
              }catch(e){ if(e.status!==404) throw e; }
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path:file,message:`fix: sincronizar ${file} a 16.33.119`,content:content.toString('base64'),sha,branch:'main'});
              core.info(`Publicado ${file}`);
            }
            core.info('Archivos funcionales publicados.');
