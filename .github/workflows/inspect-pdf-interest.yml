name: Inspect PDF interest blocks
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Locate PDF interest rendering
        shell: bash
        run: |
          set -e
          echo '===== APP 1268-1300 ====='
          sed -n '1268,1300p' js/app.js
          echo '===== APP CUTOFF 1448-1500 ====='
          sed -n '1448,1500p' js/app.js
          echo '===== TDJ 1818-1845 ====='
          sed -n '1818,1845p' js/tdj.js
          echo '===== TDJ CUTOFF 1690-1712 ====='
          sed -n '1690,1712p' js/tdj.js
