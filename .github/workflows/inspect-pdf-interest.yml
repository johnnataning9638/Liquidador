name: Inspect PDF interest blocks
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare source artifact
        run: |
          mkdir -p inspect-source
          cp js/app.js js/tdj.js inspect-source/
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: inspect-source
          path: inspect-source/
