name: Aplicar corrección fecha de corte TDJ v16.33.121

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Aplicar corrección TDJ
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          tdj=root/'js/tdj.js'
          s=tdj.read_text(encoding='utf-8')
          old='o.pagos=o.pagos.filter(p=>p.fecha&&Number(p.valor)>0).map(p=>({...p,fecha:fechaISO(p.fecha),valor:truncarValorEntero(p.valor)}));'
          new='o.pagos=o.pagos.filter(p=>p.fecha&&(Number(p.valor)>0||esFechaCorteTDJ(p))).map(p=>({...p,fecha:fechaISO(p.fecha),valor:truncarValorEntero(p.valor||0)}));'
          if old not in s:
              raise SystemExit('No se encontró el filtro de pagos TDJ que elimina la fecha de corte.')
          s=s.replace(old,new,1)
          old='const totalCorte=Math.max(0,Number(r?.intereses||0));'
          new='const totalCorte=Math.max(0,Number(r?.intereses||x?.interesLiquidado||x?.interesGenerado||0));'
          if old not in s:
              raise SystemExit('No se encontró el fallback de interés de corte TDJ.')
          s=s.replace(old,new,1)
          old='(esCorteInformativo?Number(r?.intereses||0):Number(x?.interesGenerado||0))'
          new='(esCorteInformativo?Number(r?.intereses||x?.interesLiquidado||x?.interesGenerado||0):Number(x?.interesGenerado||0))'
          if old not in s:
              raise SystemExit('No se encontró el total de intereses de corte TDJ.')
          s=s.replace(old,new,1)
          tdj.write_text(s,encoding='utf-8')

          for p in root.rglob('*'):
              if not p.is_file() or any(x in p.parts for x in {'.git','RELEASES','node_modules'}):
                  continue
              if p.suffix.lower() not in {'.js','.html','.css','.yml','.yaml','.json','.mjs'}:
                  continue
              try: text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if '16.33.120' in text:
                  p.write_text(text.replace('16.33.120','16.33.121'),encoding='utf-8')

          audit=root/'.github/workflows/audit-estabilidad.yml'
          a=audit.read_text(encoding='utf-8')
          a=a.replace('16.33.120','16.33.121')
          a=a.replace('16\\.33\\.(110|111|112|113|114|115|116|117|118|119)','16\\.33\\.(110|111|112|113|114|115|116|117|118|119|120)')
          a=a.replace('tests/regresion-detalle-intereses-corte.mjs','tests/regresion-detalle-intereses-corte.mjs\n\n      - name: Ejecutar regresión específica TDJ fecha de corte en pagos\n        run: node tests/regresion-fecha-corte-pagos-tdj.mjs')
          audit.write_text(a,encoding='utf-8')

          Path('RELEASES/16.33.121.md').write_text('''# 16.33.121\n\n- Corrige exclusivamente el soporte de fecha de corte informativa en PAGOS del módulo TDJ.\n- Conserva los registros de pago que contienen únicamente fecha, sin recibo ni valor, para cerrar la obligación a esa fecha.\n- En el PDF TDJ, muestra el interés ya calculado por el motor en INTERÉS y TOTAL INTERESES DEL PAGO, usando el valor de `interesLiquidado` como respaldo cuando el detalle por cuota no lo expone directamente.\n- No modifica fórmulas de intereses, sanciones, Régimen Simple, vencimientos, distribución TDJ, endoso, importación/manual ni diseño.\n''',encoding='utf-8')

          Path('tests/regresion-fecha-corte-pagos-tdj.mjs').write_text('''import fs from 'node:fs';\nimport assert from 'node:assert/strict';\nconst s=fs.readFileSync('js/tdj.js','utf8');\nassert.match(s,/o\\.pagos=o\\.pagos\\.filter\\(p=>p\\.fecha&&\\(Number\\(p\\.valor\\)>0\\|\\|esFechaCorteTDJ\\(p\\)\\)\\)/);\nassert.match(s,/r\\?\\.intereses\\|\\|x\\?\\.interesLiquidado\\|\\|x\\?\\.interesGenerado/);\nassert.match(s,/esCorteInformativo\\?Number\\(r\\?\\.intereses\\|\\|x\\?\\.interesLiquidado\\|\\|x\\?\\.interesGenerado\\|\\|0\\)/);\nconst corte={fecha:'2026-10-06',valor:0,recibo:'',tdj:''};\nconst esCorte=Boolean(corte.fecha)&&Number(corte.valor)<=0&&!corte.recibo&&!corte.tdj;\nassert.equal(esCorte,true);\nconst x={interesLiquidado:2326000,interesGenerado:2326000};\nconst r={intereses:0};\nconst total=Math.max(0,Number(r.intereses||x.interesLiquidado||x.interesGenerado||0));\nassert.equal(total,2326000);\nconsole.log('REGRESION_FECHA_CORTE_PAGOS_TDJ_OK');\n''',encoding='utf-8')
          PY
      - name: Pruebas
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/regresion-matematica.mjs
          node tests/regresion-ui.mjs
          node tests/regresion-interes-corte-pdf.mjs
          node tests/regresion-fecha-corte-pagos-tdj.mjs
      - name: Commit corrección
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/*.js tests/*.mjs index.html liquidacion.html titulos.html estilos.css .github/workflows/audit-estabilidad.yml .github/workflows/apply-pdf-interest-120-final.yml RELEASES/16.33.121.md
          git diff --cached --quiet && { echo 'No hay cambios pendientes.'; exit 0; }
          git commit -m 'fix: fecha de corte en pagos TDJ v16.33.121'
          git push origin main
