name: Aplicar ajuste de paginación final v16.33.122

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Aplicar agrupación final DIAN y TDJ
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          oldv='16.33.121'
          newv='16.33.122'
          target='${paginas.join("")}${resumenFinal}${resumenExcedentes}${resumenEndoso}${advertencias}'
          replacement='${paginas.join("")}<div class="pdf-resumen-final-agrupado">${resumenFinal}${resumenExcedentes}${resumenEndoso}${advertencias}</div>'

          for name in ('js/app.js','js/tdj.js'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'pdf-resumen-final-agrupado' not in s:
                  if target not in s:
                      raise SystemExit(f'No se encontró el bloque final PDF esperado en {name}')
                  s=s.replace(target,replacement,1)
              s=s.replace(oldv,newv)
              p.write_text(s,encoding='utf-8')

          css=Path('estilos.css') if Path('estilos.css').exists() else Path('js/estilos.css')
          s=css.read_text(encoding='utf-8').replace(oldv,newv)
          marker='/* V16.33.122: AGRUPACION DE RESUMENES FINALES PARA IMPRESION */'
          if marker not in s:
              s += '''\n\n@media print {\n  /* V16.33.122: AGRUPACION DE RESUMENES FINALES PARA IMPRESION */\n  .pdf-resumen-final-agrupado {\n    display:block !important;\n    break-inside:auto;\n    page-break-inside:auto;\n    width:100%;\n  }\n  .pdf-resumen-final-agrupado > .pdf-hoja {\n    break-before:auto !important;\n    break-after:auto !important;\n    page-break-before:auto !important;\n    page-break-after:auto !important;\n    break-inside:avoid-page;\n    page-break-inside:avoid;\n    height:auto !important;\n    min-height:0 !important;\n    margin:0 !important;\n    padding:0 !important;\n    overflow:visible !important;\n  }\n  .pdf-resumen-final-agrupado > .pdf-hoja > .pdf-pagina {\n    height:auto !important;\n    min-height:0 !important;\n    margin:0 !important;\n  }\n  .pdf-resumen-final-agrupado .pdf-liquidacion {\n    height:auto !important;\n    min-height:0 !important;\n    overflow:visible !important;\n  }\n}\n'''
          css.write_text(s,encoding='utf-8')

          # Mantener versión activa alineada en código, páginas y pruebas.
          for root in (Path('js'),Path('tests')):
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.js','.mjs','.css','.html','.json'}: continue
                  try: t=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  nt=t.replace(oldv,newv)
                  if nt!=t:p.write_text(nt,encoding='utf-8')

          # Regresión específica del ajuste.
          for name in ('js/app.js','js/tdj.js'):
              s=Path(name).read_text(encoding='utf-8')
              assert 'pdf-resumen-final-agrupado' in s, name
          cs=css.read_text(encoding='utf-8')
          assert '.pdf-resumen-final-agrupado > .pdf-hoja' in cs
          assert 'break-inside:avoid-page' in cs
          print('PAGINACION FINAL AGRUPADA OK')
          PY

      - name: Validar sintaxis y regresiones
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/regresion-matematica.mjs
          node tests/regresion-ui.mjs
          node tests/regresion-detalle-intereses-corte.mjs
          node tests/regresion-fecha-corte-pagos-tdj.mjs
          node tests/regresion-interes-corte-pdf.mjs
          node tests/regresion-paginacion-final.mjs 2>/dev/null || true

      - name: Crear regresión de paginación si no existe
        run: |
          set -e
          if [ ! -f tests/regresion-paginacion-final.mjs ]; then
            cat > tests/regresion-paginacion-final.mjs <<'JS'
          import fs from 'node:fs';
          for(const f of ['js/app.js','js/tdj.js']){
            const s=fs.readFileSync(f,'utf8');
            if(!s.includes('pdf-resumen-final-agrupado')) throw new Error(`Agrupador ausente: ${f}`);
          }
          const c=fs.existsSync('estilos.css')?fs.readFileSync('estilos.css','utf8'):fs.readFileSync('js/estilos.css','utf8');
          if(!c.includes('.pdf-resumen-final-agrupado > .pdf-hoja')) throw new Error('CSS de agrupación ausente');
          if(!c.includes('break-inside:avoid-page')) throw new Error('Protección de bloque ausente');
          console.log('REGRESION_PAGINACION_FINAL_OK');
          JS
          fi
          node tests/regresion-paginacion-final.mjs

      - name: Commit corrección
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js tests estilos.css index.html liquidacion.html titulos.html RELEASES/16.33.122.md
          git diff --cached --quiet && { echo 'No hay cambios pendientes.'; exit 0; }
          git commit -m 'fix: agrupar resumenes finales en una pagina v16.33.122'
          git push origin main
