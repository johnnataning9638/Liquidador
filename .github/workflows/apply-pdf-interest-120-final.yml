name: Aplicar corrección interés PDF v16.33.120

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Aplicar corrección
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          APP=r'''function tablaInteresesPdf(x,r){
            const detallePago=Array.isArray(x?.interesesPorCuota)?x.interesesPorCuota:[];
            const detalleCorte=Array.isArray(r?.interesesPorCuota)?r.interesesPorCuota:[];
            const p=x?.pago||{};
            const esCorteInformativo=Number(p.valor||0)===0 && Boolean(fechaISO(p.fecha)) && !String(p.recibo||"").trim() && !String(p.tdj||"").trim();
            const filas=detallePago.length?detallePago:(esCorteInformativo?detalleCorte:[]);
            const interesDirecto=t=>Number(t?.interes??t?.valor??0);
            const interesAnidado=t=>{
              const grupos=[];
              if(Array.isArray(t?.tramos))grupos.push(...t.tramos);
              if(Array.isArray(t?.tramoInteres1))grupos.push(...t.tramoInteres1);
              if(Array.isArray(t?.tramoInteres2))grupos.push(...t.tramoInteres2);
              if(t?.tramoSuspension)grupos.push(t.tramoSuspension);
              return grupos.reduce((s,z)=>s+Math.max(0,Number(z?.valor??z?.interes??0)),0);
            };
            const capitalFila=t=>{
              const vtoRef=(r?.vencimientos||[]).find(v=>v?.id===t?.vto)||null;
              return Number(t?.capitalBase||t?.base||vtoRef?.saldo||vtoRef?.impuesto||0);
            };
            const interesesCalculados=filas.map(t=>{const directo=interesDirecto(t);return directo>0?directo:(esCorteInformativo?interesAnidado(t):0);});
            if(esCorteInformativo&&filas.length&&interesesCalculados.every(v=>v<=0)){
              const totalCorte=Math.max(0,Number(r?.intereses||0));
              if(totalCorte>0){const bases=filas.map(capitalFila);const baseTotal=bases.reduce((s,v)=>s+Math.max(0,v),0);if(filas.length===1)interesesCalculados[0]=totalCorte;else if(baseTotal>0)filas.forEach((_,i)=>{interesesCalculados[i]=totalCorte*(Math.max(0,bases[i])/baseTotal);});}
            }
            let rows="";
            if(filas.length){rows=filas.map((t,i)=>{const vtoRef=(r?.vencimientos||[]).find(v=>v?.id===t?.vto)||null;const cuota=t?.cuota??t?.vto??vtoRef?.numero??(i+1);const capital=capitalFila(t);const fechaVto=t?.fechaVencimiento||vtoRef?.fecha||"";const fechaPago=t?.fechaPago||p.fecha||(esCorteInformativo?r?.fechaCorte||"":"");const dias=Number(t?.dias||0);const tasa=t?.tasa!=null?((Number(t.tasa)*100).toFixed(3)+"%"):(x?.tasaVisible!=null?Number(x.tasaVisible).toFixed(3)+"%":"—");const interes=Number(interesesCalculados[i]||0);return `<tr><td>${escPdf(cuota)}</td><td>${dinero(capital)}</td><td>${escPdf(fechaVisible(fechaVto))}</td><td>${escPdf(fechaVisible(fechaPago))}</td><td>${dias}</td><td>${tasa}</td><td>${dinero(interes)}</td></tr>`;}).join("");}
            else{rows=(r?.vencimientos||[]).map(v=>`<tr><td>${escPdf(v?.numero||"")}</td><td>${dinero(0)}</td><td>${escPdf(fechaVisible(v?.fecha||""))}</td><td>${escPdf(fechaVisible(p.fecha||""))}</td><td>0</td><td>${x?.tasaVisible==null?"—":Number(x.tasaVisible).toFixed(3)+"%"}</td><td>${dinero(0)}</td></tr>`).join("");}
            const total=filas.length?interesesCalculados.reduce((s,v)=>s+Number(v||0),0):(esCorteInformativo?Number(r?.intereses||0):Number(x?.interesGenerado||0));
            return `<div class="pdf-intereses"><h3>CÁLCULO DE INTERESES POR CUOTA</h3><table><thead><tr><th>CUOTA</th><th>CAPITAL BASE</th><th>FECHA VENCIMIENTO</th><th>FECHA PAGO</th><th>DÍAS</th><th>TASA</th><th>INTERÉS</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="6">TOTAL INTERESES DEL PAGO</th><th>${dinero(total)}</th></tr></tfoot></table></div>`;
          }
          '''
          TDJ=APP.replace('function tablaInteresesPdf(x,r){','function tablaInteresesPdfTDJ(x,r){',1).replace('<th>FECHA PAGO</th>','<th>FECHA PAGO / TDJ</th>',1)
          def repl(path,pat,new):
            p=root/path;s=p.read_text(encoding='utf-8');s2,n=re.subn(pat,new,s,count=1)
            if n!=1: raise SystemExit(f'No se encontró {path}: {n}')
            p.write_text(s2,encoding='utf-8')
          repl('js/app.js',r'function tablaInteresesPdf\(x,r\)\{[\s\S]*?\n\}\n\n(?=function valorNominalPagoPdf)',APP+'\n')
          repl('js/tdj.js',r'function tablaInteresesPdfTDJ\(x,r\)\{[\s\S]*?\n\}\n\n(?=function bloqueSuspensionInteresesPdfTDJ)',TDJ+'\n')
          for p in root.rglob('*'):
            if not p.is_file() or any(x in p.parts for x in {'.git','RELEASES','node_modules'}): continue
            if p.suffix.lower() not in {'.js','.html','.css','.yml','.yaml','.json','.mjs'}: continue
            try:s=p.read_text(encoding='utf-8')
            except UnicodeDecodeError:continue
            if '16.33.119' in s:p.write_text(s.replace('16.33.119','16.33.120'),encoding='utf-8')
          a=root/'.github/workflows/audit-estabilidad.yml';s=a.read_text(encoding='utf-8');s=s.replace('16.33.119','16.33.120').replace('16\\.33\\.(110|111|112|113|114|115|116|117|118)','16\\.33\\.(110|111|112|113|114|115|116|117|118|119)');a.write_text(s,encoding='utf-8')
          Path('RELEASES/16.33.120.md').write_text('# 16.33.120\n\n- Corrige exclusivamente la visualización del interés calculado en el PDF para cierres informativos sin pago, tanto DIAN/RIAN como TDJ.\n- El valor ya calculado por el motor se refleja en INTERÉS y TOTAL INTERESES DEL PAGO.\n- No modifica fórmulas, sanciones, pagos, Régimen Simple, vencimientos ni distribución TDJ.\n',encoding='utf-8')
          Path('tests/regresion-interes-corte-pdf.mjs').write_text("""import fs from 'node:fs';\nimport assert from 'node:assert/strict';\nfor(const f of ['js/app.js','js/tdj.js']){const s=fs.readFileSync(f,'utf8');assert.match(s,/interesesCalculados/);assert.match(s,/Number\\(r\\?\\.intereses\\|\\|0\\)/);assert.match(s,/interesesCalculados\\.reduce/);}\nconst filas=[{capitalBase:5420000,interes:0}],r={intereses:2326000};let v=filas.map(x=>Number(x.interes||0));if(v.every(x=>x<=0)&&filas.length===1)v[0]=Number(r.intereses);assert.equal(v[0],2326000);assert.equal(v.reduce((a,b)=>a+b,0),2326000);console.log('REGRESION_INTERES_CORTE_OK');\n""",encoding='utf-8')
          PY
      - name: Pruebas
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/regresion-matematica.mjs
          node tests/regresion-ui.mjs
          node tests/regresion-interes-corte-pdf.mjs
      - name: Commit corrección
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj.js .github/workflows/audit-estabilidad.yml RELEASES/16.33.120.md tests/regresion-interes-corte-pdf.mjs
          git add -- $(git diff --name-only -- '*.js' '*.html' '*.css' '*.mjs' '*.json' '*.yml' '*.yaml') || true
          if git diff --cached --quiet; then
            echo 'No hay cambios pendientes de sincronización.'
            exit 0
          fi
          git commit -m 'fix: sincronizar referencias activas v16.33.120'
          git push origin main
