name: Aplicar ajuste de paginación final v16.33.122

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'v16.33.122') || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Aplicar agrupación final DIAN y TDJ
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          oldv='16.33.121'
          newv='16.33.122'
          target='${paginas.join("")}${resumenFinal}${resumenExcedentes}${resumenEndoso}${advertencias}'
          replacement='${paginas.join("")}<div class="pdf-resumen-final-agrupado">${resumenFinal}${resumenExcedentes}${resumenEndoso}${advertencias}</div>'

          for name in ('js/app.js','js/tdj.js'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'pdf-resumen-final-agrupado' not in s:
                  if target not in s:
                      raise SystemExit(f'No se encontró el bloque final PDF esperado en {name}')
                  s=s.replace(target,replacement,1)
              s=s.replace(oldv,newv)
              p.write_text(s,encoding='utf-8')

          css=Path('estilos.css') if Path('estilos.css').exists() else Path('js/estilos.css')
          s=css.read_text(encoding='utf-8').replace(oldv,newv)
          marker='/* V16.33.122: AGRUPACION DE RESUMENES FINALES PARA IMPRESION */'
          if marker not in s:
              s += '''\n\n@media print {\n  /* V16.33.122: AGRUPACION DE RESUMENES FINALES PARA IMPRESION */\n  .pdf-resumen-final-agrupado { display:block !important; break-inside:auto; page-break-inside:auto; width:100%; }\n  .pdf-resumen-final-agrupado > .pdf-hoja { break-before:auto !important; break-after:auto !important; page-break-before:auto !important; page-break-after:auto !important; break-inside:avoid-page; page-break-inside:avoid; height:auto !important; min-height:0 !important; margin:0 !important; padding:0 !important; overflow:visible !important; }\n  .pdf-resumen-final-agrupado > .pdf-hoja > .pdf-pagina { height:auto !important; min-height:0 !important; margin:0 !important; }\n  .pdf-resumen-final-agrupado .pdf-liquidacion { height:auto !important; min-height:0 !important; overflow:visible !important; }\n}\n'''
          css.write_text(s,encoding='utf-8')

          for root in (Path('js'),Path('tests')):
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.js','.mjs','.css','.html','.json'}: continue
                  try: t=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  nt=t.replace(oldv,newv)
                  if nt!=t:p.write_text(nt,encoding='utf-8')

          for name in ('js/app.js','js/tdj.js'):
              s=Path(name).read_text(encoding='utf-8')
              assert 'pdf-resumen-final-agrupado' in s, name
          cs=css.read_text(encoding='utf-8')
          assert '.pdf-resumen-final-agrupado > .pdf-hoja' in cs
          assert 'break-inside:avoid-page' in cs
          print('PAGINACION FINAL AGRUPADA OK')
          PY

      - name: Validar sintaxis y regresiones
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/regresion-matematica.mjs
          node tests/regresion-ui.mjs
          node tests/regresion-detalle-intereses-corte.mjs
          node tests/regresion-fecha-corte-pagos-tdj.mjs
          node tests/regresion-interes-corte-pdf.mjs
          node tests/regresion-paginacion-final.mjs

      - name: Commit corrección
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js tests estilos.css index.html liquidacion.html titulos.html RELEASES/16.33.122.md
          git diff --cached --quiet && { echo 'No hay cambios pendientes.'; exit 0; }
          git commit -m 'fix: agrupar resumenes finales en una pagina v16.33.122'
          git push origin main

      - name: Commit corrección en rama del PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js tests estilos.css index.html liquidacion.html titulos.html RELEASES/16.33.122.md
          if git diff --cached --quiet; then
            echo 'Rama ya contiene la corrección; no hay cambios pendientes.'
            exit 0
          fi
          git commit -m 'fix: agrupar resumenes finales en una pagina v16.33.122'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
