name: Auditoría secuencia TDJ v16.33.153

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auditoria:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verificar corrección en motor real
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          checks = {
              'regla': ('REGLA FUNDAMENTAL v16.33.153', 'js/tdj-core-16.33.143.js'),
              'corte': ('if(saldoObligacionActual>0.5)break;', 'js/tdj-core-16.33.143.js'),
              'core-import': ('prioridad-tdj-v132.js?v=16.33.153', 'js/tdj-core-16.33.143.js'),
              'tdj-import': ('tdj-core-16.33.143.js?v=16.33.153', 'js/tdj.js'),
              'html-import': ('js/tdj.js?v=16.33.153', 'titulos.html'),
          }
          for label,(needle,name) in checks.items():
              text=Path(name).read_text(encoding='utf-8')
              if needle not in text:
                  raise SystemExit(f'FALLO {label}: {needle}')
          print('AUDITORIA CADENA TDJ 16.33.153: OK')
          PY

      - name: Sintaxis y regresiones TDJ
        shell: bash
        run: |
          set -euo pipefail
          node --check js/tdj-core-16.33.143.js
          node --check js/tdj.js
          node --check js/prioridad-tdj.js
          node --check js/prioridad-tdj-v132.js
          node tests/regresion-secuencia-tdj-153.mjs
          node tests/regresion-secuencia-tdj-152.mjs
          node tests/regresion-secuencia-tdj-151.mjs
