name: Correctivo secuencia TDJ v16.33.151

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  correctivo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar referencias TDJ y romper caché
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'js/tdj-core-16.33.143.js': [
                  ('?v=16.33.149', '?v=16.33.151'),
              ],
              'js/tdj.js': [
                  ('16.33.148', '16.33.151'),
                  ('16.33.149', '16.33.151'),
              ],
              'js/prioridad-tdj-v132.js': [
                  ('16.33.150', '16.33.151'),
                  ('16.33.148', '16.33.151'),
              ],
              'titulos.html': [
                  ('16.33.149', '16.33.151'),
                  ('16.33.150', '16.33.151'),
              ],
          }
          for name, pairs in replacements.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')
          PY

      - name: Verificar cadena real de carga TDJ
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'prioridad-tdj-v132.js?v=16.33.151' js/tdj-core-16.33.143.js
          grep -F 'tdj-core-16.33.143.js?v=16.33.151' js/tdj.js
          grep -F 'js/tdj.js?v=16.33.151' titulos.html
          grep -F '16.33.151' js/prioridad-tdj-v132.js

      - name: Auditoría funcional de sintaxis y regresiones
        shell: bash
        run: |
          set -euo pipefail
          node --check js/prioridad-tdj.js
          node --check js/prioridad-tdj-v132.js
          node --check js/tdj.js
          if [ -f tests/regresion-secuencia-tdj-129.mjs ]; then node tests/regresion-secuencia-tdj-129.mjs; fi
          if [ -f tests/regresion-secuencia-tdj-149.mjs ]; then node tests/regresion-secuencia-tdj-149.mjs; fi
          if [ -f tests/regresion-secuencia-tdj-151.mjs ]; then node tests/regresion-secuencia-tdj-151.mjs; fi

      - name: Commit correctivo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js titulos.html
          if git diff --cached --quiet; then
            echo 'SIN_CAMBIOS_CORRECTIVOS'
            exit 0
          fi
          git commit -m 'fix: activar cadena TDJ v16.33.151 y romper cache'
          git push origin main
