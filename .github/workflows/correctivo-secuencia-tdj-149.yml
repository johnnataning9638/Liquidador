name: Auditoría secuencia TDJ v16.33.160

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  auditoria:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Aplicar correccion exacta de carga de parametros 160
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files={'js/app.js':'function crc32(bytes){','js/tdj-core-16.33.143.js':'function crc32TDJ(bytes){'}
          for name,next_fn in files.items():
            p=Path(name); s=p.read_text(encoding='utf-8')
            needle='</worksheet>`;\n\n'+next_fn
            if needle not in s:
              raise SystemExit(f'No se encontro el cierre XLSX defectuoso en {name}')
            s=s.replace(needle,'</worksheet>`;\n}\n\n'+next_fn,1)
            p.write_text(s.replace('16.33.159','16.33.160'),encoding='utf-8')
          for name in ['js/app.js','js/tdj-core-16.33.143.js','js/tdj.js','js/prioridad-tdj-v132.js','liquidacion.html','titulos.html']:
            p=Path(name); p.write_text(p.read_text(encoding='utf-8').replace('16.33.159','16.33.160'),encoding='utf-8')
          PY
      - name: Sintaxis y regresiones
        shell: bash
        run: |
          set -euo pipefail
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/regresion-parametros-160.mjs
          node tests/regresion-exportacion-excel-158.mjs
          node tests/regresion-secuencia-tdj-152.mjs
          for f in datos/uvt.json datos/tasas-moratorias.json datos/ipc.json datos/beneficios.json datos/sanciones.json datos/reglas-obligaciones.json datos/calendario.json datos/reglas-historicas.json; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; done
      - name: Publicar correccion 160
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js liquidacion.html titulos.html tests/regresion-exportacion-excel-158.mjs tests/regresion-parametros-160.mjs
          if git diff --cached --quiet; then echo 'Sin cambios'; exit 0; fi
          git commit -m 'fix: restaurar ejecucion de carga de parametros v16.33.160'
          git push origin HEAD:main
