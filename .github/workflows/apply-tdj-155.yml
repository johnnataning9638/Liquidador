name: TDJ 155
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/tdj-core-16.33.143.js')
          s=p.read_text()
          old='''        const saldoObligacionActual=Math.max(0,Number(ultimo?.saldo?.total??r.total??0));\n\n        // v16.33.154: si pagos normales protegidos cubren la obligacion,\n        // el remanente TDJ puede continuar a la siguiente obligacion; si no,\n        // el siguiente TDJ debe retomar la obligacion actual.\n        let obligacionCubiertaPorPagosProtegidos=false;\n        try{\n          const estadoConPagosProtegidos=motorActual.calcular(datosAjustados);\n          obligacionCubiertaPorPagosProtegidos=Number(estadoConPagosProtegidos?.total||0)<=0.5;\n        }catch{}\n        if(saldoObligacionActual>0.5 && !obligacionCubiertaPorPagosProtegidos)break;'''
          new='''        const saldoObligacionActual=Math.max(0,Number(ultimo?.saldo?.total??r.total??0));\n\n        // v16.33.155: regla única. Si la obligación actual aún tiene saldo,\n        // este título termina aquí. Solo el excedente posterior a cubrirla\n        // puede avanzar; el siguiente título retoma la obligación actual.\n        if(saldoObligacionActual>0.5)break;'''
          if old not in s: raise SystemExit('BLOQUE V154 NO ENCONTRADO')
          p.write_text(s.replace(old,new,1).replace('16.33.154','16.33.155'))
          for name in ['titulos.html','js/tdj.js','js/prioridad-tdj-v132.js']:
            q=Path(name); q.write_text(q.read_text().replace('16.33.154','16.33.155'))
          t=Path('tests/regresion-secuencia-tdj-155.mjs')
          t.write_text('''import fs from "node:fs";\nimport assert from "node:assert/strict";\nconst s=fs.readFileSync("js/tdj-core-16.33.143.js","utf8");\nassert.match(s,/v16\\.33\\.155: regla única/);\nassert.match(s,/if\\(saldoObligacionActual>0\\.5\\)break;/);\nassert.doesNotMatch(s,/obligacionCubiertaPorPagosProtegidos/);\nfunction sec(obls,titulos){let c=0,o=[];for(const t of titulos){let d=t.v;while(d>0.5&&c<obls.length){const a=Math.min(d,obls[c]);obls[c]-=a;d-=a;o.push([t.id,c+1,a]);if(obls[c]<=0.5)c++;else break;}}return{obls,o};}\n// Estado exacto antes del TDJ4: TDJ3 ya aplicó 15.548M a O1 y su excedente 4.452M a O2.\n// Por tanto O1 conserva 9.041M. El siguiente TDJ DEBE retomar O1.\nconst r=sec([9041000,45134000],[{id:"TDJ4",v:10000000}]);\nassert.deepEqual(r.o[0],["TDJ4",1,9041000]);\nassert.deepEqual(r.o[1],["TDJ4",2,959000]);\nassert.equal(r.obls[0],0);\nassert.equal(r.obls[1],44175000);\nconsole.log("REGRESION TDJ 155 OK");\n''')
          PY
      - name: Test
        run: |
          node --check js/tdj-core-16.33.143.js
          node --check js/tdj.js
          node --check js/prioridad-tdj-v132.js
          node tests/regresion-secuencia-tdj-155.mjs
      - name: Commit
        run: |
          rm -f .github/workflows/apply-tdj-155.yml .tdj155-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: secuencia TDJ agota obligacion actual v16.33.155'
          git push
