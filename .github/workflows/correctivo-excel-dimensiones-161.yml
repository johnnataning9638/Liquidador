name: Correctivo Excel dimensiones 161
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajustar ancho de valores y alto automático de filas
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch(path, fn, col_fn, cell_fn):
              p=Path(path)
              s=p.read_text()
              start=s.index(f'function {fn}(')
              end=s.index('\nfunction crc32', start) if 'function crc32' in s[start:] and fn=='xlsxSheet' else s.index('\nfunction crc32TDJ', start)
              block=s[start:end]
              pat=re.compile(r'  const body=safeRows\.map\(\(r,i\)=>\{.*?  const cols=Array\.from\(\{length:lastCol\}', re.S)
              new='''  const valueCols=new Set([\n    ...(moneyCols||[]),\n    ...Object.values(rowMoneyCols||{}).flat(),\n    ...(percentCols||[]),\n    ...Object.values(rowPercentCols||{}).flat()\n  ].map(Number));\n  const widths=Array.from({length:lastCol},(_,i)=>{\n    const base=Number(columnWidths[i]||16);\n    return valueCols.has(i+1)?base+4:base;\n  });\n  const body=safeRows.map((r,i)=>{\n    const row=Array.isArray(r)?r:[];\n    const rm=Array.isArray(rowMoneyCols[i])?rowMoneyCols[i]:moneyCols;\n    const rp=Array.isArray(rowPercentCols[i])?rowPercentCols[i]:percentCols;\n    const title=titleRows.includes(i),header=headerRows.includes(i);\n    const lines=Math.max(1,...row.map((v,j)=>Math.ceil(String(v??\"\").length/Math.max(8,Number(widths[j]||16)*1.15))));\n    const baseHeight=title?24:(header?20:18);\n    const height=title?24:Math.min(header?45:60,Math.max(baseHeight,lines*15));\n    return `<row r=\"${i+1}\" ht=\"${height}\" customHeight=\"1\">${row.map((v,j)=>{\n      let style=0;\n      if(title)style=1;\n      else if(header)style=2;\n      else if(rm.includes(j+1))style=3;\n      else if(rp.includes(j+1))style=4;\n      return CELL_FN(v,j+1,i+1,style);\n    }).join(\"\")}</row>`;\n  }).join(\"\");\n  const cols=Array.from({length:lastCol}'''.replace('CELL_FN',cell_fn)
              if not pat.search(block):
                  raise SystemExit(f'No se encontró el bloque XLSX esperado en {path}')
              block2=pat.sub(new,block,count=1)
              s=s[:start]+block2+s[end:]
              p.write_text(s)

          patch('js/app.js','xlsxSheet','xlsxCol','xlsxCell')
          patch('js/tdj-core-16.33.143.js','xlsxSheetTDJ','xlsxColTDJ','xlsxCellTDJ')

          files=['js/app.js','js/tdj-core-16.33.143.js','js/tdj.js','js/prioridad-tdj-v132.js','liquidacion.html','titulos.html']
          for name in files:
              p=Path(name); s=p.read_text(); s=s.replace('16.33.160','16.33.161'); p.write_text(s)
          PY
      - name: Crear regresión permanente de dimensiones XLSX
        run: |
          cat > tests/regresion-excel-dimensiones-161.mjs <<'EOF'
          import fs from 'node:fs';
          const casos=[
            ['js/app.js','xlsxSheet','xlsxCell','xlsxCol'],
            ['js/tdj-core-16.33.143.js','xlsxSheetTDJ','xlsxCellTDJ','xlsxColTDJ']
          ];
          for(const [file,fn,cell,col] of casos){
            const s=fs.readFileSync(file,'utf8');
            const a=s.indexOf(`function ${fn}(`), b=s.indexOf(file.includes('tdj-core')?'function crc32TDJ':'function crc32',a);
            if(a<0||b<0)throw new Error(`No se encontró ${fn} en ${file}`);
            const x=s.slice(a,b);
            for(const token of ['const valueCols=new Set','const widths=Array.from','return valueCols.has(i+1)?base+4:base','const lines=Math.max(1','Math.min(header?45:60','customHeight="1"']){
              if(!x.includes(token))throw new Error(`Falta control ${token} en ${file}`);
            }
            if(!s.includes('16.33.161'))throw new Error(`Falta versión 16.33.161 en ${file}`);
            if(!x.includes(cell+'(')||!x.includes(col+'('))throw new Error(`Falta integración XLSX en ${file}`);
          }
          console.log('REGRESIÓN EXCEL DIMENSIONES 16.33.161 OK — valores más anchos y alto de filas adaptativo en DIAN y TDJ.');
          EOF
      - name: Ejecutar pruebas
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/regresion-excel-dimensiones-161.mjs
          node tests/regresion-parametros-160.mjs
          node tests/regresion-exportacion-excel-158.mjs
          node tests/regresion-secuencia-tdj-151.mjs
          node tests/regresion-secuencia-tdj-152.mjs
          node tests/regresion-importadores-decimales-145.mjs
          node tests/regresion-simbolo-peso-importadores-146.mjs
      - name: Commit y publicar
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js liquidacion.html titulos.html tests/regresion-excel-dimensiones-161.mjs .github/workflows/audit-estabilidad.yml
          git diff --cached --quiet && { echo 'Sin cambios'; exit 0; } || true
          git commit -m 'feat: ajustar dimensiones de Excel v16.33.161'
          git push
