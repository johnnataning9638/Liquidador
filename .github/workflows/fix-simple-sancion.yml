name: Fix aislado régimen SIMPLE
on:
  push:
    branches: [fix/simple-sancion-20261005]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-sancion-20261005
          fetch-depth: 0
      - name: Aplicar correccion SIMPLE
        run: |
          python - <<'PY'
          from pathlib import Path
          old='''      const sancionHabilitadaPorFecha=esSimplePorAnticipos
        ? (!fechaSancionReal || pago.fecha>=fechaSancionReal)
        : (
            datos.tieneSancion==="SI"
            && sancionBaseOriginal>0
            && Boolean(fechaSancionReal)
            && pago.fecha>=fechaSancionReal
          );'''
          new='''      const sancionHabilitadaPorFecha=esSimplePorAnticipos
        ? true
        : (
            datos.tieneSancion==="SI"
            && sancionBaseOriginal>0
            && Boolean(fechaSancionReal)
            && pago.fecha>=fechaSancionReal
          );'''
          for f in ['js/motor-liquidacion.js','js/motor-liquidacion-oficial.js']:
              p=Path(f); s=p.read_text()
              if old in s:
                  assert s.count(old)==1, f
                  p.write_text(s.replace(old,new))
              else:
                  assert new in s, f
          PY
      - name: Regresion matematica
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --experimental-default-type=module tests/regresion-matematica.mjs
          git diff --check
      - name: Publicar correccion
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/motor-liquidacion.js js/motor-liquidacion-oficial.js
          git commit -m 'fix: restaurar sancion en anticipos del regimen SIMPLE'
          git push origin HEAD:fix/simple-sancion-20261005
