name: Fix aislado régimen SIMPLE
on:
  push:
    branches:
      - fix/simple-sancion-20261005
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-sancion-20261005
          fetch-depth: 0
      - name: Aplicar corrección SIMPLE
        run: |
          set -e
          for f in js/motor-liquidacion.js js/motor-liquidacion-oficial.js; do
            count=$(grep -oF '? (!fechaSancionReal || pago.fecha>=fechaSancionReal)' "$f" | wc -l)
            test "$count" -eq 1
            sed -i 's/? (!fechaSancionReal || pago.fecha>=fechaSancionReal)/? true/' "$f"
          done
      - name: Regresión matemática
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tests/regresion-matematica.mjs
          node --experimental-default-type=module tests/regresion-matematica.mjs
          git diff --check
      - name: Publicar corrección
        run: |
          set -e
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/motor-liquidacion.js js/motor-liquidacion-oficial.js
          git commit -m 'fix: restaurar sancion en anticipos del regimen SIMPLE'
          git push origin HEAD:fix/simple-sancion-20261005
