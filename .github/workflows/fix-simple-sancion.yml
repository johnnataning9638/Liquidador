name: Fix aislado régimen SIMPLE
on:
  push:
    branches:
      - fix/simple-sancion-20261005
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-sancion-20261005
          fetch-depth: 0
      - name: Aplicar corrección SIMPLE
        run: >-
          python3 -c 'from pathlib import Path; old="""      const sancionHabilitadaPorFecha=esSimplePorAnticipos
        ? (!fechaSancionReal || pago.fecha>=fechaSancionReal)
        : (
            datos.tieneSancion==="SI"
            && sancionBaseOriginal>0
            && Boolean(fechaSancionReal)
            && pago.fecha>=fechaSancionReal
          );"""; new="""      const sancionHabilitadaPorFecha=esSimplePorAnticipos
        ? true
        : (
            datos.tieneSancion==="SI"
            && sancionBaseOriginal>0
            && Boolean(fechaSancionReal)
            && pago.fecha>=fechaSancionReal
          );"""; files=["js/motor-liquidacion.js","js/motor-liquidacion-oficial.js"]; [(lambda p,s: ( (_ for _ in ()).throw(SystemExit(f"bloque no unico: {p}")) if s.count(old)>1 else p.write_text(s.replace(old,new)) ))(Path(f),Path(f).read_text()) for f in files]; [None for f in files if new in Path(f).read_text()]; print("correccion SIMPLE aplicada/verificada")'
      - name: Regresión matemática
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tests/regresion-matematica.mjs
          node --experimental-default-type=module tests/regresion-matematica.mjs
          git diff --check
      - name: Publicar corrección
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/motor-liquidacion.js js/motor-liquidacion-oficial.js
          git commit -m 'fix: restaurar sancion en anticipos del regimen SIMPLE'
          git push origin HEAD:fix/simple-sancion-20261005
