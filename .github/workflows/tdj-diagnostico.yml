name: TDJ Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect TDJ core and persist diagnostic
        shell: bash
        run: |
          set -e
          FILE=js/tdj-core-16.33.143.js
          OUT=TDJ-DIAGNOSTIC.txt
          : > "$OUT"
          echo '=== MATCHES ===' >> "$OUT"
          grep -nE 'INCONSISTENCIA TDJ|fechaCorteTDJ|corteObligacion|endoso|remanente|saldoOblig|aplicarTitulos' "$FILE" >> "$OUT" || true
          echo '=== CONTEXT ===' >> "$OUT"
          python - <<'PY' >> "$OUT"
          from pathlib import Path
          p=Path('js/tdj-core-16.33.143.js')
          s=p.read_text()
          needles=['INCONSISTENCIA TDJ','fechaCorteTDJ','corteObligacion','aplicarTitulos','remanente','endoso']
          for n in needles:
              pos=0
              count=0
              while True:
                  i=s.find(n,pos)
                  if i<0: break
                  count+=1
                  a=max(0,i-2200); b=min(len(s),i+4200)
                  print(f'--- {n} occurrence {count} ---')
                  print(s[a:b])
                  pos=i+len(n)
                  if count>=5: break
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'chore: persist temporary TDJ diagnostic' || true
          git push
