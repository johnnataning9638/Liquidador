name: Audit de estabilidad del liquidador

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

jobs:
  syntax-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar sintaxis JavaScript
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validar versión activa y regresiones TDJ
        run: |
          set -e
          grep -q '16.33.132' js/prioridad-tdj-v132.js
          test -f RELEASES/16.33.132.md
          node tests/regresion-secuencia-tdj-129.mjs
          node tests/regresion-prioridad-pagos-tdj-130.mjs
          node tests/regresion-idempotencia-tdj-132.mjs

      - name: Verificar que los motores no tengan cambios funcionales
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch origin main --quiet
          for f in js/motor-liquidacion.js js/motor-liquidacion-oficial.js; do
            diff="$(git diff --unified=0 origin/main...HEAD -- "$f" || true)"
            echo "$diff"
            if echo "$diff" | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -vE '^[+-]import .*\\?v='; then
              echo "ERROR: se detectó un cambio funcional en $f."
              exit 1
            fi
          done

      - name: Verificar que los tres botones usen el mismo cálculo
        run: |
          set -e
          test "$(grep -o 'class=\"[^\"]*btn-calcular-normal[^\"]*\"' liquidacion.html | wc -l)" -eq 3
          grep -q 'querySelectorAll(\".btn-calcular-normal\").*addEventListener(\"click\",calcular)' js/app.js
