name: Audit de estabilidad del liquidador

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  syntax-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajuste controlado Excel 16.33.161
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          if grep -q '16.33.160' js/app.js || grep -q '16.33.160' js/tdj-core-16.33.143.js; then
            python3 - <<'PY'
            from pathlib import Path
            import re
            def patch(path, fn, cell_fn):
                p=Path(path); s=p.read_text(); start=s.index(f'function {fn}(')
                marker='function crc32TDJ' if 'tdj-core' in path else 'function crc32'
                end=s.index('\n'+marker,start)
                block=s[start:end]
                pat=re.compile(r'  const body=safeRows\.map\(\(r,i\)=>\{.*?  const cols=Array\.from\(\{length:lastCol\}',re.S)
                new='''  const valueCols=new Set([\n    ...(moneyCols||[]),\n    ...Object.values(rowMoneyCols||{}).flat(),\n    ...(percentCols||[]),\n    ...Object.values(rowPercentCols||{}).flat()\n  ].map(Number));\n  const widths=Array.from({length:lastCol},(_,i)=>{\n    const base=Number(columnWidths[i]||16);\n    return valueCols.has(i+1)?base+4:base;\n  });\n  const body=safeRows.map((r,i)=>{\n    const row=Array.isArray(r)?r:[];\n    const rm=Array.isArray(rowMoneyCols[i])?rowMoneyCols[i]:moneyCols;\n    const rp=Array.isArray(rowPercentCols[i])?rowPercentCols[i]:percentCols;\n    const title=titleRows.includes(i),header=headerRows.includes(i);\n    const lines=Math.max(1,...row.map((v,j)=>Math.ceil(String(v??\"\").length/Math.max(8,Number(widths[j]||16)*1.15))));\n    const baseHeight=title?24:(header?20:18);\n    const height=title?24:Math.min(header?45:60,Math.max(baseHeight,lines*15));\n    return `<row r=\"${i+1}\" ht=\"${height}\" customHeight=\"1\">${row.map((v,j)=>{\n      let style=0;\n      if(title)style=1;\n      else if(header)style=2;\n      else if(rm.includes(j+1))style=3;\n      else if(rp.includes(j+1))style=4;\n      return CELL_FN(v,j+1,i+1,style);\n    }).join(\"\")}</row>`;\n  }).join(\"\");\n  const cols=Array.from({length:lastCol}'''.replace('CELL_FN',cell_fn)
                if not pat.search(block): raise SystemExit(f'No se encontró el bloque esperado en {path}')
                p.write_text(s[:start]+pat.sub(new,block,count=1)+s[end:])
            patch('js/app.js','xlsxSheet','xlsxCell')
            patch('js/tdj-core-16.33.143.js','xlsxSheetTDJ','xlsxCellTDJ')
            for name in ['js/app.js','js/tdj-core-16.33.143.js','js/tdj.js','js/prioridad-tdj-v132.js','liquidacion.html','titulos.html']:
                p=Path(name); p.write_text(p.read_text().replace('16.33.160','16.33.161'))
            PY
            cat > tests/regresion-excel-dimensiones-161.mjs <<'EOF'
            import fs from 'node:fs';
            const casos=[['js/app.js','xlsxSheet','xlsxCell','xlsxCol'],['js/tdj-core-16.33.143.js','xlsxSheetTDJ','xlsxCellTDJ','xlsxColTDJ']];
            for(const [file,fn,cell,col] of casos){
              const s=fs.readFileSync(file,'utf8'); const a=s.indexOf(`function ${fn}(`), b=s.indexOf(file.includes('tdj-core')?'function crc32TDJ':'function crc32',a); const x=s.slice(a,b);
              for(const token of ['const valueCols=new Set','const widths=Array.from','return valueCols.has(i+1)?base+4:base','const lines=Math.max(1','Math.min(header?45:60','customHeight="1"']) if(!x.includes(token)) throw new Error(`Falta ${token} en ${file}`);
              if(!s.includes('16.33.161')||!x.includes(cell+'(')||!x.includes(col+'(')) throw new Error(`Integridad/version XLSX inválida en ${file}`);
            }
            console.log('REGRESIÓN EXCEL DIMENSIONES 16.33.161 OK');
            EOF
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add js/app.js js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js liquidacion.html titulos.html tests/regresion-excel-dimensiones-161.mjs
            git commit -m 'feat: ajustar dimensiones de Excel v16.33.161'
            git push
          fi
      - name: Validar sintaxis JavaScript
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Ejecutar regresiones históricas y de importadores
        run: |
          set -e
          node tests/regresion-parametros-160.mjs
          if [ -f tests/regresion-excel-dimensiones-161.mjs ]; then node tests/regresion-excel-dimensiones-161.mjs; fi
          node tests/regresion-exportacion-excel-158.mjs
          node tests/regresion-secuencia-tdj-129.mjs
          node tests/regresion-prioridad-pagos-tdj-130.mjs
          node tests/regresion-idempotencia-tdj-132.mjs
          node tests/regresion-saldo-final-134.mjs
          node tests/regresion-importadores-decimales-145.mjs
          node tests/regresion-simbolo-peso-importadores-146.mjs
          node tests/regresion-secuencia-tdj-151.mjs
          node tests/regresion-secuencia-tdj-152.mjs
      - name: Verificar integridad del motor de liquidación
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch origin main --quiet
          for f in js/motor-liquidacion.js js/motor-liquidacion-oficial.js; do
            diff="$(git diff --unified=0 origin/main...HEAD -- "$f" || true)"
            echo "$diff"
            if echo "$diff" | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -vE '^[+-]import .*\\?v='; then
              echo "ERROR: se detectó un cambio funcional en $f."
              exit 1
            fi
          done
      - name: Verificar controles de cálculo DIAN
        run: |
          set -e
          test "$(grep -o 'class=\"[^\"]*btn-calcular-normal[^\"]*\"' liquidacion.html | wc -l)" -eq 3
          grep -q 'querySelectorAll(\".btn-calcular-normal\").*addEventListener(\"click\",calcular)' js/app.js
