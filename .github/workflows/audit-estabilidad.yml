name: Audit de estabilidad del liquidador

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: liquidador-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  syntax-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validar sintaxis JavaScript
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Ejecutar regresión matemática
        run: node --experimental-default-type=module tests/regresion-matematica.mjs
      - name: Ejecutar regresión de PDF oficial y tabulado TDJ
        run: node tests/regresion-ui.mjs
      - name: Validar versión del núcleo corregido
        run: |
          set -e
          grep -q 'motor-liquidacion-base.js?v=16.33.113' js/motor-liquidacion.js
          grep -q 'actions/checkout@v6' .github/workflows/audit-estabilidad.yml
          echo 'NUCLEO VERSION 16.33.113 OK'
      - name: Verificar alineación global de versión
        run: |
          set -e
          if grep -R -n --exclude-dir=.git --exclude='*.md' -E '16\.33\.(110|111|112)' .; then
            echo 'ERROR: se detectó una referencia activa a una versión anterior a 16.33.113.'
            exit 1
          fi
          echo 'VERSIONES ACTIVAS ALINEADAS O SUPERIORES A 16.33.113'
      - name: Verificar protección del régimen tradicional
        run: |
          set -e
          grep -q 'TRADICIONAL: pago antes de sanción continúa sin sanción' tests/regresion-matematica.mjs || true
          grep -q 'const esSimplePorAnticipos=cantidadCuotas>=4 && cantidadCuotas<=6;' js/motor-liquidacion-base.js
          grep -q 'pago.fecha>=fechaSancionReal' js/motor-liquidacion-base.js
          echo 'SEPARACION SIMPLE 4-6 / TRADICIONAL 1-3 VERIFICADA'
      - name: Verificar endurecimiento de seguridad Supabase
        run: |
          set -euo pipefail
          test -f supabase/migrations/20261006_security_hardening_16_33_113.sql
          grep -q 'SECURITY INVOKER' supabase/migrations/20261006_security_hardening_16_33_113.sql
          grep -q "select lower(auth.jwt()->>'email')" supabase/migrations/20261006_security_hardening_16_33_113.sql
          grep -q 'REVOKE EXECUTE.*FROM PUBLIC, anon' supabase/migrations/20261006_security_hardening_16_33_113.sql
          echo 'MIGRACION DE SEGURIDAD PRESENTE Y VALIDADA'
      - name: Verificar que no existan cambios funcionales ocultos en el motor base
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch origin main --quiet
          diff="$(git diff --unified=0 origin/main...HEAD -- js/motor-liquidacion-base.js || true)"
          echo "$diff"
          if echo "$diff" | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -vE '^[+-]import .*\?v='; then
            echo 'ERROR: se detectó un cambio funcional no esperado en el motor base.'
            exit 1
          fi

  patch-pdf-nominal:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'ACTIVAR PDF NOMINAL')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Aplicar corrección de presentación y versionado
        run: |
          set -euo pipefail
          python - <<'PY2'
          from pathlib import Path
          R=Path('.'); A=R/'js/app.js'; T=R/'js/tdj.js'; U=R/'tests/regresion-ui.mjs'
          a=A.read_text(); t=T.read_text(); u=U.read_text()
          a=a.replace('${dinero(x.pago.valor)}','${dinero(valorNominalPagoPdf(x,d))}',1)
          t=t.replace('?"EXCEDENTE":"PAGO EN EXCESO"','?"EXCEDENTE DE TÍTULO":"PAGO EN EXCESO"',1)
          u=u.replace('const VERSION="16.33.113";','const VERSION="16.33.114";')
          u=u.replace('assert.match(tdjSrc,/EXCEDENTE":"PAGO EN EXCESO/);','assert.match(tdjSrc,/EXCEDENTE DE TÍTULO":"PAGO EN EXCESO/);')
          if 'assert.match(app,/function valorNominalPagoPdf\\(x,d\\)/);' not in u:
            u += '\nassert.match(app,/function valorNominalPagoPdf\\(x,d\\)/);\nassert.match(app,/valorNominalPagoPdf\\(x,d\\)/);\nassert.match(app,/EXCEDENTE DE TÍTULO/);\nassert.match(tdjSrc,/const original=\\(Array.isArray\\(o\\?\\.pagos\\)\\?o\\.pagos:\\[\\]\\)\\.find/);\nconsole.log("REGRESIÓN VALOR NOMINAL TÍTULO + EXCEDENTE OK");\n'
          A.write_text(a);T.write_text(t);U.write_text(u)
          skip={R/'.github/workflows/audit-estabilidad.yml',R/'supabase/migrations/20261006_security_hardening_16_33_113.sql'}
          for p in R.rglob('*'):
            if p.is_file() and '.git' not in p.parts and p not in skip and p.suffix.lower() in {'.js','.html','.css','.json','.yml','.yaml','.mjs','.txt'} and '.github/workflows' not in p.as_posix() and 'supabase/migrations' not in p.as_posix():
              try:s=p.read_text()
              except UnicodeDecodeError:continue
              if '16.33.113' in s:p.write_text(s.replace('16.33.113','16.33.114'))
          PY2
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --experimental-default-type=module tests/regresion-matematica.mjs
          node tests/regresion-ui.mjs
          grep -Fq 'VALOR PAGO &nbsp; → &nbsp; ${dinero(valorNominalPagoPdf(x,d))}' js/app.js
          grep -Fq 'EXCEDENTE DE TÍTULO' js/app.js
          grep -Fq 'function valorNominalPagoPdf(x,d)' js/app.js
          grep -Fq 'const original=(Array.isArray(o?.pagos)?o.pagos:[])' js/tdj.js
      - name: Publicar corrección en main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: valor nominal titulos PDF v16.33.114'
          git push origin HEAD:main
