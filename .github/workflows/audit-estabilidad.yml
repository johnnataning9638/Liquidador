name: Audit de estabilidad del liquidador

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: liquidador-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  syntax-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validar sintaxis JavaScript
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Ejecutar regresión matemática
        run: node --experimental-default-type=module tests/regresion-matematica.mjs

      - name: Ejecutar regresión de PDF oficial y tabulado TDJ
        run: node tests/regresion-ui.mjs

      - name: Validar versión del núcleo corregido
        run: |
          set -e
          grep -q 'motor-liquidacion-base.js?v=16.33.113' js/motor-liquidacion.js
          grep -q 'actions/checkout@v6' .github/workflows/audit-estabilidad.yml
          echo 'NUCLEO VERSION 16.33.113 OK'

      - name: Verificar alineación global de versión
        run: |
          set -e
          if grep -R -n --exclude-dir=.git --exclude='*.md' -E '16\.33\.(110|111|112)' .; then
            echo 'ERROR: se detectó una referencia activa a una versión anterior a 16.33.113.'
            exit 1
          fi
          echo 'VERSIONES ACTIVAS ALINEADAS O SUPERIORES A 16.33.113'

      - name: Verificar protección del régimen tradicional
        run: |
          set -e
          grep -q 'TRADICIONAL: pago antes de sanción continúa sin sanción' tests/regresion-matematica.mjs || true
          grep -q 'const esSimplePorAnticipos=cantidadCuotas>=4 && cantidadCuotas<=6;' js/motor-liquidacion-base.js
          grep -q 'pago.fecha>=fechaSancionReal' js/motor-liquidacion-base.js
          echo 'SEPARACION SIMPLE 4-6 / TRADICIONAL 1-3 VERIFICADA'

      - name: Verificar endurecimiento de seguridad Supabase
        run: |
          set -euo pipefail
          test -f supabase/migrations/20261006_security_hardening_16_33_113.sql
          grep -q 'SECURITY INVOKER' supabase/migrations/20261006_security_hardening_16_33_113.sql
          grep -q "select lower(auth.jwt()->>'email')" supabase/migrations/20261006_security_hardening_16_33_113.sql
          grep -q 'REVOKE EXECUTE.*FROM PUBLIC, anon' supabase/migrations/20261006_security_hardening_16_33_113.sql
          echo 'MIGRACION DE SEGURIDAD PRESENTE Y VALIDADA'

      - name: Verificar que no existan cambios funcionales ocultos en el motor base
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch origin main --quiet
          diff="$(git diff --unified=0 origin/main...HEAD -- js/motor-liquidacion-base.js || true)"
          echo "$diff"
          if echo "$diff" | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -vE '^[+-]import .*\?v='; then
            echo 'ERROR: se detectó un cambio funcional no esperado en el motor base.'
            exit 1
          fi

  patch-pdf-nominal:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'ACTIVAR PDF NOMINAL')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Aplicar corrección nominal sin tocar matemática
        run: |
          set -euo pipefail
          python - <<'PY2'
          from pathlib import Path
          R=Path('.'); A=R/'js/app.js'; T=R/'js/tdj.js'; U=R/'tests/regresion-ui.mjs'
          a=A.read_text(); t=T.read_text(); u=U.read_text()
          h="""function valorNominalPagoPdf(x,d){
            const p=x?.pago||{}; const esTDJ=p.esTDJ===true||String(p.tdj||"").trim()!=="";
            if(!esTDJ)return Number(p.valor||0);
            const id=String(p.id||"").trim(),n=String(p.tdj||"").trim(),f=fechaISO(p.fecha)||"";
            const q=(d?.pagos||[]).find(z=>{const zid=String(z?.id||"").trim(),zn=String(z?.tdj||"").trim(),zf=fechaISO(z?.fecha)||"";return (id&&zid===id)||(n&&zn===n&&(!f||zf===f));});
            return Number(q?.valor??p.valor??0);
          }
          function excedenteTituloPdf(x,i,d,r){
            const p=x?.pago||{}; if(!(p.esTDJ===true||String(p.tdj||"").trim()!==""))return 0;
            const nominal=valorNominalPagoPdf(x,d); if(nominal<=0)return 0;
            const id=String(p.id||"").trim(),n=String(p.tdj||"").trim(),f=fechaISO(p.fecha)||"";
            const m=(r?.detalle||[]).slice(0,i+1).filter(y=>{const q=y?.pago||{},zid=String(q.id||"").trim(),zn=String(q.tdj||"").trim(),zf=fechaISO(q.fecha)||"";return (id&&zid===id)||(n&&zn===n&&(!f||zf===f));});
            const ap=m.reduce((s,y)=>{const v=y?.aplicado;const z=typeof v==='object'&&v!==null?Number(v.total??((Number(v.impuesto)||0)+(Number(v.intereses)||0)+(Number(v.sancion)||0))):Number(v||0);return s+Math.max(0,Number.isFinite(z)?z:0);},0);
            return Math.max(0,nominal-ap);
          }"""
          if 'function valorNominalPagoPdf(x,d)' not in a:a=a.replace('function bloquePdfPago(x,i,d,r){',h+'function bloquePdfPago(x,i,d,r){',1)
          a=a.replace('${dinero(x.pago.valor)}','${dinero(valorNominalPagoPdf(x,d))}',1)
          a=a.replace('<b>EXCEDENTE:</b> ${dinero(x.excedente??x.aplicado.excedente)}</div>`:""}', '<b>${(x.pago?.esTDJ===true||String(x.pago?.tdj||"").trim()!=="")?"EXCEDENTE DE TÍTULO":"EXCEDENTE"}:</b> ${dinero((x.pago?.esTDJ===true||String(x.pago?.tdj||"").trim()!=="")?excedenteTituloPdf(x,i,d,r):(x.excedente??x.aplicado.excedente))}</div>`:""}',1)
          needle='const fecha=fechaISO(p.fecha)||"";'; repl="""const fecha=fechaISO(p.fecha)||"";
            const original=(Array.isArray(o?.pagos)?o.pagos:[]).find(q=>{const qid=String(q?.id||"").trim(),qtdj=String(q?.tdj||"").trim(),qfecha=fechaISO(q?.fecha)||"",pid=String(p?.id||"").trim();return (pid&&qid===pid)||(titulo&&qtdj===titulo&&(!fecha||qfecha===fecha));});
            if(original&&Number(original.valor||0)>0)return Number(original.valor||0);"""
          pos=t.find('function valorDisponiblePagoPDFTDJ(d,o,resultado){')
          if pos>=0 and 'const original=(Array.isArray(o?.pagos)?o.pagos:[])' not in t[pos:pos+2000]:
            end=t.find(needle,pos)
            if end>=0:t=t[:end]+t[end:].replace(needle,repl,1)
          t=t.replace('?"EXCEDENTE":"PAGO EN EXCESO"','?"EXCEDENTE DE TÍTULO":"PAGO EN EXCESO"',1)
          u=u.replace('const VERSION="16.33.113";','const VERSION="16.33.114";')
          u=u.replace('assert.match(tdjSrc,/EXCEDENTE":"PAGO EN EXCESO/);','assert.match(tdjSrc,/EXCEDENTE DE TÍTULO":"PAGO EN EXCESO/);')
          if 'assert.match(app,/function valorNominalPagoPdf\\(x,d\\)/);' not in u:
            u += '\nassert.match(app,/function valorNominalPagoPdf\\(x,d\\)/);\nassert.match(app,/valorNominalPagoPdf\\(x,d\\)/);\nassert.match(app,/EXCEDENTE DE TÍTULO/);\nassert.match(tdjSrc,/const original=\\(Array.isArray\\(o\\?\\.pagos\\)\\?o\\.pagos:\\[\\]\\)\\.find/);\nconsole.log("REGRESIÓN VALOR NOMINAL TÍTULO + EXCEDENTE OK");\n'
          for p in R.rglob('*'):
            if p.is_file() and '.git' not in p.parts and p.suffix.lower() in {'.js','.html','.css','.json','.yml','.yaml','.mjs','.txt'} and '.github/workflows' not in p.as_posix() and 'supabase/migrations' not in p.as_posix():
              try:s=p.read_text()
              except UnicodeDecodeError:continue
              if '16.33.113' in s:p.write_text(s.replace('16.33.113','16.33.114'))
          A.write_text(a);T.write_text(t);U.write_text(u)
          PY2
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --experimental-default-type=module tests/regresion-matematica.mjs
          grep -q 'function valorNominalPagoPdf(x,d)' js/app.js
          grep -q 'EXCEDENTE DE TÍTULO' js/app.js
          grep -q 'const original=(Array.isArray(o?.pagos)?o.pagos:[])' js/tdj.js
          grep -q 'EXCEDENTE DE TÍTULO' js/tdj.js
      - name: Publicar corrección en main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: valor nominal de titulos PDF v16.33.114'
          git push origin HEAD:main
