name: Audit de estabilidad del liquidador

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  syntax-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Corregir imputación de sanción SIMPLE
        run: |
          set -e
          python -c 'from pathlib import Path; p=Path("js/motor-liquidacion.js"); s=p.read_text(encoding="utf-8"); old="""      const vtoSancion=vtosConSaldoRestante[0] ||\n        (Number(saldoSancion||0)>0 ? vencimientosExigibles[0] : null);"""; new="""      const vtoSancion=vtosConSaldoRestante[0] ||\n        (Number(saldoSancion||0)>0\n          ? (esSimplePorAnticipos ? saldosVto[0] : vencimientosExigibles[0])\n          : null);"""; assert old in s, "No se encontró el bloque de sanción SIMPLE esperado"; p.write_text(s.replace(old,new,1),encoding="utf-8")'

      - name: Agregar regresión SIMPLE extemporáneo
        run: |
          set -e
          if ! grep -q "anticipo antes de presentación incluye sanción" tests/regresion-matematica.mjs; then
            sed -i '/console\.log(`REGRESION MATEMATICA OK — ${passed} ASERCIONES`);/i\
// SIMPLE EXTEMPORÁNEO: declaración anual presentada con sanción.\
for (const count of [4, 5, 6]) {\
  const r = motor().calcular({\
    ...obligation({ count, paymentDate: "2026-02-01", paymentValue: 100000 }),\
    fechaSancion: "2026-04-03"\
  });\
  ok(`SIMPLE ${count} cuotas: anticipo antes de presentación incluye sanción`, r.detalle[0].aplicado.sancion > 0);\
}\
\
const tradicionalAntesDeSancion = motor().calcular({\
  ...obligation({ count: 1, paymentDate: "2026-02-01", paymentValue: 100000 }),\
  fechaSancion: "2026-04-03"\
});\
ok("TRADICIONAL: pago antes de sanción continúa sin sanción", tradicionalAntesDeSancion.detalle[0].aplicado.sancion === 0);\
' tests/regresion-matematica.mjs
          fi

      - name: Sincronizar version global
        run: |
          set -e
          VERSION="16.33.111"
          find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.mjs' -o -name '*.css' -o -name '*.yml' -o -name '*.yaml' \) -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            sed -E -i "s/16\\.33\\.[0-9]+/${VERSION}/g" "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "VERSION_GLOBAL_OK=${VERSION}"
          else
            git commit -m "chore: sincronizar version global ${VERSION}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Validar sintaxis JavaScript
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Ejecutar regresión matemática
        run: node --experimental-default-type=module tests/regresion-matematica.mjs

      - name: Ejecutar regresión de PDF oficial y tabulado TDJ
        run: node tests/regresion-ui.mjs

      - name: Validar versionado global
        run: |
          set -e
          VERSION="16.33.111"
          grep -q "js/app.js?v=${VERSION}" liquidacion.html
          grep -q "js/tdj.js?v=${VERSION}" titulos.html
          grep -q "estilos.css?v=${VERSION}" liquidacion.html
          grep -q "estilos.css?v=${VERSION}" titulos.html
          grep -q "tdj-mobile.css?v=${VERSION}" titulos.html
          refs="$(grep -RhoE '\?v=[0-9]+(\.[0-9]+){0,2}' js liquidacion.html titulos.html index.html estilos.css tdj-mobile.css | sort -u || true)"
          if [ -n "$refs" ]; then
            while IFS= read -r ref; do
              [ "$ref" = "?v=${VERSION}" ] || { echo "ERROR: referencia de version incompatible: $ref"; exit 1; }
            done <<< "$refs"
          fi
          echo "VERSIONADO GLOBAL OK — ${VERSION}"

      - name: Verificar que los motores no tengan cambios funcionales
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch origin main --quiet
          for f in js/motor-liquidacion.js js/motor-liquidacion-oficial.js; do
            diff="$(git diff --unified=0 origin/main...HEAD -- "$f" || true)"
            echo "$diff"
            if echo "$diff" | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -vE '^[+-]import .*\?v='; then
              echo "ERROR: se detectó un cambio funcional en $f."
              exit 1
            fi
          done