name: Audit de estabilidad del liquidador

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  syntax-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar ajuste exclusivo Excel 161
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'activar ajuste Excel 161')
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          files=[Path('js/app.js'),Path('js/tdj-core-16.33.143.js')]
          for p in files:
              s=p.read_text(encoding='utf-8')
              old='const cols=Array.from({length:lastCol},(_,i)=>`<col min="${i+1}" max="${i+1}" width="${Number(columnWidths[i]||16)}" customWidth="1"/>`).join("");'
              new='''const valueCols=new Set([
    ...moneyCols,
    ...percentCols,
    ...Object.values(rowMoneyCols||{}).flatMap(v=>Array.isArray(v)?v:[]),
    ...Object.values(rowPercentCols||{}).flatMap(v=>Array.isArray(v)?v:[])
  ].map(Number));
  const excelWidths=Array.from({length:lastCol},(_,i)=>Math.max(10,Number(columnWidths[i]||16)+(valueCols.has(i+1)?4:0)));
  const cols=excelWidths.map((width,i)=>`<col min="${i+1}" max="${i+1}" width="${width}" customWidth="1"/>`).join("");'''
              if old not in s: raise SystemExit(f'No se encontró bloque de anchos en {p}')
              s=s.replace(old,new,1)
              oldh='const title=titleRows.includes(i),header=headerRows.includes(i),height=title?24:(header?20:18);'
              newh='''const title=titleRows.includes(i),header=headerRows.includes(i);
    const maxLines=Math.max(1,...row.map((v,j)=>{
      const texto=String(v??"");
      const ancho=Math.max(10,excelWidths[j]||16);
      const caracteresPorLinea=Math.max(8,Math.floor(ancho*1.05));
      return Math.ceil(Math.max(1,texto.length)/caracteresPorLinea);
    }));
    const height=title?24:(header?Math.min(45,Math.max(20,18+(maxLines-1)*9)):Math.min(60,Math.max(18,18+(maxLines-1)*12)));'''
              if oldh not in s: raise SystemExit(f'No se encontró bloque de altura en {p}')
              s=s.replace(oldh,newh,1)
              s=s.replace('v=16.33.160','v=16.33.161')
              p.write_text(s,encoding='utf-8')
          for p in [Path('liquidacion.html'),Path('titulos.html'),Path('js/tdj.js'),Path('js/prioridad-tdj-v132.js')]:
              s=p.read_text(encoding='utf-8').replace('v=16.33.160','v=16.33.161')
              p.write_text(s,encoding='utf-8')
          PY
          cat > tests/regresion-excel-dimensiones-161.mjs <<'EOF'
          import fs from 'node:fs';
          const app=fs.readFileSync('js/app.js','utf8');
          const tdj=fs.readFileSync('js/tdj-core-16.33.143.js','utf8');
          for(const [name,s] of [['DIAN',app],['TDJ',tdj]]){
            if(!s.includes('valueCols=new Set')) throw new Error(`${name}: falta ampliación de columnas de valor`);
            if(!s.includes('const excelWidths=')) throw new Error(`${name}: falta cálculo de anchos`);
            if(!s.includes('Math.min(60')) throw new Error(`${name}: falta altura adaptativa`);
            if(!s.includes('customHeight="1"')) throw new Error(`${name}: falta altura personalizada`);
            if(!s.includes('16.33.161')) throw new Error(`${name}: versión 161 ausente`);
          }
          for(const f of ['liquidacion.html','titulos.html','js/tdj.js','js/prioridad-tdj-v132.js']){
            if(!fs.readFileSync(f,'utf8').includes('16.33.161')) throw new Error(`${f}: versión 161 ausente`);
          }
          console.log('REGRESION EXCEL 16.33.161 OK — anchos de valores + alturas adaptativas; sin cambios de datos');
          EOF
      - name: Validar sintaxis JavaScript
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Ejecutar regresiones históricas y de importadores
        run: |
          set -e
          node tests/regresion-parametros-160.mjs
          node tests/regresion-exportacion-excel-158.mjs
          if [ -f tests/regresion-excel-dimensiones-161.mjs ]; then node tests/regresion-excel-dimensiones-161.mjs; fi
          node tests/regresion-secuencia-tdj-129.mjs
          node tests/regresion-prioridad-pagos-tdj-130.mjs
          node tests/regresion-idempotencia-tdj-132.mjs
          node tests/regresion-saldo-final-134.mjs
          node tests/regresion-importadores-decimales-145.mjs
          node tests/regresion-simbolo-peso-importadores-146.mjs
          node tests/regresion-secuencia-tdj-151.mjs
          node tests/regresion-secuencia-tdj-152.mjs
      - name: Verificar integridad del motor de liquidación
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch origin main --quiet
          for f in js/motor-liquidacion.js js/motor-liquidacion-oficial.js; do
            diff="$(git diff --unified=0 origin/main...HEAD -- "$f" || true)"
            echo "$diff"
            if echo "$diff" | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -vE '^[+-]import .*\\?v='; then
              echo "ERROR: se detectó un cambio funcional en $f."
              exit 1
            fi
          done
      - name: Verificar controles de cálculo DIAN
        run: |
          set -e
          test "$(grep -o 'class=\"[^\"]*btn-calcular-normal[^\"]*\"' liquidacion.html | wc -l)" -eq 3
          grep -q 'querySelectorAll(\".btn-calcular-normal\").*addEventListener(\"click\",calcular)' js/app.js
      - name: Publicar corrección Excel 161 y restaurar auditoría read-only
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'activar ajuste Excel 161')
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/audit-estabilidad.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('permissions:\n  contents: write','permissions:\n  contents: read')
          start=s.index('      - name: Aplicar ajuste exclusivo Excel 161\n')
          end=s.index('      - name: Validar sintaxis JavaScript\n',start)
          s=s[:start]+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/correctivo-excel-161.yml .github/excel161-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js liquidacion.html titulos.html tests/regresion-excel-dimensiones-161.mjs .github/workflows/audit-estabilidad.yml .github/workflows/correctivo-excel-161.yml .github/excel161-trigger.txt
          git commit -m 'feat: ajustar dimensiones Excel v16.33.161'
          git push origin main
