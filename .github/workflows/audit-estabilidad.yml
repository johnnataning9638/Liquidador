name: Audit de estabilidad del liquidador

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

jobs:
  syntax-and-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar corrección aislada de SIMPLE
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]' && hashFiles('.github/workflows/_fix_simple_sancion_once.yml') != '' && hashFiles('.github/workflows/_simple_fix_trigger.txt') != ''
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          def replace_simple(path):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              old='''      const sancionHabilitadaPorFecha=esSimplePorAnticipos
        ? (!fechaSancionReal || pago.fecha>=fechaSancionReal)
        : (
            datos.tieneSancion==="SI"
            && sancionBaseOriginal>0
            && Boolean(fechaSancionReal)
            && pago.fecha>=fechaSancionReal
          );'''
              new='''      const sancionHabilitadaPorFecha=esSimplePorAnticipos
        ? true
        : (
            datos.tieneSancion==="SI"
            && sancionBaseOriginal>0
            && Boolean(fechaSancionReal)
            && pago.fecha>=fechaSancionReal
          );'''
              if s.count(old) != 1:
                  raise SystemExit(f'Regla SIMPLE inesperada en {path}: coincidencias={s.count(old)}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          replace_simple('js/motor-liquidacion.js')
          replace_simple('js/motor-liquidacion-oficial.js')

          p=Path('tests/regresion-matematica.mjs')
          s=p.read_text(encoding='utf-8')
          old='''// SIMPLE 4–6 cuotas: NO se modifica con la nueva regla de TRADICIONAL.
// Se conserva la lógica SIMPLE existente para un pago anterior a fecha de sanción.
for (const count of [4, 5, 6]) {
  const r = motor().calcular(obligation({ count, paymentDate: "2025-12-31", paymentValue: 100000 }));
  ok(`SIMPLE ${count} cuotas: conserva lógica existente antes de fecha de sanción`, r.detalle[0].aplicado.sancion === 0);
}

'''
          new='''// SIMPLE 4–6 cuotas: todos los anticipos participan en la sanción cuando
// la obligación tiene sanción declarada, incluso el primer anticipo antes de
// la fecha de presentación/sanción. Esta lógica es independiente de la regla
// nueva del régimen tradicional.
for (const count of [4, 5, 6]) {
  const r = motor().calcular(obligation({ count, paymentDate: "2025-12-31", paymentValue: 100000 }));
  ok(`SIMPLE ${count} cuotas: el anticipo conserva sanción antes de fecha de sanción`, r.detalle[0].aplicado.sancion > 0);
}

'''
          if s.count(old) != 1:
              raise SystemExit(f'Bloque de regresión SIMPLE inesperado: coincidencias={s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          node --check js/motor-liquidacion.js
          node --check js/motor-liquidacion-oficial.js
          node --check tests/regresion-matematica.mjs
          node --experimental-default-type=module tests/regresion-matematica.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/motor-liquidacion.js js/motor-liquidacion-oficial.js tests/regresion-matematica.mjs
          git rm .github/workflows/_fix_simple_sancion_once.yml .github/workflows/_simple_fix_trigger.txt
          git commit -m 'fix: preservar sancion en anticipos del regimen SIMPLE'
          git push origin main

      - name: Validar sintaxis JavaScript
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Ejecutar regresión matemática
        run: node --experimental-default-type=module tests/regresion-matematica.mjs

      - name: Ejecutar regresión de PDF oficial y tabulado TDJ
        run: node tests/regresion-ui.mjs

      - name: Validar versionado de módulos
        run: |
          set -e
          grep -q 'js/app.js?v=16.33.103' liquidacion.html
          grep -q 'js/tdj.js?v=16.33.107' titulos.html
          if grep -R -nF '?v=' js | grep -Ev '16\.33\.(103|104)'; then
            echo "ERROR: quedan imports locales con versionado anterior."
            exit 1
          fi

      - name: Verificar que los motores no tengan cambios funcionales
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch origin main --quiet
          for f in js/motor-liquidacion.js js/motor-liquidacion-oficial.js; do
            diff="$(git diff --unified=0 origin/main...HEAD -- "$f" || true)"
            echo "$diff"
            if echo "$diff" | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -vE '^[+-]import .*\?v='; then
              echo "ERROR: se detectó un cambio funcional en $f."
              exit 1
            fi
          done
