name: Audit de estabilidad del liquidador

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  tdj-hotfix-experimental:
    if: github.event_name == 'push' && github.ref == 'refs/heads/audit/tdj-art9-juanca-204'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/tdj-art9-juanca-204
          persist-credentials: true
      - name: Aplicar parche aislado
        run: python3 scripts/tdj-hotfix-204.py
      - name: Comprobar sintaxis y regresión del caso reportado
        run: |
          node --check js/tdj-core-16.33.143.js
          node tests/regresion-tdj-beneficios-203.mjs
          node tests/regresion-endoso-tdj-202.mjs
          node tests/regresion-secuencia-tdj-129.mjs
      - name: Incorporar solo si pasan pruebas en rama de auditoría
        run: |
          if git diff --quiet -- js/tdj-core-16.33.143.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/tdj-core-16.33.143.js
          git commit -m 'fix(tdj): preservar valores del motor en recálculo v16.33.204'
          git push origin HEAD:audit/tdj-art9-juanca-204

  syntax-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar sintaxis JavaScript
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Ejecutar regresiones vigentes
        run: |
          set -e
          node tests/regresion-tdj-beneficios-203.mjs
          node tests/regresion-endoso-tdj-202.mjs
          node tests/regresion-exportacion-excel-161.mjs
          node tests/regresion-secuencia-tdj-129.mjs
          node tests/regresion-prioridad-pagos-tdj-130.mjs
          node tests/regresion-idempotencia-tdj-132.mjs
          node tests/regresion-saldo-final-134.mjs
          node tests/regresion-importadores-decimales-145.mjs
          node tests/regresion-simbolo-peso-importadores-146.mjs
          node tests/regresion-secuencia-tdj-151.mjs
          node tests/regresion-secuencia-tdj-152.mjs
          node tests/regresion-tdj-174.mjs
          node tests/regresion-tdj-175.mjs
          node tests/regresion-tdj-176.mjs
          node tests/regresion-tdj-177.mjs
      - name: Verificar integridad del motor de liquidación
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch origin main --quiet
          for f in js/motor-liquidacion.js js/motor-liquidacion-oficial.js; do
            diff="$(git diff --unified=0 origin/main...HEAD -- "$f" || true)"
            echo "$diff"
            if echo "$diff" | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -vE '^[+-]import .*\\?v='; then
              echo "ERROR: se detectó un cambio funcional en $f."
              exit 1
            fi
          done
      - name: Verificar controles de cálculo DIAN
        run: |
          set -e
          test "$(grep -o 'class=\"[^\"]*btn-calcular-normal[^\"]*\"' liquidacion.html | wc -l)" -eq 3
          grep -q 'querySelectorAll(\".btn-calcular-normal\").*addEventListener(\"click\",calcular)' js/app.js

  live-tdj-smoke:
    needs: syntax-and-integrity
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verificar recursos TDJ 177 en Render LIVE
        run: node tests/live-resource-177.mjs
      - name: Diagnóstico directo prioridad TDJ4 177
        run: node tests/live-diagnostic-sequence-177.mjs
      - name: Ejecutar caso crítico TDJ en Render LIVE
        run: node tests/live-tdj-177-final.mjs
