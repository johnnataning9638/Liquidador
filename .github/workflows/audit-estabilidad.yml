name: Audit de estabilidad del liquidador

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  syntax-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar rediseño Excel v16.33.158 — solo con disparador
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .excel158-trigger ]; then exit 0; fi
          python3 scripts/redesign_excel_158.py
          node --check js/app.js
          node --check js/tdj-core-16.33.143.js
          node --check js/tdj.js
          node --check js/prioridad-tdj-v132.js
          node tests/regresion-exportacion-excel-158.mjs
          node tests/regresion-secuencia-tdj-152.mjs
          node tests/regresion-secuencia-tdj-151.mjs
          node tests/regresion-prioridad-pagos-tdj-130.mjs
          node tests/regresion-idempotencia-tdj-132.mjs
          node tests/regresion-saldo-final-134.mjs
          node tests/regresion-importadores-decimales-145.mjs
          node tests/regresion-simbolo-peso-importadores-146.mjs
          if git diff --name-only | grep -E '^(js/motor-liquidacion\.js|js/motor-liquidacion-oficial\.js|js/motor-liquidacion-base\.js)$'; then echo 'ERROR: motor modificado'; exit 1; fi
          rm -f .excel158-trigger
          sed -i 's/contents: write/contents: read/' .github/workflows/audit-estabilidad.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js liquidacion.html titulos.html scripts/redesign_excel_158.py tests/regresion-exportacion-excel-158.mjs .github/workflows/audit-estabilidad.yml
          git commit -m 'feat: rediseñar exportación Excel estilo PDF v16.33.158'
          git push

      - name: Validar sintaxis JavaScript
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Ejecutar regresiones históricas y de importadores
        run: |
          set -e
          node tests/regresion-secuencia-tdj-129.mjs
          node tests/regresion-prioridad-pagos-tdj-130.mjs
          node tests/regresion-idempotencia-tdj-132.mjs
          node tests/regresion-saldo-final-134.mjs
          node tests/regresion-importadores-decimales-145.mjs
          node tests/regresion-simbolo-peso-importadores-146.mjs
          node tests/regresion-secuencia-tdj-151.mjs
          node tests/regresion-secuencia-tdj-152.mjs
      - name: Verificar integridad del motor de liquidación
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch origin main --quiet
          for f in js/motor-liquidacion.js js/motor-liquidacion-oficial.js; do
            diff="$(git diff --unified=0 origin/main...HEAD -- "$f" || true)"
            echo "$diff"
            if echo "$diff" | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -vE '^[+-]import .*\\?v='; then
              echo "ERROR: se detectó un cambio funcional en $f."
              exit 1
            fi
          done
      - name: Verificar controles de cálculo DIAN
        run: |
          set -e
          test "$(grep -o 'class=\"[^\"]*btn-calcular-normal[^\"]*\"' liquidacion.html | wc -l)" -eq 3
          grep -q 'querySelectorAll(\".btn-calcular-normal\").*addEventListener(\"click\",calcular)' js/app.js
