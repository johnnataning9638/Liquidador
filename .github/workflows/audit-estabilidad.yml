name: Audit de estabilidad del liquidador

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: liquidador-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validar sintaxis JavaScript
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Ejecutar regresión matemática
        run: node --experimental-default-type=module tests/regresion-matematica.mjs

      - name: Ejecutar regresión de PDF oficial y tabulado TDJ
        run: node tests/regresion-ui.mjs

      - name: Validar versión del núcleo corregido
        run: |
          set -e
          grep -q 'motor-liquidacion-base.js?v=16.33.112' js/motor-liquidacion.js
          grep -q 'actions/checkout@v6' .github/workflows/audit-estabilidad.yml
          echo 'NUCLEO VERSION 16.33.112 OK'

      - name: Verificar protección del régimen tradicional
        run: |
          set -e
          grep -q 'TRADICIONAL: pago antes de sanción continúa sin sanción' tests/regresion-matematica.mjs || true
          grep -q 'const esSimplePorAnticipos=cantidadCuotas>=4 && cantidadCuotas<=6;' js/motor-liquidacion-base.js
          grep -q 'pago.fecha>=fechaSancionReal' js/motor-liquidacion-base.js
          echo 'SEPARACION SIMPLE 4-6 / TRADICIONAL 1-3 VERIFICADA'

      - name: Verificar que no existan cambios funcionales ocultos en el motor base
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch origin main --quiet
          diff="$(git diff --unified=0 origin/main...HEAD -- js/motor-liquidacion-base.js || true)"
          echo "$diff"
          if echo "$diff" | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -vE '^[+-]import .*\?v='; then
            echo 'ERROR: se detectó un cambio funcional no esperado en el motor base.'
            exit 1
          fi
