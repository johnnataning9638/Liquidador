name: Audit de estabilidad del liquidador

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'tests/.trigger-pdf-layout-122'
  pull_request:
    branches: ["main"]

concurrency:
  group: liquidador-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  syntax-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Aplicar actualización aprobada Art. 9 D1419 v16.33.127
        if: github.event_name == 'push'
        run: python3 scripts/apply-art9-fix-v16-33-127.py

      - name: Validar sintaxis JavaScript
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Ejecutar regresión matemática
        run: node --experimental-default-type=module tests/regresion-matematica.mjs

      - name: Ejecutar regresión de PDF oficial y tabulado TDJ
        run: node tests/regresion-ui.mjs

      - name: Ejecutar regresión de detalle de intereses por fecha de corte
        run: node tests/regresion-detalle-intereses-corte.mjs

      - name: Ejecutar regresión específica TDJ fecha de corte en pagos
        run: node tests/regresion-fecha-corte-pagos-tdj.mjs

      - name: Ejecutar regresión Art. 9 Decreto 1419
        run: node scripts/test-art9-v16-33-127.mjs

      - name: Validar versión del núcleo corregido
        run: |
          set -e
          grep -q 'motor-liquidacion-base.js?v=16.33.127' js/motor-liquidacion.js
          grep -q 'actions/checkout@v6' .github/workflows/audit-estabilidad.yml
          echo 'NUCLEO VERSION 16.33.127 OK'

      - name: Verificar alineación global de versión
        run: |
          set -e
          if grep -R -n --exclude-dir=.git --exclude='*.md' --exclude='20261006_security_hardening_16_33_113.sql' -E '16\.33\.(110|111|112|113|114|115|116|117|118|119|120|121|122|123|124|125|126)' js tests index.html liquidacion.html titulos.html estilos.css; then
            echo 'ERROR: se detectó una referencia activa a una versión anterior a 16.33.127.'
            exit 1
          fi
          echo 'VERSIONES ACTIVAS ALINEADAS O SUPERIORES A 16.33.127'

      - name: Verificar protección del régimen tradicional
        run: |
          set -e
          grep -q 'const esSimplePorAnticipos=cantidadCuotas>=4 && cantidadCuotas<=6;' js/motor-liquidacion-base.js
          grep -q 'pago.fecha>=fechaSancionReal' js/motor-liquidacion-base.js
          echo 'SEPARACION SIMPLE 4-6 / TRADICIONAL 1-3 VERIFICADA'

      - name: Verificar endurecimiento de seguridad Supabase
        run: |
          set -euo pipefail
          test -f supabase/migrations/20261006_security_hardening_16_33_113.sql
          grep -q 'SECURITY INVOKER' supabase/migrations/20261006_security_hardening_16_33_113.sql
          grep -q "select lower(auth.jwt()->>'email')" supabase/migrations/20261006_security_hardening_16_33_113.sql
          grep -q 'REVOKE EXECUTE.*FROM PUBLIC, anon' supabase/migrations/20261006_security_hardening_16_33_113.sql
          echo 'MIGRACION DE SEGURIDAD PRESENTE Y VALIDADA'

      - name: Commit de la actualización validada
        if: github.event_name == 'push'
        run: |
          set -e
          if git diff --quiet -- js/motor-liquidacion-base.js js/motor-liquidacion.js js/app.js liquidacion.html RELEASES/16.33.127.md; then
            echo 'No hay cambios de aplicación pendientes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/motor-liquidacion-base.js js/motor-liquidacion.js js/app.js liquidacion.html RELEASES/16.33.127.md
          git diff --cached --check
          git commit -m 'fix: Art. 9 Decreto 1419 sanction balance v16.33.127'
          git push
