name: package-source
on:
  push:
    paths:
      - '.github/workflows/package-source.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source ZIP
        run: zip -r Liquidador-codigo-main.zip . -x '.git/*' '.github/workflows/package-source.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: Liquidador-codigo-main
          path: Liquidador-codigo-main.zip
