name: one-time version 16.33.132
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, 'cache-bust 16.33.132') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar referencias de idempotencia TDJ
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('js/app.js')
          s=p.read_text()
          s=s.replace('./prioridad-tdj.js?v=16.33.131','./prioridad-tdj-v132.js?v=16.33.132')
          p.write_text(s)

          p=Path('js/tdj.js')
          s=p.read_text()
          s=s.replace('./prioridad-tdj.js?v=16.33.131','./prioridad-tdj-v132.js?v=16.33.132')
          s=s.replace('./prioridad-tdj.js?v=16.33.123','./prioridad-tdj-v132.js?v=16.33.132')
          p.write_text(s)

          p=Path('liquidacion.html')
          s=p.read_text()
          s=s.replace('versión 16.33.131','versión 16.33.132')
          s=s.replace('js/app.js?v=16.33.131','js/app.js?v=16.33.132')
          p.write_text(s)

          p=Path('.github/workflows/one-time-version-132.yml')
          p.unlink()
          PY
      - name: Commit final y retirar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj.js liquidacion.html .github/workflows/one-time-version-132.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: cache-bust 16.33.132 idempotencia TDJ'
          git push
