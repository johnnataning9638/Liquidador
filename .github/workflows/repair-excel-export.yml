name: Reparar exportacion Excel
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir inicializacion Excel DIAN y TDJ
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          WIDTH = '''  const valueCols=new Set([\n    ...moneyCols,\n    ...percentCols,\n    ...Object.values(rowMoneyCols||{}).flatMap(v=>Array.isArray(v)?v:[]),\n    ...Object.values(rowPercentCols||{}).flatMap(v=>Array.isArray(v)?v:[])\n  ].map(Number));\n  const excelWidths=Array.from({length:lastCol},(_,i)=>Math.max(10,Number(columnWidths[i]||16)+(valueCols.has(i+1)?4:0)));\n  const cols=excelWidths.map((width,i)=>`<col min="${i+1}" max="${i+1}" width="${width}" customWidth="1"/>`).join("");\n'''
          for name in ['js/app.js','js/tdj-core-16.33.143.js']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              start=s.find('  const valueCols=new Set([')
              end=s.find('  const autoMerges=titleRows.filter', start)
              if start<0 or end<0: raise SystemExit(f'{name}: bloque de anchos no encontrado')
              s=s[:start]+s[end:]
              body=s.find('  const body=safeRows.map((r,i)=>{')
              if body<0: raise SystemExit(f'{name}: body no encontrado')
              s=s[:body]+WIDTH+s[body:]
              s=s.replace('v=16.33.160','v=16.33.161')
              p.write_text(s,encoding='utf-8')
          for name in ['js/tdj.js','js/prioridad-tdj-v132.js','liquidacion.html','titulos.html']:
              p=Path(name); p.write_text(p.read_text(encoding='utf-8').replace('v=16.33.160','v=16.33.161'),encoding='utf-8')
          for name in ['tests/regresion-parametros-160.mjs','tests/regresion-exportacion-excel-158.mjs']:
              p=Path(name); p.write_text(p.read_text(encoding='utf-8').replace('16.33.160','16.33.161'),encoding='utf-8')
          Path('tests/regresion-excel-export-161.mjs').write_text('''import fs from "node:fs";\nimport assert from "node:assert/strict";\nfor (const [name,file] of [["DIAN","js/app.js"],["TDJ","js/tdj-core-16.33.143.js"]]) {\n  const s=fs.readFileSync(file,"utf8");\n  const v=s.indexOf("  const valueCols=new Set([");\n  const e=s.indexOf("  const excelWidths=");\n  const b=s.indexOf("  const body=safeRows.map((r,i)=>{");\n  assert.ok(v>=0 && e>v && b>e, `${name}: excelWidths debe inicializarse antes de body`);\n  assert.ok(s.includes("Math.min(60"), `${name}: falta altura adaptativa`);\n  assert.ok(s.includes("customHeight=\\\"1\\\""), `${name}: falta altura personalizada`);\n  assert.ok(s.includes("16.33.161"), `${name}: version 161 ausente`);\n}\nconsole.log("REGRESION EXPORTACION EXCEL 161 OK — excelWidths inicializado antes del body");\n''',encoding='utf-8')
          PY
      - name: Ejecutar pruebas antes de publicar
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/regresion-parametros-160.mjs
          node tests/regresion-exportacion-excel-158.mjs
          node tests/regresion-excel-export-161.mjs
          node tests/regresion-importadores-decimales-145.mjs
          node tests/regresion-simbolo-peso-importadores-146.mjs
          node tests/regresion-secuencia-tdj-151.mjs
          node tests/regresion-secuencia-tdj-152.mjs
      - name: Publicar y limpiar correctivos temporales
        run: |
          set -e
          rm -f .github/workflows/repair-excel-export.yml .github/workflows/correctivo-excel-export-162.yml .github/excel-export-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/tdj-core-16.33.143.js js/tdj.js js/prioridad-tdj-v132.js liquidacion.html titulos.html tests/regresion-parametros-160.mjs tests/regresion-exportacion-excel-158.mjs tests/regresion-excel-export-161.mjs .github/workflows/repair-excel-export.yml .github/workflows/correctivo-excel-export-162.yml .github/excel-export-trigger.txt
          git commit -m 'fix: corregir exportacion Excel v16.33.161'
          git push origin main
