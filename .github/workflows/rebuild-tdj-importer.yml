name: Rebuild TDJ importer

on:
  push:
    branches: [rebuild/importador-tdj-109]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild/importador-tdj-109
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify rebuilt importer is present
        shell: bash
        run: |
          grep -q 'reconstruirTitulosTDJDesdeFilas' js/tdj.js
          grep -q 'if(!tdjTxt||!f||v<=0)return false;' js/tdj.js
          grep -q 'tdj.js?v=16.33.109' titulos.html
      - name: Syntax and regression checks
        shell: bash
        run: |
          node --check js/importador-tdj.js
          node --check js/tdj.js
          node --check js/importador-excel.js
          node tests/importador-tdj.mjs
      - name: Commit workflow cleanup
        shell: bash
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rebuild-tdj-importer.yml tests/importador-tdj.mjs
          git diff --cached --quiet || git commit -m "test: validar importador TDJ reconstruido"
          git push origin HEAD:rebuild/importador-tdj-109
