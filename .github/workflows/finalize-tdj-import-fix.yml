name: Finalize TDJ import fix
on:
  push:
    branches:
      - fix/tdj-doc-source-10-15
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tdj-doc-source-10-15
      - name: Preserve TDJ behavior and extend regression
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/tdj.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('    ordenarTitulosCronologicamente();\n    renderTitulos();\n    $("importarTitulosTexto").value="";', '    ordenarTitulosCronologicamente();\n    resultado=null;\n    $("resultadoTDJ").hidden=true;\n    renderTitulos();\n    $("importarTitulosTexto").value="";', 1)
          s=s.replace('    ordenarTitulosCronologicamente();\n    renderTitulos();\n    $("importarTitulosTexto").value="";\n    $("resultadoImportacionTitulos").textContent=`IA DIAN', '    ordenarTitulosCronologicamente();\n    resultado=null;\n    $("resultadoTDJ").hidden=true;\n    renderTitulos();\n    $("importarTitulosTexto").value="";\n    $("resultadoImportacionTitulos").textContent=`IA DIAN', 1)
          s=s.replace('Math.round(Number(ai?.confidence||1)*100)', 'Math.round(Number(ai?.confidence||0)*100)', 1)
          p.write_text(s,encoding='utf-8')

          t=Path('tests/tdj-importador-documento-fuente.mjs')
          ts=t.read_text(encoding='utf-8')
          ts += '''\nconst sinEncabezado=`4911089297230\\t1\\tRecibo Oficial\\t5/03/2026\\tINICIAL\\t\\t4.137.000`;\nconst raw=extraerRegistrosTDJTexto(sinEncabezado);\nif(raw.length!==1||raw[0].tdj!=="4911089297230"||raw[0].valor!==4137000)throw new Error("Formato sin encabezado incorrecto");\nconst tdjPequeno=`4911089297230\\t1\\tTDJ\\t5/03/2026\\t\\t\\t157`;\nconst small=extraerRegistrosTDJTexto(tdjPequeno);\nif(small.length!==1||small[0].valor!==157)throw new Error("No se preservó valor TDJ pequeño");\nif(esDocumentoFuenteTDJ("123456789")||!esDocumentoFuenteTDJ("1234567890")||!esDocumentoFuenteTDJ("123456789012345")||esDocumentoFuenteTDJ("1234567890123456"))throw new Error("Límites 10-15 incorrectos");\nconsole.log("PASS TDJ extended: con/sin encabezado, repetición excluida y valor pequeño preservado.");\n'''
          t.write_text(ts,encoding='utf-8')
      - name: Run regression test
        run: node tests/tdj-importador-documento-fuente.mjs
      - name: Check JavaScript syntax
        run: node --check js/tdj.js
      - name: Commit finalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tdj.js tests/tdj-importador-documento-fuente.mjs
          git commit -m "test: preservar comportamiento y ampliar regresión TDJ" || exit 0
          git push origin HEAD:fix/tdj-doc-source-10-15
