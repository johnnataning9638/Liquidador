name: Validación experimental TDJ 204
on:
  push:
    branches:
      - audit/tdj-art9-juanca-204
    paths:
      - scripts/tdj-hotfix-204.py
      - .github/workflows/tdj-hotfix-validation-204.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  comprobar-y-registrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/tdj-art9-juanca-204
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar corrección experimental
        run: python3 scripts/tdj-hotfix-204.py
      - name: Validar sintaxis
        run: node --check js/tdj-core-16.33.143.js
      - name: Ejecutar prueba del fallo y regresiones
        run: |
          node tests/regresion-tdj-beneficios-203.mjs
          node tests/regresion-endoso-tdj-202.mjs
          node tests/regresion-secuencia-tdj-129.mjs
          node tests/regresion-prioridad-pagos-tdj-130.mjs
          node tests/regresion-idempotencia-tdj-132.mjs
          node tests/regresion-saldo-final-134.mjs
      - name: Registrar corrección aprobada solo en rama de auditoría
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tdj-core-16.33.143.js
          git commit -m "fix(tdj): preservar valores de simulación en recálculo v16.33.204"
          git push origin HEAD:audit/tdj-art9-juanca-204
