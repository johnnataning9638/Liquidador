name: Patch TDJ v16.33.135
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          if 'tdj-ui-excel-135' in subprocess.check_output(['git','log','-1','--pretty=%s'],text=True): raise SystemExit(0)
          p=Path('js/tdj.js'); s=p.read_text(encoding='utf-8')
          pairs=[
          ('function init(){\n  obligaciones=[nuevaObligacion(1)];titulos=[nuevoTitulo(1)];renderObligaciones();renderPagos();renderTitulos();','function init(){\n  obligaciones=[nuevaObligacion(1)];titulos=[];renderObligaciones();renderPagos();renderTitulos();'),
          ('if(!titulos.length)titulos=[nuevoTitulo(1)];\n      renderTitulos();','renderTitulos();'),
          ('obligaciones=[nuevaObligacion(1)];titulos=[nuevoTitulo(1)];resultado=null;resultadoDesactualizado=false;','obligaciones=[nuevaObligacion(1)];titulos=[];resultado=null;resultadoDesactualizado=false;'),
          ('// Estado canónico final: una única fila nueva completamente vacía.\n  titulos=[nuevoTitulo(1)];','// Estado canónico final: títulos sin filas hasta que el usuario agregue o importe.\n  titulos=[];'),
          ('titulos=nuevosTitulos.length?nuevosTitulos:[nuevoTitulo(1)];','titulos=nuevosTitulos.length?nuevosTitulos:[];')]
          for a,b in pairs:
              if a not in s: raise SystemExit('patron no encontrado')
              s=s.replace(a,b,1)
          for a,b in {'./utilidades.js?v=16.33.123':'./utilidades.js?v=16.33.135','./motor-liquidacion.js?v=16.33.123':'./motor-liquidacion.js?v=16.33.135','./importador.js?v=16.33.123':'./importador.js?v=16.33.135','./importador-obligacion.js?v=16.33.123':'./importador-obligacion.js?v=16.33.135','./ai-bridge.js?v=16.33.123':'./ai-bridge.js?v=16.33.135','./motor-liquidacion-oficial.js?v=16.33.123':'./motor-liquidacion-oficial.js?v=16.33.135','./supabase-config.js?v=16.33.123':'./supabase-config.js?v=16.33.135','./importador-excel.js?v=16.33.123':'./importador-excel.js?v=16.33.135','./decreto-1419.js?v=16.33.123':'./decreto-1419.js?v=16.33.135','./prioridad-tdj-v132.js?v=16.33.132':'./prioridad-tdj-v132.js?v=16.33.135','./tdj-importador.js?v=16.33.123':'./tdj-importador.js?v=16.33.135','version:"16.33.123-TDJ"':'version:"16.33.135-TDJ"'}.items(): s=s.replace(a,b)
          marker='function leerTitulosTDJRegistradosExcel(rows){'
          helper='''function extraerTitulosTDJRobustoExcel(rows){\n  const out=[];const seen=new Set();\n  const add=(t,f,v,o="")=>{t=numeroTituloImportacion(t);f=fechaTituloImportacion(f);v=valorTituloImportacion(v);if(!t||!f||!(v>0))return;const k=`${t}|${f}|${v}`;if(seen.has(k))return;seen.add(k);out.push({tdj:t,fecha:f,valor:v,observacion:upper(o||"")});};\n  for(let h=0;h<rows.length;h++){const n=(rows[h]||[]).map(normImportacionTDJ);if(!n.includes("TDJ")||!n.includes("FECHA")||!n.some(x=>x.includes("VALOR")))continue;const it=n.findIndex(x=>x==="TDJ"||x.includes("TDJ N")||x==="TITULO"),ifx=n.findIndex(x=>x==="FECHA"||x.includes("FECHA TDJ")||x.includes("FECHA TITULO")),iv=n.findIndex(x=>x==="VALOR"||x.includes("VALOR TDJ")||x.includes("VALOR TITULO")||x==="VALOR ORIGINAL");if(it<0||ifx<0||iv<0)continue;for(let i=h+1;i<rows.length;i++){const r=rows[i]||[];const txt=r.filter(x=>String(x??"").trim()).join(" | ");if(!txt||/^(RECUPERACION COMPLETA|FIN RECUPERACION|OBSERVACION|TOTAL ENDOSO|RESUMEN FINAL)/.test(normImportacionTDJ(txt)))break;let t=r[it],f=r[ifx],v=r[iv];if(!numeroTituloImportacion(t)||!fechaTituloImportacion(f)||!(valorTituloImportacion(v)>0)){const fi=r.findIndex(x=>fechaTituloImportacion(x));if(fi>=0){const c=r.map((x,j)=>({j,x,n:valorTituloImportacion(x)})).filter(x=>x.j!==fi&&x.n>0);const vc=c.find(x=>/[.$]/.test(String(x.x)))||c.at(-1),tc=c.filter(x=>x!==vc).find(x=>String(x.x).replace(/\D/g,"").length>=10)||c.find(x=>x!==vc);if(tc&&vc){t=tc.x;f=r[fi];v=vc.x;}}}add(t,f,v); } if(out.length)return out;} return out;}\n'''
          if marker not in s: raise SystemExit('parser no encontrado')
          s=s.replace(marker,helper+marker,1)
          old='const titulosCanonicos=leerTitulosTDJRegistradosExcel(rows);\n      if(titulosCanonicos.length){\n        nuevosTitulos.length=0;'
          new='const titulosCanonicos=leerTitulosTDJRegistradosExcel(rows);\n      const titulosRobustos=extraerTitulosTDJRobustoExcel(rows);\n      const titulosFuente=titulosRobustos.length>titulosCanonicos.length?titulosRobustos:titulosCanonicos;\n      if(titulosFuente.length){\n        nuevosTitulos.length=0;'
          if old not in s: raise SystemExit('seleccion no encontrada')
          s=s.replace(old,new,1).replace('titulosCanonicos.forEach((t,i)=>{','titulosFuente.forEach((t,i)=>{',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          node --check js/tdj.js
          grep -q 'titulos=\[\];renderObligaciones' js/tdj.js
          grep -q 'function extraerTitulosTDJRobustoExcel' js/tdj.js
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/tdj.js
          git diff --cached --quiet || (git commit -m 'fix: comportamiento filas e importacion Excel TDJ v16.33.135 tdj-ui-excel-135' && git push)
